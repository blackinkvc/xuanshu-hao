q/EQ-480.webp","imgNo":"LG000086","ownerName":"舰内公用","room":null},{"id":"EQ-481","name":"渗透检查机「摹」M-1","cat":"sec","owner":"SHIP","desc":"混入人群做动向侦察与审讯的仿生机体。舰上唯一以「不被认出是机械」为设计目标的装备，因此不配武器、不做抓捕——任何发力动作都会暴露它。","spec":["形制依据：人体工程按在册人口中位数（身高 1.72 m / 肩宽 0.44 m）取型，体温、脉动、呼吸节律按活体曲线驱动，避免任何一项稳态特征偏离人群分布","材质与工艺：陶瓷/碳纤维骨架（体内无大块金属，避开金属探测）· 硅胶-胶原复合仿生皮层（含微血管回路与汗腺孔）· 相变体温层 · 面部微表情由 42 个微型驱动器生成","伪装原理：①仿生皮层下埋微管循环 36.4–37.0 ℃ 流体，红外热像呈现连续体温梯度而非均匀热块；②胸腔负压囊按 12–18 次/分起伏，带 0.3 s 不规则抖动；③瞳孔对光反射延迟 0.12 s（人体 0.1–0.2 s）；④体表持续释放皮脂与汗液挥发物；⑤步态由真人动作捕捉驱动，含 3% 随机偏差，避免周期过于规整","识别手段：①连续 30 s 红外热像看边缘梯度（机械体温边界是锐的，人体是渐变的）；②毫米波/太赫兹看皮下介电常数分层；③步态周期方差（真人 \u003e0.04，本机原厂 \u003c0.01，故必须加偏差）；④微血管灌注与皮肤电反应；⑤门禁身份核验——它有合法身份，但生理特征与档案对不上时由人工复核","数量与配发：4 台（编制上限，不增设）；每台唯一登记号，出动记录不可删改","所属：舰务与安保部 · 直接对舰务与安保部主官负责，不进入常规警备序列","性能参数：续航 18 h；步行速度 0.9–1.4 m/s（随人群）；感知为听觉定向 + 视觉 + 近距离气味采样；不具备格斗能力，最大握力 120 N（低于成年人均值，刻意限死）","失效与风险：①近距红外/太赫兹扫描即暴露，故避开医疗舱与实验区；②长时间执勤后仿生皮层出现色差与毛孔堵塞，需 72 h 保养一次；③一旦被识破，机体内无自毁装置，落入他人之手等于交出整套伪装工艺；④审讯中它只问不抓——抓捕动作的加速度与发力曲线是它最容易露馅的环节，且它无拘捕权","差异说明：与 EQ-480 镇压机兵完全相反的一型：Z-1 靠可见性压制，M-1 靠不可见性取证；两台不编入同一班组"],"tags":["警备与秩序","渗透检查机","M-1"],"file":"assets/lib/eq/EQ-481.webp","imgNo":"LG000087","ownerName":"舰内公用","room":null},{"id":"EQ-482","name":"巡逻机兵「更卒」P-2","cat":"sec","owner":"SHIP","desc":"日常巡逻的轻量机体，负责发现与劝离，不负责压制。轮式底盘 + 单臂，走廊与住区全天候巡回。","spec":["形制依据：轮式底盘适配舰内硬质地面与 8 mm 门槛；机身宽 0.62 m，可贴墙让行；顶部云台高 1.35 m，取人眼高度视角","材质与工艺：铝合金底盘 · 工程塑料外壳 · 单臂碳纤维；外壳分片卡扣，破损单片更换","数量与配发：48 台（按段：每甲板 4–6 台 + 住区每层 1 台）；按班次轮值","所属：舰务与安保部 · 各甲板巡逻段","性能参数：最大速度 2.0 m/s；续航 12 h；感知为可见光 + 热像 + 声学阵列；扩音 95 dB；单臂牵引力 400 N（可推开人员，不可压制）","失效与风险：无致命档、无拘束具，遇暴力事态只能上报并退让；底盘越障能力差，遇泼洒液体或散落货物即停摆；住区夜间巡逻的声光会干扰睡眠，规程限定 22:00–06:00 降为静默巡行","差异说明：与 EQ-483 门岗检验机的区别是「动 vs 定」——P-2 在走廊移动发现异常，G-3 固定在门口做身份核验；两者数据汇入同一张态势图"],"tags":["警备与秩序","巡逻机兵","P-2"],"file":"assets/lib/eq/EQ-482.webp","imgNo":"LG000088","ownerName":"舰内公用","room":null},{"id":"EQ-483","name":"门岗检验机「闸」G-3","cat":"sec","owner":"SHIP","desc":"固定在受控气密单元门口的检验机体，做身份核验与随身物品筛查，不带移动能力。","spec":["形制依据：与气密门框同侧安装，取门宽 0. 密度与流向的粗定位。","spec":["形制依据：直径 28 mm、厚 9 mm 的圆片，可磁吸或背胶固定；按每 40 m² 布 1 枚的密度覆盖公共区域","材质与工艺：ABS 外壳 · 纽扣电池 · 压电薄膜振动传感器；无摄像头，只有振动与气压通道","数量与配发：900 枚（公共区域全覆盖 + 20% 备件）；每 6 个月换电池，到期未换自动上报","所属：舰务与安保部 · 公共区域（食堂、市集、走廊、仪典厅）","性能参数：采样率 20 Hz；有效半径 6 m；只输出「有人/多少/走向」三档，不识别个体；电池寿命 14 个月","失效与风险：只给密度不给身份，单独使用无法定位个人；被遮挡或贴到软质表面即失效；数据可用于推断作息规律，存在被滥用的可能，规程限定只做聚合统计、原始数据 7 日即删","差异说明：与 EQ-502 行为预测分析核是「眼睛 vs 大脑」——浮标只产生低维数据，分析核做推断；浮标本身不做任何判定"],"tags":["占位","警备与秩序","群体态势浮标","SB-9"],"file":"assets/lib/eq/EQ-486.webp","imgNo":"LG000051","ownerName":"舰内公用","room":null},{"id":"EQ-487","name":"束缚躺椅 RS-01","cat":"sec","owner":"SHIP","desc":"审讯室 PC-C-07-R01 的固定躺椅，椅面后仰 17°（可调 12–20°），四肢机械约束 + 可调支臂。被审者取半卧位而非直立位，既限制挣脱，也降低对抗性。","spec":["形制依据：房间 100.8 m²（12.0×8.4×3.0）；椅面后仰 17°（可调 12–20°），座面高 420 mm，头枕高 1020 mm；包络 2100×860×1020 mm；与审讯桌最近处 2.15 m，门至椅主通道 0.90 m 全程不穿越桌区","材质与工艺：深灰金属主框架 · 高密复合面料椅面 · 底座配重 60 kg；框架焊接后去应力，面料可整片拆洗","数量与配发：1 台（整机 185 kg，含配重）；不设第二台，更换须整机吊装","所属：PC-C-07-R01 审讯室 · 舰务与安保部","性能参数：四肢约束点 4（腕 2 / 踝 2）+ 胸带 / 腹带 / 颈托；背板倾角电动调节，单次调角 12 s；承载 150 kg","失效与风险：长时间后仰位会压迫下腔静脉，超过 90 min 须调回 20° 并允许短暂坐起；约束带过紧造成神经压迫，规程要求每 30 min 检查末梢循环；断电后倾角锁死，须手动泄压复位","差异说明：不属于「拘束具」类（EQ-015 / EQ-246）——那些是一次性控制手段，RS-01 是固定装置，只在本房间内使用"],"tags":["警备与秩序","审讯配套","RS-01"],"file":"assets/lib/eq/EQ-487.webp","imgNo":"LG000041","ownerName":"舰内公用","room":null},{"id":"EQ-488","name":"RS-01 约束套件（卡箍/胸腹带/颈托）","cat":"sec","owner":"SHIP","desc":"RS-01 的压覆层构件，落在人体之上的四个卡箍上盖、胸腹带与颈托。属可换耗材，与椅体分开管理。","spec":["形制依据：卡箍内径按腕 58–70 mm、踝 62–78 mm 分档；胸腹带为单点锁扣，拉脱力 4 kN；颈托为限位式，不承重只限转头","材质与工艺：316L 卡箍 · 涤纶编织带（阻燃）· 硅胶内衬；卡箍铰接处为不锈钢销轴，可整体拆下消毒","数量与配发：2 套（1 用 1 备）；每次使用后整套送洗消，不可跨人复用未消毒件","所属：PC-C-07-R01 审讯室 · 与 RS-01 配套存放","性能参数：卡箍抗拉 6 kN；胸腹带抗拉 4 kN；颈托限位角 ±35°；整套 3.8 kg","失效与风险：编织带被汗液与消毒剂反复浸泡后强度衰减，每 200 次使用强制报废；卡箍内衬缺失时金属直接接触皮肤，会造成压疮与勒痕（可作伤情证据，故内衬为强制件）","差异说明：与 EQ-487 是一体两件——椅体固定不动，本套件接触人体、必须每次更换消毒"],"tags":["警备与秩序","审讯配套","RS-01-K"],"file":"assets/lib/eq/EQ-488.webp","imgNo":"LG000042","ownerName":"舰内公用","room":null},{"id":"EQ-489","name":"生理监录台 V-2","cat":"sec","owner":"SHIP","desc":"审讯同步记录台，把被审者的心率、皮电、呼吸、语音基频与视频时间轴对齐存档。只记录，不判定真伪。","spec":["形制依据：与 RS-01 并排布置，操作者视线可同时覆盖椅面与屏幕；采集线束走椅体内部，外部无缠绕","材质与工艺：铝合金机柜 · 钢化玻璃台面 · 医用级电极（干电极，免涂胶）；机柜落地固定，抗震","数量与配发：1 台；与 RS-01 同一房间","所属：PC-C-07-R01 审讯室 · 舰务与安保部","性能参数：心率 30–200 bpm ±1；皮电 0.1–20 μS；呼吸 4–40 次/分；语音 20–20k Hz；记录同步误差 \u003c40 ms；本地存储 2,000 h，写满即锁，不可覆盖","失效与风险：多参量同时越阈只说明「激动」，不等于说谎——规程明文禁止把单一生理指标作为结论；干电极在出汗后接触阻抗上升，数据会出现伪迹，须标注；记录不可删改，但可被「选择性引用」，故要求全段留档","差异说明：与 EQ-494 记忆回读探针不同——V-2 记录的是「当下的生理反应」，探针读取的是「过去的记忆内容」；两者结论不能互相替代"],"tags":["占位","警备与秩序","审讯配套","V-2"],"file":"assets/lib/eq/EQ-489.webp","imgNo":"LG000052","ownerName":"舰内公用","room":null},{"id":"EQ-490","name":"审讯给药支臂 D-3","cat":"sec","owner":"SHIP","desc":"RS-01 侧的可调支臂，挂载按需给药的注射模块，用于镇静、抗焦虑与维持性补液。按次给药，不做持续输注。","spec":["形制依据：支臂三节铰接，末端可达椅面任意点；注射模块为卡匣式，单匣单次，用完即弃","材质与工艺：不锈钢支臂 · 医用聚碳酸酯卡匣 · 一次性针头；支臂关节处有角度刻度，便于复现体位","数量与配发：1 套（支臂）+ 卡匣 60 支/年（按实际审讯人次配）","所属：PC-C-07-R01 审讯室 · 由医疗生体部派员操作，警备人员不得自行给药","性能参数：单次给药量 0.5–10 mL，误差 ±3%；推注速度可设 10–120 s；支臂承载 2 kg","失效与风险：镇静剂过量会抑制呼吸，故必须与 V-2 的呼吸通道联动，越阈自动停推；卡匣无身份识别，错装只能靠人工核对标签；给药记录与药房台账双签，缺一即视为违规","差异说明：与 EQ-498 皮下定时给药泵的分工是「审讯室内按次」vs「长期埋植按时」——D-3 用在房间内、由医护手动确认，498 用在室外、无人值守"],"tags":["警备与秩序","审讯配套","D-3"],"file":"assets/lib/eq/EQ-490.webp","imgNo":"LG000043","ownerName":"舰内公用","room":null},{"id":"EQ-491","name":"单向观察与取证墙","cat":"sec","owner":"SHIP","desc":"审讯室与观察间之间的单向观察墙，含多机位取证与声学隔离。用于见证与复核，不参与审讯。","spec":["形制依据：观察窗净尺寸 1.8×1.2 m，窗台高 1.0 m；观察间与审讯室声学隔离 ≥45 dB，审讯室内不可闻观察间动静","材质与工艺：夹层单向玻璃（审讯侧镜面、观察侧透明）· 钢框 · 窗内嵌 3 机位；玻璃为夹胶安全玻璃，受冲击不飞散","数量与配发：1 套（窗 + 3 机位 + 录音）；随审讯室建成，不单独迁移","所属：PC-C-07-R01 审讯室与相邻观察间 · 舰务与安保部","性能参数：玻璃透光率（观察侧）72%；机位为 1 全景 + 1 正面特写 + 1 手部；录音 48 kHz；存储与 V-2 时间轴对齐","失效与风险：审讯侧照明过亮时镜面反射会破坏单向性，被审者可能看见观察间；夹层玻璃一旦受击产生裂纹，整块须更换（不能修补）；三机位存在死角，规程要求全景机不得变焦","差异说明：与 EQ-489 生理监录台互补——V-2 记生理，本墙记行为与证词；两者共用同一条时间轴"],"tags":["占位","警备与秩序","审讯配套","OW-1"],"file":"assets/lib/eq/EQ-491.webp","imgNo":"LG000053","ownerName":"舰内公用","room":null},{"id":"EQ-492","name":"神经抑制环 N-1","cat":"sec","owner":"SHIP","desc":"颈戴式经颅低幅抑制环，压制攻击冲动与急性躁动，用于约束前的过渡手段。作用是「降一档」而不是「关机」。","spec":["形制依据：环体内径按颈围 340–420 mm 分档；电极位按运动皮层与边缘系统投影布置，单次作用 20 min 为上限","材质与工艺：钛环 · 医用硅胶电极 · 限流电路（硬件限幅，不可软件突破）；限流值烧录在只读芯片上","数量与配发：6 具（审讯室 2 / 各甲板警备位 4）；按次领用，用后归还登记","所属：舰务与安保部 · 与医疗生体部共管；对在册人员使用须医务在场","性能参数：输出 0.2–1.2 mA、频率 0.5–8 Hz；起效 90 s，单次 ≤20 min，两次间隔 ≥40 min；作用期间定向力下降约 30%","失效与风险：①超过 20 min 会造成短期记忆断片与持续 2–6 h 的反应迟钝；②癫痫史、颅内植入物、妊娠为绝对禁忌；③反复使用产生耐受，需递增电流，而递增会放大后遗症；④压制的是「表达」不是「成因」，停药后冲动回弹，可能更强","差异说明：与 EQ-055 情绪阻尼片方向相反——055 是佩戴者自愿、自用、低幅缓解；N-1 是他用、强制、以压制为目的，故列入管控件而非医疗件"],"tags":["警备与秩序","精神控制","N-1"],"file":"assets/lib/eq/EQ-492.webp","imgNo":"LG000044","ownerName":"舰内公用","room":null},{"id":"EQ-493","name":"情绪压制贴片 A-2","cat":"sec","owner":"SHIP","desc":"贴在颈后或上臂的透皮贴片，持续释放低剂量镇静成分，把情绪波动压平。审讯与押解途中使用，72 h 上限。","spec":["形制依据：贴片 40×40 mm，透皮面积 12 cm²；释放曲线为前 2 h 快速起效、之后平稳，72 h 后衰减","材质与工艺：背衬 PET · 储库式凝胶 · 控释膜；控释膜孔径决定释放速率，不同批次有 ±8% 偏差","数量与配发：400 片/年（耗材）；按审讯与押解人次申领，用后回收销毁","所属：舰务与安保部 · 审讯室与押解勤务；医疗生体部备案","性能参数：有效成分释放 25 μg/h（前 2 h 为 60 μg/h）；起效 25 min；持续 72 h；不影响意识与言语能力","失效与风险：①长期使用造成情感钝化，停药后 3–7 日出现反跳性焦虑；②贴片受热（\u003e40 ℃）释放速率翻倍，热水浴或高温舱段会过量；③不能与酒精同用，舰上禁酒恰好掩盖了这一条；④压平的是情绪表达，被审者可能「看起来很配合」而实际记忆更混乱","差异说明：与 EQ-492 神经抑制环的区别是「化学 vs 电」——A-2 起效慢、持续长、不影响定向力；N-1 起效快、持续短、定向力下降明显，用于紧急压制"],"tags":["占位","警备与秩序","精神控制","A-2"],"file":"assets/lib/eq/EQ-493.webp","imgNo":"LG000054","ownerName":"舰内公用","room":null},{"id":"EQ-494","name":"记忆回读探针 MR-1","cat":"sec","owner":"SHIP","desc":"非侵入式记忆回读设备，用定向近红外与脑电联合解码，把受试者回忆时的脑活动还原为图像碎片与关键词。只能读「正在回忆的内容」，不能主动检索。","spec":["形制依据：头戴式阵列，覆盖额叶与颞叶；须在暗室与低电磁干扰环境使用，故固定在审讯室与实验舱各一套","材质与工艺：柔性电极阵列（干电极 64 通道）· 近红外发射/接收对管 · 碳纤维头架；头架按头围三档调节","数量与配发：2 套（审讯室 1 / 实验舱 1）；不外借","所属：舰务与安保部 · 与实验与观测部门共管","性能参数：时间分辨率 10 ms；空间分辨率约 8 mm（皮层表面）；单次会话 ≤45 min；解码输出为 320×240 图像碎片与 20–50 个关键词，无音频","失效与风险：①只能解出「显著情绪标记」的记忆，日常琐事几乎读不出，成功率随记忆年龄快速下降；②受试者的想象与真实回忆在解码端无法区分，会产出「看起来像真的」的伪记忆片段；③45 min 以上出现头痛、恶心、短暂词语提取困难；④结果不能单独作为证据，规程要求必须与物证或证词交叉","差异说明：与 EQ-495 记忆改写套件的边界是「读 vs 写」——MR-1 只读不写，也不做催眠诱导；两者虽同源，但 MR-1 的风险等级低一档，可常规使用"],"tags":["警备与秩序","精神控制","MR-1"],"file":"assets/lib/eq/EQ-494.webp","imgNo":"LG000045","ownerName":"舰内公用","room":null},{"id":"EQ-495","name":"记忆改写套件 MW-1","cat":"sec","owner":"SHIP","desc":"在 MR-1 定位基础上施加靶向抑制，削弱特定记忆的情绪强度或抹去片段。舰上管控最严的一件，需三重授权，且不可逆。","spec":["形制依据：须与 MR-1 联用，定位精度决定改写范围；单次靶向窗口 \u003c6 s 脑活动，超过即扩散","材质与工艺：经颅磁刺激线圈 · 靶向抑制剂（蛋白合成抑制剂，单次剂量 0.3 mg/kg）· 一次性电极；药剂冷链存放","数量与配发：1 套；药剂 20 剂/年（配额制，超配额须舰务会议批准）","所属：舰务与安保部 · 医疗生体部 · 民政与司法三方共管","性能参数：单次改写窗口 3–6 s；起效 20–40 min；对 72 h 内新记忆的削弱率约 60%，对 1 年以上旧记忆不足 25%；不可逆","失效与风险：①改写不可逆，写错无法恢复；②靶向偏差会连带抹掉相邻记忆，出现「记得事情但忘了人」的断裂；③约 15% 受试者出现持续数周的情绪不稳与失眠；④药物剂量与体重、肝功强相关，舰上无法做全项检测，只能按标准体重估算；⑤伦理底线：仅用于本人书面同意或军事法庭裁定，禁止作为常规审讯手段","差异说明：与 EQ-494 是同一技术链的下一环，但风险等级完全不同——MR-1 可常规、MW-1 需裁定；舰上不把 MW-1 当作「让犯人认罪」的工具，因为它改的是记忆不是事实"],"tags":["占位","警备与秩序","精神控制","MW-1"],"file":"assets/lib/eq/EQ-495.webp","imgNo":"LG000055","ownerName":"舰内公用","room":null},{"id":"EQ-496","name":"痛觉调节器 P-3","cat":"sec","owner":"SHIP","desc":"双向痛觉调节设备：一档镇痛（审讯中防止休克），一档放大（作为审讯压力手段）。放大档受硬件与规程双重限制。","spec":["形制依据：手持式主机 + 两片贴片，贴于痛觉传导路径（腕/踝）；主机上有物理档位锁，放大档需钥匙","材质与工艺：铝合金主机 · 医用电极贴片 · 机械钥匙锁；钥匙由当班警备长与医务各持一把，双钥匙同时插入才解锁","数量与配发：3 台（审讯室 1 / 医疗舱 1 / 备件 1）；钥匙 6 把，分开保管","所属：舰务与安保部 · 医疗生体部共管","性能参数：镇痛档为闸门控制式电刺激，强度 0–40 mA；放大档为痛觉通路增益 1.0–2.5 倍，单次 ≤90 s，两次间隔 ≥10 min；两档互斥","失效与风险：①放大档造成的是痛觉敏化，72 h 内痛阈下降，可能转为慢性疼痛；②心血管疾病者可能诱发心律失常，故医疗必须在场；③90 s 上限被突破即构成伤害，硬件计时器独立于软件；④镇痛档掩盖伤情，审讯后须做完整体检；⑤舰上规程把放大档列为「最后手段」，使用须全程录像并事后审查","差异说明：与 EQ-492 神经抑制环作用于「情绪与冲动」不同，P-3 直接作用于「痛觉传导」；与 EQ-247 电击脉冲杆的区别是 247 是瞬间致痛失能、P-3 是可控的持续增益，前者不可调、后者可调但风险更集中"],"tags":["占位","警备与秩序","精神控制","P-3"],"file":"assets/lib/eq/EQ-496.webp","imgNo":"LG000056","ownerName":"舰内公用","room":null},{"id":"EQ-497","name":"植入式服从模块 O-1","cat":"sec","owner":"SHIP","desc":"皮下植入的惩戒-抑制模块，用于重刑替代与假释监管。接受指令时给轻微提示，违反时给惩戒脉冲。舰上把它当刑罚而非装备使用。","spec":["形制依据：模块 22×14×6 mm，植入于锁骨下或腹侧皮下；与 EQ-051 圆形植入端口同族但独立供电，不共用端口","材质与工艺：钛壳 · 锂亚硫酰氯电池 · 双电极（绕神经束）· 只读指令表；壳体激光焊封，不可开壳维修","数量与配发：30 套（对应 30 名受监管人员，编制上限）；每套绑定一人一档，人死即注销，不得转用","所属：舰务与安保部 · 民政与司法部共管；植入须军事法庭裁定 + 本人（或监护人）书面同意","性能参数：电池寿命 36 个月（到期必须手术更换）；惩戒脉冲 0.5–8 mA、单次 ≤3 s；指令表烧录后不可远程改写，只能换模块；有效通信半径 15 m","失效与风险：①惩戒脉冲本质是电击，反复触发造成局部组织纤维化与神经损伤；②电池耗尽前 30 日预警，但手术更换本身有感染风险（舰上感染率待实测）；③模块可被强磁场或定向脉冲干扰，干扰期间等于失效；④心理后果明确：受监管者出现预期性焦虑与自我审查，即使不违规也长期处于应激；⑤逃逸者若强行取出模块，会造成大出血——这一条被批评为「以身体为锁」","差异说明：与 EQ-499 依从性监测腕环的区别是「惩戒 vs 提示」——本模块有脉冲电极，499 只有记录与提示音；舰上不同时给同一人装两套"],"tags":["警备与秩序","服从","O-1"],"file":"assets/lib/eq/EQ-497.webp","imgNo":"LG000046","ownerName":"舰内公用","room":null},{"id":"EQ-498","name":"皮下定时给药泵 O-2","cat":"sec","owner":"SHIP","desc":"埋植式微量泵，按预设方案持续释放维持药物（替代疗法、抗排斥、依从性药物）。与 O-1 可组合但供电独立。","spec":["形制依据：泵体 Ø34×12 mm，植入腹侧皮下；储药腔 3 mL，经导管送至目标静脉或皮下","材质与工艺：钛壳 · 硅胶隔膜（可经皮穿刺补药）· 微型蠕动泵；导管为医用硅胶，接头双重锁固","数量与配发：30 套（与 O-1 配套 28 套 + 独立医疗用途 2 套）；每 28 日补药一次","所属：舰务与安保部 · 医疗生体部（补药与调参由医护执行）","性能参数：释放速率 0.02–2 mL/24h，误差 ±5%；储药 3 mL；补药穿刺寿命 500 次；电池 24 个月","失效与风险：①导管堵塞或移位会造成药物蓄积，一次释放过量可致命；②补药穿刺感染是主要并发症；③泵体故障时无法从外部判断，只能靠血药浓度监测发现；④被监管者可能自行挤压泵体加速释放（自伤式规避），故泵体埋深 ≥8 mm","差异说明：与 EQ-490 审讯给药支臂的区别是「长期埋植 vs 单次推注」；与 EQ-497 服从模块的分工是「给药 vs 惩戒」，两者可并存但不同源"],"tags":["占位","警备与秩序","服从","O-2"],"file":"assets/lib/eq/EQ-498.webp","imgNo":"LG000057","ownerName":"舰内公用","room":null},{"id":"EQ-499","name":"依从性监测腕环 O-3","cat":"sec","owner":"SHIP","desc":"受监管人员佩戴的监测腕环，记录位置、活动量与给药依从性，不做惩戒。与门禁腕带（EQ-218）不同族。","spec":["形制依据：环体内径 55–72 mm，一次性锁扣，戴上后不可自行取下；表体 38×30×11 mm","材质与工艺：工程塑料 · 不锈钢锁扣 · 单芯锂电；锁扣为单向棘齿，断开即留永久痕迹","数量与配发：60 只（受监管 30 人 ×2 备用）；每人一只，换环须双人在场","所属：舰务与安保部 · 民政与司法部","性能参数：定位为舰内 UWB 三角，精度 1.5 m；活动量为三轴加速度；续航 18 个月；每 5 min 上报一次；离线缓存 12 h","失效与风险：①UWB 在金属密集区（机库、货舱）定位漂移，会出现「人不在应在位置」的误报；②腕环只证明「环在」，不能证明「人在」——可被取下绑在他人身上；③长期佩戴造成腕部皮肤浸渍与压痕；④数据被用于推断作息，属隐私敏感，规程限定只向监管官与司法方开放","差异说明：与 EQ-218 门禁腕带完全不同：218 是「通行钥匙」，O-3 是「监管标签」，前者主动开门、后者只被动上报"],"tags":["警备与秩序","服从","O-3"],"file":"assets/lib/eq/EQ-499.webp","imgNo":"LG000047","ownerName":"舰内公用","room":null},{"id":"EQ-500","name":"违约惩戒脉冲单元 O-4","cat":"sec","owner":"SHIP","desc":"与 O-1 配套的触发单元，判定违约并下发惩戒。判定逻辑固化在硬件里，不联网。","spec":["形制依据：单元为固定式（装于监管区入口），覆盖半径 15 m；与 O-1 一对一配对，配对后不可改绑","材质与工艺：铝合金壳体 · 只读判定芯片 · 手动确认按钮；判定表烧录在一次性熔断芯片内","数量与配发：30 台（与 O-1 一一对应）；随 O-1 一并安装与拆除","所属：舰务与安保部 · 监管区","性能参数：触发条件为「越界」或「违规指令确认」两类，其余情形不触发；触发后 3 s 内可手动撤销；单日触发上限 3 次，超限锁定待人工复核","失效与风险：①误判会造成无过错惩戒，故设 3 s 撤销窗与每日上限；②被监管者学会在阈值边缘试探，导致惩戒集中在少数人身上；③单元与 O-1 的配对链路可被干扰，干扰期间不惩戒也不告警——等于短暂自由；④手动撤销按钮需要人值守，无人值守时形同虚设","差异说明：与 EQ-497 服从模块是一体两面——O-1 是「执行端」，O-4 是「判定端」；单有 O-1 无法自动惩戒，单有 O-4 无处施力"],"tags":["占位","警备与秩序","服从","O-4"],"file":"assets/lib/eq/EQ-500.webp","imgNo":"LG000058","ownerName":"舰内公用","room":null},{"id":"EQ-501","name":"步态核验柱 I-1","cat":"sec","owner":"SHIP","desc":"走廊立柱式步态识别装置，在人不配合、不摘口罩、不带卡的情况下做连续身份核验。与门禁不同，它不需要人停下。","spec":["形制依据：柱高 2.2 m，传感器朝下 15° 覆盖 6 m 走廊段；按每 60 m 走廊布 1 根","材质与工艺：不锈钢立柱 · 广角可见光 + 深度相机 · 边缘计算模块；立柱内散热风道独立于舱内环控","数量与配发：24 根（主走廊与公共区）；与 EQ-502 分析核联网","所属：舰务与安保部 · 公共走廊；数据接入行为分析核","性能参数：识别距离 1–6 m；步态库容量 3,000 人；单人识别 \u003c1.2 s；在册人员首选命中率约 92%（依赖步态库质量）；不依赖面部","失效与风险：①步态随伤病、负重、疲劳改变，受伤后 2 周内识别率明显下降；②人群密集时目标切换错误，会给出「同一人出现在两处」的矛盾记录；③可被刻意改变步态规避；④连续核验构成行踪记录，属高敏感数据，规程限定只用于异常事件回溯，不做实时告警","差异说明：与 EQ-504 掌静脉核验台是「路过 vs 站定」——I-1 做无感粗筛，504 做主动精核；两者结论冲突时以 504 为准"],"tags":["占位","警备与秩序","识别追踪","I-1"],"file":"assets/lib/eq/EQ-501.webp","imgNo":"LG000059","ownerName":"舰内公用","room":null},{"id":"EQ-502","name":"行为预测分析核 I-2","cat":"sec","owner":"SHIP","desc":"舰内摄像与传感网的后端分析核，做异常行为聚类与风险评分。输出的是「建议关注」，不是「有罪判定」。","spec":["形制依据：机柜式，装于超算舱（RM-08 邻近），占用 4 个标准机位；功耗 3.2 kW，接入舰内网独立分区","材质与工艺：标准 19 英寸机柜 · 液冷模块 · 冗余电源；数据盘为可插拔阵列，离职即物理销毁","数量与配发：1 套（3 节点）；不设第二套，避免双份模型漂移","所属：舰务与安保部 · 超算舱；模型变更须舰务会议备案","性能参数：接入 I-1 步态、G-3 门禁、SB-9 浮标与摄像网；单日处理约 40 万条事件；风险评分为 0–100，\u003e70 触发人工复核；模型每 6 个月复训一次","失效与风险：①评分基于历史数据，会放大既有偏见（例如对某类岗位的过度关注）；②异常定义为统计偏离，正常但少见的行为会被误报；③模型不可解释，无法向被评分者说明「为什么是你」；④一旦被当作事实使用，等于用概率定罪——规程明文规定评分不得作为处罚依据，只可作为巡查优先级","差异说明：与 EQ-501 的关系是「大脑 vs 感官」——501 只产生特征，本核只做推断；与 EQ-493 情绪压制贴片无功能重叠（一个推断群体风险、一个干预个体状态）"],"tags":["占位","警备与秩序","识别追踪","I-2"],"file":"assets/lib/eq/EQ-502.webp","imgNo":"LG000060","ownerName":"舰内公用","room":null},{"id":"EQ-503","name":"定向密语拾音贴 I-3","cat":"sec","owner":"SHIP","desc":"贴附式定向拾音器，只拾取正前方 30° 锥内的语音，用于嘈杂环境下的密语取证。不含录音回传，本地存卡。","spec":["形制依据：圆片 Ø46 mm、厚 7 mm，背胶或磁吸；拾音锥 30°，有效距离 0.5–4 m","材质与工艺：ABS 外壳 · MEMS 麦克风阵列（4 元）· 本地闪存；无射频发射模块（刻意不装）","数量与配发：500 片/年（耗材，贴后即弃）；按取证需要申领","所属：舰务与安保部 · 取证勤务；数据须回所内导出，不得现场传输","性能参数：指向性抑制侧向 18 dB；频响 100–8k Hz；本地存 72 h；电池 96 h；须在 4 m 内且无遮挡","失效与风险：①无射频即无法远程取回，贴出去要靠人回收；②舱内环控噪声（送风 55 dB）会淹没低语音量；③贴在金属表面产生共振，语音失真；④拾音锥固定，目标转头即失效；⑤无回传设计是为了防止滥用，但也意味着取证窗口只有一次","差异说明：与 EQ-054 舱内中继记录芯不同——054 是佩戴者自带的环状缓存，本片是他人布设的定向拾音；两者都不做实时监听"],"tags":["占位","警备与秩序","识别追踪","I-3"],"file":"assets/lib/eq/EQ-503.webp","imgNo":"LG000061","ownerName":"舰内公用","room":null},{"id":"EQ-504","name":"掌静脉核验台 I-4","cat":"sec","owner":"SHIP","desc":"独立式掌静脉 + 指纹双模核验台，用于建立临时档案与高置信身份确认。比门禁严格，比步态可靠。","spec":["形制依据：台式，核验面高 1.05 m；掌静脉采集窗 90×90 mm，带定位柱保证手位一致","材质与工艺：铝合金机身 · 近红外光源（850 nm）· 钢化玻璃采集窗；机身可整台搬动，但需重新标定","数量与配发：18 台（审讯室 1 / 医疗 3 / 实验 3 / 指挥 4 / 机库 3 / 民政 4）","所属：舰务与安保部 · 各受控区；与 EQ-217 身份卡互为备份","性能参数：掌静脉误识率 \u003c0.002%，拒真率约 1%；单次核验 2.5 s；可离线建档 200 人；不存储原始图像，只存特征模板","失效与风险：①手部外伤、冻伤、长期接触化学品会改变静脉纹理，需重新建档；②0 g 段手掌漂浮难以稳定贴合定位柱，须加腕部约束；③临时档案若无注销机制会长期留存，规程要求任务结束 30 日内删除；④采集窗被污染即拒真，表现为「谁都过不了」","差异说明：与 EQ-483 门岗检验机同为掌静脉核验，但 G-3 嵌入式、只判通行；I-4 可独立建档、可核验无卡人员，是补录与复核用的那一级"],"tags":["占位","警备与秩序","识别追踪","I-4"],"file":"assets/lib/eq/EQ-504.webp","imgNo":"LG000062","ownerName":"舰内公用","room":null},{"id":"EQ-505","name":"舱段痕迹标记剂 T-5","cat":"sec","owner":"SHIP","desc":"隐形荧光标记剂，涂在把手、阀轮、货箱扣等接触点，用于判断「谁碰过」。显影需专用光源。","spec":["形制依据：单剂 5 mL，可涂 20–30 个接触点；标记层厚度 \u003c10 μm，不改变手感与外观","材质与工艺：荧光素类化合物 + 挥发性载体；载体 30 min 挥发，荧光层留存 90 日；显影光源 365 nm","数量与配发：200 剂/年（耗材）；按调查需要申领，领用登记到人","所属：舰务与安保部 · 调查勤务","性能参数：显影为紫外灯下呈黄绿色；转移率约 35%（接触后带至手套/衣物）；可检出时限 90 日（视擦拭频次）；不影响食品安全（食品接触面禁用）","失效与风险：①转移率有限，未检出不等于未接触；②会被常规清洁擦除，清洁频次高的区域基本无效；③标记剂本身可被检测，知情者会戴手套规避；④误用于食品接触面属违规，故规程列出禁用清单；⑤不能区分「故意接触」与「无意擦碰」","差异说明：与 EQ-501 步态核验柱是「结果 vs 过程」——I-1 记录谁经过，T-5 证明谁碰过具体物件；单用任一都不足以定论"],"tags":["占位","警备与秩序","识别追踪","T-5"],"file":"assets/lib/eq/EQ-505.webp","imgNo":"LG000063","ownerName":"舰内公用","room":null}]}}</script>
