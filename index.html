/* ===================== 总览改版 · 实体相框 / 悬浮主位 / 角色资料 / 头像墙 ===================== */
.ov-stage{grid-template-columns:236px minmax(0,1fr) 352px;align-items:start}
.ov-side{padding:16px 14px}
.ov-left{padding:14px 12px 16px}
.ov-right{padding:14px 16px 16px;max-height:666px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2d4356 transparent;gap:11px}
.ov-right .ov-field{padding-top:6px}
.ov-right .ov-nameblk{padding-bottom:8px}
.ov-right .ov-radar{margin:0 auto}
.ov-right::-webkit-scrollbar{width:4px}
.ov-right::-webkit-scrollbar-thumb{background:#2d4356;border-radius:3px}
.ov-frames{display:flex;flex-direction:column;gap:14px;max-height:640px;overflow-y:auto;padding-right:4px;
  scrollbar-width:thin;scrollbar-color:#2d4356 transparent}
.ov-frames::-webkit-scrollbar{width:4px}
.ov-frames::-webkit-scrollbar-thumb{background:#2d4356;border-radius:3px}

/* 实体相框：外框 + 内衬 + 画芯 + 玻璃反光 + 投影 */
.ov-frame{position:relative;margin:0;padding:9px;border-radius:2px;
  background:linear-gradient(150deg,#3a2c1c 0%,#21180f 46%,#170f09 100%);
  border:1px solid #4a3823;
  box-shadow:0 16px 30px rgba(0,0,0,.62),inset 0 2px 0 rgba(255,226,170,.12),inset 0 -2px 6px rgba(0,0,0,.7)}
.ov-frame::before{content:"";position:absolute;inset:4px;pointer-events:none;border-radius:1px;
  border:1px solid rgba(232,192,114,.34);box-shadow:0 0 0 1px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,230,180,.18)}
.ov-frame .pic{position:relative;background:#07090c;padding:5px;overflow:hidden;
  box-shadow:0 0 0 1px #0b0c0e,inset 0 0 16px rgba(0,0,0,.9)}
.ov-frame img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 18%}
.ov-frame .pic::after{content:"";position:absolute;inset:5px;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.04) 26%,transparent 42%,transparent 68%,rgba(255,255,255,.05) 100%)}
.ov-frame figcaption{display:flex;align-items:center;justify-content:space-between;gap:6px;
  margin-top:7px;padding:0 1px 1px;font:600 8.5px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.8px;color:#b99a63;white-space:nowrap;overflow:hidden}
.ov-frame figcaption b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.ov-frame .idx{color:#6d5a3c;flex:0 0 auto}

/* 中间悬浮主位：CSS 只负责摆放与尺寸，光效全部来自图片本身 */
.ov-figure img,.ov-figure.cut img{max-height:min(580px,68vh);border-radius:0;
  box-shadow:none;filter:none;-webkit-mask-image:none;mask-image:none}
.ov-figure.soft img{max-height:min(540px,64vh);filter:none;box-shadow:none;
  -webkit-mask-image:radial-gradient(ellipse 76% 92% at 50% 44%,#000 56%,rgba(0,0,0,.55) 78%,transparent 100%);
  mask-image:radial-gradient(ellipse 76% 92% at 50% 44%,#000 56%,rgba(0,0,0,.55) 78%,transparent 100%)}
.ov-aura,.ov-plinth,.ov-figure::after{display:none!important}

/* 底部头像墙：正方形、可多行铺开 */
.ov-dockrow{display:block}
.ov-nav{display:none}
.ov-strip{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:8px;
  max-width:none;width:100%;margin:0;padding:0;overflow:visible}
.ov-av{width:auto;height:auto;flex:none;aspect-ratio:1/1;border-radius:2px}
.ov-av img{object-position:50% 26%}
.ov-av .no{font-size:8px}
.ov-av.on{transform:none;box-shadow:inset 0 0 0 1px var(--hud),0 0 0 1px rgba(var(--hud-rgb),.55),0 0 16px rgba(var(--hud-rgb),.4)}
.ov-tip{margin-top:8px}

@media (max-width:1180px){
  .ov-stage{grid-template-columns:206px minmax(0,1fr) 300px}
  .ov-right{max-height:600px}
  .ov-frames{max-height:580px}
  .ov-frame{padding:8px}
}
@media (max-width:900px){
  .ov-stage{grid-template-columns:minmax(0,1fr)}
  .ov-right{max-height:none;overflow:visible}
  .ov-left{order:2;padding:14px 16px}
  .ov-frames{flex-direction:row;max-height:none;overflow-x:auto;overflow-y:hidden;gap:12px;padding-bottom:4px;scrollbar-width:none}
  .ov-frames::-webkit-scrollbar{display:none}
  .ov-frame{flex:0 0 132px;padding:7px}
  .ov-strip{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px}
}
@media (max-width:640px){
  .ov-left{display:block}
  .ov-frame{flex:0 0 118px}
  .ov-strip{grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
  .ov-av .no{font-size:7px}
}

/* ===================== 人物 · 装备 · 舱室 重排为舰桥终端语言 ===================== */
body.dark{--hud:var(--hud);--hud-soft:rgba(var(--hud-rgb),.32);--hud-line:var(--line);--hud-line2:var(--line2);
  --panel:rgba(var(--panel-rgb),.72);--line:var(--line);--line2:var(--line2);
  --text:var(--ink-1);--muted:var(--ink-4);--faint:var(--ink-5);--amber:var(--amber)}
.hud-page{color:var(--ink-1)}
.hud-page a{color:inherit;text-decoration:none}
.hud-page a:hover{text-decoration:none}
.hud-panel{position:relative;background:rgba(var(--panel-rgb),.72);border:1px solid var(--line);border-radius:2px}
.gear-index,.gear-cmd,.rooms-cmd,.deck-seg,.rdetail,.crew-idbar,.crew-grid3,.dossier-sec{border-radius:2px}
.hud-brk::before,.hud-brk::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none;
  border:0 solid var(--hud);opacity:.7;z-index:3}
.hud-brk::before{left:-1px;top:-1px;border-left-width:1px;border-top-width:1px}
.hud-brk::after{right:-1px;bottom:-1px;border-right-width:1px;border-bottom-width:1px}
.hud-k{font:600 8.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2.6px;
  color:var(--ink-4);text-transform:uppercase}
.hud-k::before{content:"// ";color:var(--hud);opacity:.9}
.hud-mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.hud-chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;
  border:1px solid var(--line3);background:rgba(var(--panel-rgb),.6);color:var(--ink-2);
  font:600 9.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.3px;cursor:pointer;white-space:nowrap}
.hud-chip:hover{border-color:var(--line5);color:var(--hud-ink)}
.hud-chip.on{border-color:var(--hud);background:rgba(var(--hud-rgb),.1);color:var(--hud-4)}
.hud-chip i{font-style:normal;color:var(--ink-4);letter-spacing:.5px}
.hud-chip.on i{color:var(--hud-3)}
.hud-input{display:flex;align-items:center;gap:7px;height:26px;padding:0 9px;border:1px solid var(--line3);
  background:rgba(var(--panel-rgb),.6);min-width:0;flex:1 1 180px;max-width:300px}
.hud-input svg{width:11px;height:11px;stroke:var(--ink-5);fill:none;stroke-width:1.9;flex:0 0 auto}
.hud-input input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink-1);
  font:11px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.4px}
.hud-input input::placeholder{color:var(--ink-5)}
.hud-select{height:26px;border:1px solid var(--line3);background:rgba(var(--panel-rgb),.6);color:var(--ink-2);
  padding:0 8px;font:11px/1 ui-monospace,SFMono-Regular,Consolas,monospace;outline:0;max-width:220px}
.hud-status{display:inline-flex;align-items:center;gap:5px;font:600 9.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.8px;color:var(--ok);white-space:nowrap}
.hud-status::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 7px currentColor}
.hud-status.warn{color:var(--amber)}
.hud-status.off{color:var(--ink-3)}
.hud-miss{font:600 8.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.8px;color:var(--amber);
  border:1px solid rgba(var(--amber-rgb),.45);padding:2px 5px;white-space:nowrap}
@keyframes hudIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.hud-page{animation:hudIn .28s ease both}
body.no-motion .hud-page{animation:none}
@media (prefers-reduced-motion: reduce){.hud-page{animation:none}}

/* ---- 页头 · 身份条 ---- */
.crumb-hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;
  font:600 8.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.8px;color:var(--ink-5)}
.crumb-hud a{color:var(--ink-4)}
.crumb-hud a:hover{color:var(--hud-4)}
.crumb-hud .sl{color:var(--line4)}
.crumb-hud .cur{color:var(--hud-2)}
.crumb-hud .back{margin-left:auto;color:var(--hud-3);border:1px solid rgba(var(--hud-rgb),.32);
  padding:4px 9px;letter-spacing:1.1px;white-space:nowrap}
.crumb-hud .back:hover{border-color:rgba(var(--hud-rgb),.7);color:var(--hud-ink)}
.crew-idbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 22px;align-items:center;
  padding:13px 16px 12px;margin-bottom:12px;background:rgba(var(--panel-rgb),.72);border:1px solid var(--line);
  border-left:2px solid var(--accent,var(--hud))}
.crew-idbar.hud-brk::before,.crew-idbar.hud-brk::after{border-color:var(--accent,var(--hud))}
.idbar-main{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.idbar-no{font:600 9.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2.2px;color:var(--hud)}
.idbar-main h1{margin:0;font-size:22px;line-height:1.15;letter-spacing:3px;color:var(--ink-0);font-weight:600}
.idbar-en{font:600 9.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2.4px;color:var(--ink-4)}
.idbar-role{font-size:11.5px;color:var(--ink-2);letter-spacing:.4px;min-width:0}
.idbar-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:1px;color:var(--ink-5)}
.idbar-meter{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.idbar-meter .mb{flex:1;height:2px;background:var(--line2);overflow:hidden}
.idbar-meter .mb i{display:block;height:100%;background:var(--accent,var(--hud));box-shadow:0 0 8px rgba(var(--hud-rgb),.5)}
.idbar-meter .mv{font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.2px;color:var(--ink-3);white-space:nowrap}
.idbar-meter .mv b{color:var(--ink-1);font-weight:600}

/* ---- 舰员横向选择轨 ---- */
.crew-rail{display:flex;align-items:center;gap:5px;margin:-2px 0 16px;min-width:0}
.crew-rail .rnav{flex:0 0 22px;width:22px;height:38px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line3);background:rgba(var(--panel-rgb),.5);color:var(--ink-3);font-size:13px;cursor:pointer}
.crew-rail .rnav:hover{border-color:var(--line5);color:var(--hud)}
.crew-rail .rnav:disabled{opacity:.25;cursor:not-allowed}
.crew-rail .rlist{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;padding:1px 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.crew-rail .rlist::-webkit-scrollbar{display:none}
.rpick{flex:0 0 auto;display:flex;align-items:baseline;gap:5px;height:38px;padding:0 9px;
  border:1px solid var(--line3);background:rgba(var(--panel-rgb),.4);color:var(--ink-3);white-space:nowrap}
.rpick b{font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.8px;color:var(--ink-4)}
.rpick span{font-size:11px;letter-spacing:.5px}
.rpick:hover{border-color:var(--line5);color:var(--ink-1)}
.rpick.on{border-color:var(--accent,var(--hud));background:rgba(var(--hud-rgb),.08);color:var(--ink-0)}
.rpick.on b{color:var(--accent,var(--hud))}
.rpick.on span{font-weight:600}
.rpick .rm{font:600 8px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--amber);letter-spacing:0}

/* ---- 人物三栏 ---- */
.crew-grid3{display:grid;grid-template-columns:184px minmax(0,1fr) 300px;gap:0;align-items:start;
  border:1px solid var(--line);background:rgba(var(--bg2-rgb),.55);margin-bottom:16px}
.crew-arc{padding:14px 13px;display:flex;flex-direction:column;gap:12px;min-width:0;
  border-right:1px solid var(--line);background:linear-gradient(90deg,rgba(var(--panel-rgb),.85),rgba(var(--panel-rgb),.2))}
.crew-arc .kv{min-width:0}
.crew-arc .kv .lb{font:600 8px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.6px;
  color:var(--ink-5);text-transform:uppercase;margin-bottom:4px}
.crew-arc .kv .vl{font-size:11.5px;line-height:1.5;color:var(--ink-2);word-break:break-word}
.crew-arc .kv .vl.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.6px;color:var(--hud-2)}
.crew-arc .arc-meta{border-top:1px solid var(--line2);padding-top:10px;margin-top:auto;
  font:600 8.5px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1px;color:var(--ink-5)}
.crew-arc .arc-meta b{color:var(--ink-3);font-weight:600}

.crew-stage{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line);background:rgba(var(--bg3-rgb),.35)}
.stage-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px 16px 0;
  font:600 8px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.6px;color:rgba(var(--hud-rgb),.62)}
.stage-top span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-canvas{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
  height:clamp(430px,64vh,620px);padding:8px 18px 0;flex:0 0 auto}
.stage-canvas .sc-ring{position:absolute;left:50%;top:48%;border-radius:50%;pointer-events:none;
  transform:translate(-50%,-50%);border:1px solid rgba(var(--hud-rgb),.13);width:min(92%,520px);aspect-ratio:1/1}
.stage-canvas .sc-ring.r2{border-style:dashed;border-color:rgba(var(--hud-rgb),.1);width:min(74%,410px)}
.stage-canvas .sc-glow{position:absolute;left:50%;top:47%;width:min(74%,430px);aspect-ratio:1/1;
  transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle at 50% 42%,rgba(var(--line5-rgb),.55),rgba(var(--bg3-rgb),.18) 56%,transparent 74%)}
.stage-fig{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center;
  height:100%;max-height:none}
.stage-fig img{position:relative;z-index:2;max-height:100%;width:auto;max-width:100%;object-fit:contain;
  cursor:zoom-in;filter:saturate(.92) brightness(.98) contrast(1.03) drop-shadow(0 18px 30px rgba(0,0,0,.6));
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 86%,rgba(0,0,0,.35) 96%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0,#000 86%,rgba(0,0,0,.35) 96%,transparent 100%)}
.stage-fig::after{content:"";position:absolute;z-index:1;left:0;right:0;bottom:-4px;height:26%;
  pointer-events:none;background:radial-gradient(ellipse 60% 100% at 50% 100%,rgba(var(--bg3-rgb),.9),rgba(var(--bg3-rgb),.3) 58%,transparent 80%)}
.stage-fig .sc-plinth{position:absolute;z-index:0;left:50%;bottom:0;width:78%;height:16px;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(var(--hud-rgb),.3),rgba(var(--hud-rgb),.06) 58%,transparent 78%);
  filter:blur(7px);pointer-events:none}
.stage-ph{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  width:230px;aspect-ratio:9/16;max-height:52vh;border:1px dashed var(--line4);background:
  repeating-linear-gradient(135deg,rgba(var(--hud-rgb),.045) 0 1px,transparent 1px 10px),rgba(var(--bg2-rgb),.6)}
.stage-ph b{font:600 30px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:3px;color:var(--ink-5)}
.stage-ph em{font-style:normal;font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.6px;color:var(--ink-5)}
.stage-cap{position:relative;z-index:3;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:9px 16px 11px;border-top:1px solid var(--line2);background:linear-gradient(180deg,rgba(var(--bg2-rgb),.3),rgba(var(--bg2-rgb),.75))}
.stage-cap .no{font:600 8.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.8px;color:var(--hud)}
.stage-cap .tt{font-size:12px;color:var(--ink-1);letter-spacing:.6px;min-width:0}
.stage-cap .hint{margin-left:auto;font:600 8px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.2px;color:var(--ink-5)}
.stage-aux{display:flex;flex-wrap:wrap;gap:5px;padding:0 16px 12px}
.stage-aux .mod{font:600 9px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.5px;
  color:var(--ink-2);border:1px solid var(--line3);padding:3px 7px;background:rgba(var(--panel-rgb),.5)}

/* ---- 系列 · 胶片条 ---- */
.filmzone{display:flex;flex-direction:column;gap:12px}
.film{padding:10px 0 6px;border-top:1px solid var(--line)}
.film:first-child{border-top:0;padding-top:2px}
.film-h{display:flex;align-items:baseline;gap:9px;padding:0 16px 7px;flex-wrap:wrap}
.film-h .sid{font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px;color:var(--hud)}
.film-h .sid::before{content:"[";color:var(--line4)}
.film-h .sid::after{content:"]";color:var(--line4)}
.film-h b{font-size:12.5px;font-weight:600;color:var(--ink-1);letter-spacing:.6px}
.film-h .ct{margin-left:auto;font:600 8.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:1px;color:var(--ink-5);white-space:nowrap}
.film-h .spare{font:600 8.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.8px;
  color:var(--amber);border:1px solid rgba(var(--amber-rgb),.38);padding:2px 5px;white-space:nowrap}
.film-note{font-size:10.5px;line-height:1.6;color:var(--ink-4);padding:0 16px 8px;
  border-left:1px solid var(--line4);margin:0 16px 8px}
.film-track{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:thin;
  scrollbar-color:var(--line4) transparent}
.film-track::-webkit-scrollbar{height:4px}
.film-track::-webkit-scrollbar-thumb{background:var(--line4)}
.fcell{flex:0 0 98px;position:relative;border:1px solid var(--line3);background:var(--deep);overflow:hidden}
.fcell .fim{position:relative;aspect-ratio:9/16;overflow:hidden;background:var(--deep2)}
.fcell .fim img{width:100%;height:100%;object-fit:cover;object-position:50% 16%;cursor:zoom-in;
  filter:saturate(.92) brightness(.96);transition:filter .15s}
.fcell:hover .fim img{filter:saturate(1) brightness(1.04)}
.fcell .fno{position:absolute;left:0;top:0;z-index:2;font:600 8px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.6px;color:var(--hud-2);background:rgba(var(--bg3-rgb),.8);padding:3px 4px}
.fcell .ftx{display:flex;align-items:baseline;gap:4px;padding:5px 6px 6px;min-height:30px}
.fcell .ftx b{font:600 8.5px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--hud)}
.fcell .ftx span{font-size:9.5px;line-height:1.35;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;min-width:0}
.fcell.ph{border-style:dashed;border-color:var(--line4)}
.fcell.ph .fim img{filter:saturate(.3) brightness(.62) contrast(.95)}
.fcell.ph .fim::after{content:"";position:absolute;inset:0;background:rgba(var(--bg3-rgb),.2)}
.fcell.ph .fno{color:var(--amber)}
.fcell.ph .ftx b{color:var(--amber)}
.fcell.ph .ftx span{color:var(--ink-4)}
.fcell.ph .pht{position:absolute;right:0;top:0;z-index:2;font:600 7.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.4px;color:var(--amber);background:rgba(var(--bg2-rgb),.85);border-left:1px solid rgba(var(--amber-rgb),.4);
  border-bottom:1px solid rgba(var(--amber-rgb),.4);padding:3px 4px}

/* ---- 档案 · 克隆 / 属性表 ---- */
.crew-dossier{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:16px}
.crew-dossier.solo{grid-template-columns:minmax(0,1fr)}
.dossier-sec{border:1px solid var(--line);background:rgba(var(--panel-rgb),.55);padding:12px 14px;min-width:0}
.dossier-sec h3{margin:0 0 9px;font:600 8.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:2.4px;color:var(--ink-4);text-transform:uppercase}
.dossier-sec h3::before{content:"// ";color:var(--hud)}
.dossier-sec h3 i{font-style:normal;color:var(--ink-5);margin-left:6px}
.dossier-sec .tagline{margin:0 0 10px;font-size:11.5px;line-height:1.65;color:var(--ink-2);
  border-left:1px solid rgba(var(--hud-rgb),.45);padding:5px 9px;background:rgba(var(--hud-rgb),.04)}
.dossier-sec dl.profile{border-top:0}
.dossier-sec dl.profile dt{color:var(--ink-5);border-bottom:1px solid var(--line2)}
.dossier-sec dl.profile dd{color:var(--ink-1b);border-bottom:1px solid var(--line2)}
.dossier-sec details.more summary{color:var(--hud-3)}
.dossier-sec .kink .kbtn{border-radius:0;background:rgba(var(--panel-rgb),.6);border-color:var(--line3);color:var(--ink-2)}
.dossier-sec .kink .kbtn:hover{border-color:var(--line5);color:var(--hud-ink)}
.dossier-sec .kink .kc{color:var(--hud-2)}

.clone{border:1px solid var(--line3);background:rgba(var(--bg2-rgb),.6);margin-bottom:11px}
.clone .cl-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line2)}
.clone .cl-h b{font-size:11px;letter-spacing:.5px;color:var(--ink-1)}
.clone .cl-h span{font:600 8.5px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.7px;color:var(--ink-5)}
.clone .cl-tabs{display:flex;border-bottom:1px solid var(--line2)}
.clone .cl-t{font:inherit;flex:1;padding:7px 4px;border:0;border-right:1px solid var(--line2);background:transparent;
  color:var(--ink-3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.clone .cl-t:last-child{border-right:0}
.clone .cl-t b{font:600 11px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1px}
.clone .cl-t em{font-style:normal;font-size:9px;color:var(--ink-5)}
.clone .cl-t:hover{background:rgba(var(--hud-rgb),.05);color:var(--ink-1)}
.clone .cl-t.on{background:rgba(var(--hud-rgb),.1);color:var(--hud-4);box-shadow:inset 0 -1px 0 var(--hud)}
.clone .cl-t.on em{color:var(--hud-3)}
.clone .cl-p{display:none;padding:0 10px 4px}
.clone .cl-p.on{display:block}
.clone .cl-p dl{display:grid;grid-template-columns:60px minmax(0,1fr);margin:0}
.clone .cl-p dt{font-size:10px;color:var(--ink-5);padding:5px 0;border-bottom:1px solid var(--line2)}
.clone .cl-p dd{margin:0;font-size:11px;color:var(--ink-2);padding:5px 0;border-bottom:1px solid var(--line2);
  font-variant-numeric:tabular-nums;word-break:break-word}
.clone .cl-p dt:nth-last-of-type(1),.clone .cl-p dd:nth-last-of-type(1){border-bottom:0}
.clone .cl-note{font-size:10px;color:var(--ink-4);line-height:1.6;padding:7px 10px;border-top:1px solid var(--line2)}

/* ---- 右栏：雷达 / 装备 / 体征 / 事件 ---- */
.crew-side{padding:14px 13px;display:flex;flex-direction:column;gap:14px;min-width:0;
  background:linear-gradient(270deg,rgba(var(--panel-rgb),.85),rgba(var(--panel-rgb),.2));
  position:sticky;top:52px;max-height:calc(100vh - 64px);overflow-y:auto;scrollbar-width:thin;
  scrollbar-color:var(--line4) transparent}
.crew-side::-webkit-scrollbar{width:4px}
.crew-side::-webkit-scrollbar-thumb{background:var(--line4)}
.hud-sec{min-width:0}
.hud-sec .sh{display:flex;align-items:baseline;gap:7px;padding-bottom:6px;margin-bottom:7px;
  border-bottom:1px solid var(--line2);font:600 8.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:2px;color:var(--ink-4);text-transform:uppercase}
.hud-sec .sh::before{content:"// ";color:var(--hud)}
.hud-sec .sh .kc{margin-left:auto;font-size:8px;letter-spacing:.8px;color:var(--ink-4)}
.crew-side .ov-radar{max-width:100%;margin:0 auto 2px}
.crew-side .ov-atip{margin-top:4px;min-height:42px;font-size:10px;line-height:1.55;
  border-left:1px solid rgba(var(--hud-rgb),.45);background:rgba(var(--hud-rgb),.04);padding:5px 8px;border-radius:0}
.crew-side .ov-atip b{color:var(--ink-1);font-weight:600;margin-right:4px}
.crew-side .ov-atip b i{font-style:normal;color:var(--hud);margin-left:4px}
.crew-side .ov-gear{max-height:216px}
.crew-side .ov-grow{border-radius:0;font-size:10.5px;padding:5px 7px}
.crew-side .ov-glink{margin-top:6px;padding-top:6px;border-top:1px solid var(--line2);font-size:9.5px;
  letter-spacing:.8px;color:var(--hud-3)}
.crew-side .vitals,.crew-side .evlog{margin:0;border:0;background:none;border-radius:0}
.crew-side .vitals .vh,.crew-side .evlog .vh{padding:0 0 7px;margin-bottom:7px;border-bottom:1px solid var(--line2);background:none}
.crew-side .vitals .vh b,.crew-side .evlog .vh b{font-size:10.5px;color:var(--ink-1);font-weight:600}
.crew-side .vitals .vh span,.crew-side .evlog .vh span{font:600 7.5px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:1.2px;color:var(--ink-5);text-transform:uppercase}
.crew-side .vitals .vh em,.crew-side .evlog .vh em{font-size:7.5px;color:var(--amber);background:none;border:0;padding:0}
.crew-side .vit-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:0}
.crew-side .vit{border:1px solid var(--line2);border-radius:0;background:rgba(var(--panel-rgb),.4);padding:5px 6px 6px}
.crew-side .vit .vt span{font-size:9px;color:var(--ink-4)}
.crew-side .vit .vt b{font-size:10px;color:var(--ink-1b)}
.crew-side .vit .vb{height:2px;margin:4px 0 3px;background:var(--line2);border-radius:0}
.crew-side .vit .vb s{border-radius:0}
.crew-side .vit .s{font-size:8px;color:var(--ink-5);letter-spacing:.2px}
.crew-side .vit.warn .vt b{color:var(--amber)}
.crew-side .vit.bad .vt b{color:var(--bad)}
.crew-side .tl{padding:0}
.crew-side .tli{margin-left:0;padding:4px 0 4px 12px;border-left:1px solid var(--line3)}
.crew-side .tli time{position:static;display:block;width:auto;text-align:left;font-size:8px;color:var(--ink-5);letter-spacing:.5px}
.crew-side .tli i{left:-4px;top:15px;width:5px;height:5px;border-width:1px;border-color:var(--line4);background:var(--deep)}
.crew-side .tli.past i{background:var(--hud);border-color:var(--hud)}
.crew-side .tli.now i{background:var(--hud);border-color:var(--hud);box-shadow:0 0 0 2px rgba(var(--hud-rgb),.16)}
.crew-side .tli.dead i{background:var(--amber);border-color:var(--amber)}
.crew-side .tli .tx b{font-size:9.5px;line-height:1.4;color:var(--ink-2);font-weight:600}
.crew-side .tli.now .tx b{color:var(--hud-2)}
.crew-side .tli .tx span{font-size:9px;line-height:1.45;color:var(--ink-4)}

/* ---- 舰员选择 · 名录栅格 ---- */
.pick-hud{padding-top:4px}
.ph-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:0 0 11px;margin-bottom:12px;
  border-bottom:1px solid var(--line)}
.ph-head h1{margin:0;font-size:21px;letter-spacing:1px;color:var(--ink-0);font-weight:600}
.ph-head .ph-sub{font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px;color:var(--ink-5)}
.ph-head .ph-cont{margin-left:auto;font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:1.4px;color:var(--hud-2);border:1px solid var(--line4);padding:7px 10px;border-radius:2px}
.ph-head .ph-cont:hover{border-color:var(--hud);background:rgba(var(--hud-rgb),.06)}
.ph-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.ph-card{position:relative;display:flex;flex-direction:column;overflow:hidden;
  background:rgba(var(--panel-rgb),.72);border:1px solid var(--line);border-radius:2px;transition:border-color .16s,transform .16s}
.ph-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--line2);z-index:2;transition:.16s}
.ph-card:hover{border-color:var(--line5);transform:translateY(-1px)}
.ph-card:hover::before{background:var(--hud);box-shadow:0 0 10px rgba(var(--hud-rgb),.75)}
.ph-card.last-on{border-color:var(--line5)}
.ph-card.last-on::before{background:var(--amber)}
.ph-im{position:relative;aspect-ratio:3/4;background:var(--deep3);overflow:hidden}
.ph-im img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;
  filter:saturate(.92) contrast(1.02)}
.ph-im::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(var(--bg3-rgb),.34),transparent 32%,transparent 62%,rgba(var(--bg3-rgb),.82))}
.ph-no{position:absolute;left:8px;top:8px;z-index:2;font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:1.4px;color:var(--hud-2);text-shadow:0 1px 6px var(--ov-3)}
.ph-pend{position:absolute;right:7px;top:7px;z-index:2}
.ph-last{position:absolute;left:8px;bottom:8px;z-index:2;font:600 8px/1 ui-monospace,monospace;letter-spacing:1.2px;
  color:var(--amber);border:1px solid rgba(var(--amber-rgb),.5);padding:2px 5px;background:rgba(var(--bg3-rgb),.55)}
.ph-bd{padding:9px 10px 10px;display:flex;flex-direction:column;flex:1}
.ph-nm{display:flex;align-items:baseline;gap:6px;min-width:0}
.ph-nm b{font-size:15.5px;letter-spacing:.6px;color:var(--ink-0);font-weight:600;white-space:nowrap}
.ph-nm em{font:600 8.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.2px;color:var(--hud);
  font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-rl{font-size:10.5px;line-height:1.5;color:var(--ink-4);margin:5px 0 8px;height:31px;overflow:hidden}
.ph-pg{display:flex;align-items:center;gap:8px;margin-top:auto}
.ph-pg .pb{flex:1;height:2px;background:var(--line2);overflow:hidden}
.ph-pg .pb i{display:block;height:100%;background:var(--hud);box-shadow:0 0 6px rgba(var(--hud-rgb),.6)}
.ph-pg .pv{font:600 9px/1 ui-monospace,monospace;letter-spacing:.6px;color:var(--hud-2);min-width:26px;text-align:right}
.ph-ms{font:500 9px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.5px;color:var(--ink-5);margin-top:6px}
.ph-ms.warn{color:var(--amber-2)}
@media (max-width:1180px){.ph-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){
  .ph-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .ph-head h1{font-size:18px}
  .ph-head .ph-cont{margin-left:0}
  .ph-rl{height:30px;font-size:9.8px}
  .ph-bd{padding:7px 8px 8px}
  .ph-nm b{font-size:14px}
}

/* ---- 装备库 · 终端命令条 + 索引表 ---- */
.page-hud-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:0 0 10px;margin-bottom:10px;
  border-bottom:1px solid var(--line)}
.page-hud-head h1{margin:0;font-size:17px;line-height:1.2;letter-spacing:3px;color:var(--ink-0);font-weight:600}
.page-hud-head .ph-k{font:600 8.5px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2.6px;color:var(--hud)}
.page-hud-head .sub{margin-left:auto;font:600 9px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:1px;color:var(--ink-4);text-align:right}
.gear-cmd{position:relative;padding:9px 12px 10px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;
  border:1px solid var(--line);background:rgba(var(--bg2-rgb),.72)}
.gear-cmd .cmd-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.gear-cmd .cmd-tag{font:600 8px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.8px;color:var(--ink-5)}
.gear-cmd .cmd-tag b{color:var(--hud);font-weight:600}
.gear-cmd .cmd-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.gear-cmd .gcount{margin-left:auto;font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:1.2px;color:var(--ink-4);white-space:nowrap}
.gear-cmd #gearCats{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.gear-cmd .gsel{height:26px;border-radius:0}
.gear-cmd .gsearch{border-radius:0;height:26px;flex:1 1 180px;max-width:280px;min-width:0}

.gear-index{border:1px solid var(--line);background:rgba(var(--bg2-rgb),.42)}
.gi-head,.grow{display:grid;grid-template-columns:72px minmax(0,1fr) 66px 168px 62px;
  gap:10px;align-items:center;padding:0 12px}
.gi-head{height:26px;border-bottom:1px solid var(--line3);background:rgba(var(--panel-rgb),.8);
  font:600 7.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.6px;color:var(--ink-5);
  position:sticky;top:43px;z-index:5}
.grow{position:relative;min-height:40px;border-bottom:1px solid var(--line2);transition:background .14s}
.grow:last-child{border-bottom:0}
.grow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;transition:background .14s}
.grow:hover{background:rgba(var(--hud-rgb),.045)}
.grow:hover::before{background:var(--hud);box-shadow:0 0 10px rgba(var(--hud-rgb),.5)}
.grow.on{background:rgba(var(--hud-rgb),.09)}
.grow.on::before{background:var(--hud);box-shadow:0 0 12px rgba(var(--hud-rgb),.7)}
.grow .gno{font:600 9.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1px;color:var(--hud-3)}
.grow .gname{display:flex;align-items:center;gap:9px;min-width:0;padding:4px 0}
.grow .gmeta{display:contents}
.grow .gthumb{flex:0 0 30px;width:30px;height:30px;overflow:hidden;border:1px solid var(--line3);background:var(--deep2)}
.grow .gthumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;filter:saturate(.9) brightness(.95)}
.grow .gthumb.empty{display:flex;align-items:center;justify-content:center;
  border-style:dashed;border-color:var(--line4);color:var(--ink-5);font:600 8px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.5px}
.grow .gt{min-width:0}
.grow .gt b{display:block;font-size:11.5px;line-height:1.35;color:var(--ink-1);font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow .gt em{display:block;font-style:normal;font:600 8.5px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.3px;color:var(--ink-5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow .gt a.gloc{color:var(--ink-4)}
.grow .gt a.gloc:hover{color:var(--hud-2)}
.grow .gt .gnote{display:block;margin-top:1px;font-size:9px;line-height:1.45;color:var(--ink-5);
  white-space:normal;word-break:break-word}
/* 装备图原位放大：复用立绘的 .cz-in 面板，去掉两侧边线贴合列表 */
.gear-index .cz-in{margin:0;border-width:1px 0;border-color:var(--line3)}
.gear-index .cz-in .cz-pic img{max-height:min(70vh,680px)}
.grow .gcat{font:600 8.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.2px;
  color:var(--hud-3);border:0;border-left:1px solid rgba(var(--hud-rgb),.4);padding:2px 6px;text-align:left;white-space:nowrap}
.grow .gown{font-size:10.5px;line-height:1.35;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;min-width:0}
.grow .gown:hover{color:var(--hud-4)}
.grow .gown span{display:block;font:600 7.5px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.6px;color:var(--ink-5)}
.grow .gst{text-align:right}
.gi-empty{padding:30px 16px;font:600 10px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:1px;color:var(--ink-4);text-align:center}
.gi-empty a{color:var(--hud-3)}

/* ---- 舱室页 · 甲板动线 ---- */
.rooms-cmd{position:relative;display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 12px;
  border:1px solid var(--line);background:rgba(var(--bg2-rgb),.72);margin-bottom:12px}
.rooms-cmd #roomChips{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.rooms-cmd .gcount{margin-left:auto;font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:1.2px;color:var(--ink-4);white-space:nowrap}
.rooms-cmd .gsearch{border-radius:0}
.rooms-cmd .cmd-tag{font:600 8px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.8px;color:var(--ink-5)}
.rooms-cmd .cmd-tag b{color:var(--hud);font-weight:600}
/* 全局展开/收起：与筛选控件同一行 */
.rooms-cmd .rooms-all{flex:0 0 auto;border:1px solid var(--line2);background:rgba(var(--hud-rgb),.06);
  color:var(--ink-2);font:600 10px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.6px;
  padding:0 9px;height:26px;cursor:pointer;white-space:nowrap;border-radius:0}
.rooms-cmd .rooms-all:hover{color:var(--hud-2);border-color:var(--hud)}
.rooms-cmd .rooms-all.on{color:var(--hud-3);border-color:var(--hud);background:rgba(var(--hud-rgb),.16)}

.deck-wrap{display:block}
.deck-tracks{display:flex;flex-direction:column;gap:14px;min-width:0}
.deck-seg{border:1px solid var(--line);background:rgba(var(--bg2-rgb),.45);min-width:0}
.deck-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;width:100%;padding:9px 12px;
  border:0;border-bottom:1px solid var(--line3);background:rgba(var(--panel-rgb),.65);
  font:inherit;color:inherit;text-align:left;cursor:pointer}
.deck-h:hover{background:rgba(var(--hud-rgb),.06)}
.deck-h .tg{margin-left:2px;font:600 10px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--hud-3)}
.deck-seg.collapsed .deck-body{display:none}
.deck-seg.collapsed .deck-h{border-bottom-color:transparent}
.unit-seg{border-bottom:1px solid var(--line2)}
.unit-seg:last-child{border-bottom:0}
.unit-h{display:flex;align-items:baseline;gap:8px;width:100%;padding:6px 12px 6px 14px;
  border:0;border-bottom:1px solid var(--line3);background:rgba(var(--bg3-rgb),.28);
  font:inherit;color:inherit;text-align:left;cursor:pointer}
.unit-h:hover{background:rgba(var(--hud-rgb),.05)}
.unit-h .uk{font:600 8.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1px;color:var(--hud-3)}
.unit-h b{font-size:10.5px;font-weight:500;letter-spacing:.6px;color:var(--ink-2)}
.unit-h .uc{margin-left:auto;font:600 8px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.6px;color:var(--ink-5);white-space:nowrap}
.unit-h .tg{font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ink-4)}
.unit-seg.collapsed .unit-body{display:none}
.unit-seg.collapsed .unit-h{border-bottom-color:transparent}
.deck-h .mk{font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.2px;color:var(--hud);
  border:1px solid rgba(var(--hud-rgb),.4);padding:2px 5px}
.deck-h b{font-size:12px;font-weight:600;letter-spacing:1.4px;color:var(--ink-0)}
.deck-h .wh{font-size:9.5px;color:var(--ink-5);letter-spacing:.4px}
.deck-h .ct{margin-left:auto;font:600 8.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:1px;color:var(--ink-5);white-space:nowrap}
.deck-track{position:relative;padding:10px 12px 12px 34px}
.deck-track::before{content:"";position:absolute;left:18px;top:14px;bottom:16px;width:1px;
  background:repeating-linear-gradient(180deg,var(--line4) 0 4px,transparent 4px 8px)}
.deck-node{position:relative;display:block;padding:7px 10px 7px 11px;border:1px solid var(--line2);border-radius:2px;
  background:rgba(var(--panel-rgb),.42);margin-bottom:6px;transition:border-color .14s,background .14s}
.deck-node::before{content:"";position:absolute;left:-21px;top:15px;width:7px;height:7px;
  border:1px solid var(--line5);background:var(--deep);transform:rotate(45deg)}
.deck-node::after{content:"";position:absolute;left:-14px;top:18px;width:13px;height:1px;background:var(--line4)}
.deck-node:hover{border-color:var(--line5);background:rgba(var(--hud-rgb),.045);box-shadow:inset 2px 0 0 rgba(var(--hud-rgb),.28)}
.deck-node.on{border-color:var(--hud);background:rgba(var(--hud-rgb),.09);
  box-shadow:inset 2px 0 0 var(--hud),0 0 16px rgba(var(--hud-rgb),.08)}
.deck-node.on::before{background:var(--hud);border-color:var(--hud);box-shadow:0 0 8px rgba(var(--hud-rgb),.7)}
.deck-node .nl1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.deck-node .nl1 .rno{font:600 9.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.2px;color:var(--hud-3)}
.deck-node.on .nl1 .rno{color:var(--hud-4)}
.deck-node .nl1 b{font-size:12px;font-weight:500;letter-spacing:.6px;color:var(--ink-1)}
.deck-node .nl1 em{font-style:normal;font:600 8px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:1.2px;color:var(--ink-5)}
.deck-node .nl1 .gst{margin-left:auto}
.deck-node .nmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;
  font:600 8.5px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.6px;color:var(--ink-5)}
.deck-node .nmeta span{white-space:nowrap}
.deck-node .nmeta b{color:var(--ink-3);font-weight:600}
.deck-node .nmeta .amt{color:var(--hud-3)}
.deck-node .nuse{margin-top:4px;font-size:9.5px;line-height:1.5;color:var(--ink-5);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit-body{position:relative;padding:8px 12px 4px 34px}
.unit-body::before{content:"";position:absolute;left:18px;top:12px;bottom:10px;width:1px;
  background:repeating-linear-gradient(180deg,var(--line4) 0 4px,transparent 4px 8px)}
.room-item{position:relative}
.room-item.on>.deck-node{margin-bottom:0;border-color:var(--hud);border-bottom-color:rgba(var(--hud-rgb),.35);
  background:rgba(var(--hud-rgb),.09);box-shadow:inset 2px 0 0 var(--hud)}
.room-item.on>.deck-node::before{background:var(--hud);border-color:var(--hud);box-shadow:0 0 8px rgba(var(--hud-rgb),.7)}
.room-inline{position:relative;margin:0 0 8px 13px;padding:2px 0 2px 20px;border-left:1px solid var(--hud);
  background:linear-gradient(90deg,rgba(var(--hud-rgb),.07),rgba(var(--hud-rgb),0) 62%)}
.room-inline:empty{display:none}
.deck-links{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:2px 0 8px 8px;padding-left:0}
.deck-links .lk{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;
  border:1px solid var(--line3);color:var(--ink-4);font:600 7.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.5px;background:rgba(var(--panel-rgb),.4);white-space:nowrap}
.deck-links .lk::before{content:"↳";color:var(--line5);font-size:9px}
.deck-links .lk:hover{border-color:var(--line5);color:var(--hud-4)}
.deck-links .lk b{color:var(--hud-3);font-weight:600}
.deck-links .mode{margin-left:auto;font:600 7.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.5px;color:var(--ink-5);white-space:nowrap}

.room-detail-col{min-width:0;position:sticky;top:56px;max-height:calc(100vh - 68px);overflow:auto}
.rdetail{border:1px solid var(--line);background:rgba(var(--panel-rgb),.72);position:relative}
.rd-head{padding:11px 13px 10px;border-bottom:1px solid var(--line2);background:rgba(var(--bg3-rgb),.35)}
.rd-head .rno{font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.2px;color:var(--hud-3)}
.rd-head h2{margin:5px 0 3px;font-size:17px;line-height:1.25;letter-spacing:1.2px;color:var(--ink-0);font-weight:600}
.rd-head .rmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font:600 8.5px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.8px;color:var(--ink-5)}
.rd-head .rmeta b{color:var(--hud-3);font-weight:600}
.rd-fields{display:grid;grid-template-columns:104px minmax(0,1fr);margin:0}
.rd-fields dt{font:600 8px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.6px;color:var(--ink-5);
  padding:5px 6px 5px 0;border-bottom:1px solid var(--line2);word-break:break-all}
.rd-fields dd{margin:0;font-size:10.5px;line-height:1.6;color:var(--ink-2);padding:5px 0;border-bottom:1px solid var(--line2);
  word-break:break-word}
.rd-fields dt span{display:block;font:600 7px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.3px;color:var(--ink-5);opacity:.75}
.rd-note{font-size:9px;line-height:1.6;color:var(--ink-5);padding:8px 13px 10px;letter-spacing:.4px}
.rd-note a{color:var(--hud-3)}
.rd-inline{padding:9px 0 5px}
.rdi-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding:0 0 8px}
.rdi-head .rno{font:600 8.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1px;color:var(--hud-3)}
.rdi-head b{font-size:14px;font-weight:600;letter-spacing:1px;color:var(--ink-0)}
.rdi-head .rmeta{margin-left:auto;font:600 8px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.6px;color:var(--ink-5)}
.rdi-head .rmeta b{font-size:inherit;color:var(--hud-3);letter-spacing:.6px}
.rdg-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 26px}
.rdg{border-top:1px solid var(--line2);padding:7px 0 3px;min-width:0}
.rdg h4{margin:0 0 5px;font:600 7.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:1.5px;color:var(--hud-3);text-transform:uppercase}
.rdg dl{display:grid;grid-template-columns:112px minmax(0,1fr);margin:0}
.rdg dt{font:600 8px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.5px;color:var(--ink-5);
  padding:4px 6px 4px 0;border-bottom:1px solid var(--line2);word-break:break-all}
.rdg dd{margin:0;font-size:10.5px;line-height:1.6;color:var(--ink-2);padding:4px 0;
  border-bottom:1px solid var(--line2);word-break:break-word}
.rdi-note{font-size:8.5px;line-height:1.6;color:var(--ink-5);letter-spacing:.4px;padding:8px 0 2px;border-top:1px solid var(--line2);margin-top:4px}
.rdi-note a{color:var(--hud-3)}
.rd-photo{position:relative;aspect-ratio:16/7;overflow:hidden;background:var(--deep);border-bottom:1px solid var(--line)}
.rd-photo img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;filter:saturate(.85) brightness(.9);
  -webkit-mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.3) 100%);
  mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.3) 100%)}
.rd-photo .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:repeating-linear-gradient(135deg,rgba(var(--hud-rgb),.04) 0 1px,transparent 1px 10px),var(--deep)}
.rd-photo .ph i{font-style:normal;font:600 24px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:3px;color:var(--line5)}
.rd-photo .ph em{font-style:normal;font:600 8px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:1.4px;color:var(--amber)}
.rd-photo .rno{position:absolute;left:0;top:0;z-index:2;font:600 8.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:1px;color:var(--hud-2);background:rgba(var(--bg3-rgb),.78);padding:4px 6px}
.rd-body{padding:11px 13px 13px}
.rd-cr{display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  font:600 8px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.2px;color:var(--ink-5)}
.rd-body h2{margin:5px 0 7px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  font-size:17px;line-height:1.2;letter-spacing:1.6px;color:var(--ink-0);font-weight:600}
.rd-body h2 .pill{border-radius:0;font:600 8px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.8px;padding:3px 5px;border:1px solid var(--line3);background:transparent;color:var(--ink-2)}
.rd-body h2 .pill.st-ok{color:var(--ok);border-color:rgba(var(--ok-rgb),.4);background:transparent}
.rd-body h2 .pill.st-warn{color:var(--amber);border-color:rgba(var(--amber-rgb),.45);background:transparent}
.rd-body h2 .pill.st-off{color:var(--ink-3);border-color:var(--line4);background:transparent}
.rd-body h2 .pill.blue{color:var(--hud-2);border-color:rgba(var(--hud-rgb),.38);background:transparent}
.rd-body .ds{font-size:10.5px;line-height:1.65;color:var(--ink-3);margin:0 0 9px}
.rd-body dl{display:grid;grid-template-columns:42px minmax(0,1fr);margin:0 0 8px}
.rd-body dt{font:600 8px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.8px;color:var(--ink-5);
  padding:4px 0;border-bottom:1px solid var(--line2)}
.rd-body dd{margin:0;font-size:10.5px;line-height:1.5;color:var(--ink-2);padding:4px 0;border-bottom:1px solid var(--line2);
  word-break:break-word}
.rd-blk{border-top:1px solid var(--line2);padding-top:8px;margin-top:8px}
.rd-blk>b{display:flex;align-items:baseline;gap:6px;font:600 8px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:1.6px;color:var(--ink-4);text-transform:uppercase}
.rd-blk>b i{font-style:normal;color:var(--ink-5);letter-spacing:.6px}
.rd-blk ul.fn{margin:6px 0 0;padding:0;list-style:none}
.rd-blk ul.fn li{position:relative;padding-left:10px;font-size:10px;line-height:1.65;color:var(--ink-2)}
.rd-blk ul.fn li::before{content:"";position:absolute;left:0;top:7px;width:3px;height:3px;background:var(--line5)}
.rd-blk .eqs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rd-blk .eqc{display:inline-flex;align-items:baseline;gap:5px;border-radius:0;padding:3px 6px;margin:0;
  border:1px solid var(--line3);background:rgba(var(--panel-rgb),.5);color:var(--ink-2);font-size:10px}
.rd-blk .eqc b{font:600 8px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.5px;color:var(--hud-3);margin:0}
.rd-blk .eqc:hover{border-color:var(--line5);background:rgba(var(--hud-rgb),.06);color:var(--hud-ink)}
.rd-blk .nb{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--line2);
  font-size:10.5px;color:var(--ink-2)}
.rd-blk .nb:last-child{border-bottom:0}
.rd-blk .nb:hover{color:var(--hud-4)}
.rd-blk .nb em{font-style:normal;font:600 8px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.8px;color:var(--hud-3);flex:0 0 auto}
.rd-blk .nb .md{font:600 7.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.6px;
  color:var(--ink-4);border:1px solid var(--line3);padding:2px 4px;white-space:nowrap;flex:0 0 auto}
.rd-blk .nb .tm{margin-left:auto;font:600 7.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.5px;color:var(--ink-5);white-space:nowrap}
.rd-blk .nb > span:nth-of-type(1){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-empty{border:1px solid var(--line);background:rgba(var(--panel-rgb),.45);padding:20px 16px;
  font:600 9px/1.9 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1px;color:var(--ink-5)}
.rd-empty b{display:block;color:var(--hud-3);letter-spacing:1.6px;margin-bottom:5px}

/* ---- 三页响应式 ---- */
@media (max-width:1180px){
  .crew-grid3{grid-template-columns:168px minmax(0,1fr) 272px}
  .crew-arc{padding:12px 11px}
}
@media (max-width:1000px){
  .crew-grid3{grid-template-columns:1fr}
  .crew-arc{flex-direction:row;flex-wrap:wrap;gap:8px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .crew-arc .kv{flex:1 1 90px}
  .crew-arc .arc-meta{flex:1 1 100%;margin-top:0}
  .crew-stage{border-right:0;border-bottom:1px solid var(--line)}
  .crew-side{border-top:1px solid var(--line);background:transparent;position:static;max-height:none;overflow:visible}
  .crew-dossier{grid-template-columns:1fr}
  .deck-wrap{display:block}
}
@media (max-width:820px){
  .deck-wrap{display:block}
  .deck-h{padding:10px 10px}
  .unit-h{padding:7px 10px}
  .unit-body{padding:7px 10px 3px 28px}
  .unit-body::before{left:14px}
  .room-inline{margin-left:13px;padding-left:14px}
  #roomChips{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:thin}
  #roomChips .hud-chip{flex:0 0 auto}
  .rdg-wrap{grid-template-columns:1fr;gap:0}
  .rdg dl{grid-template-columns:1fr}
  .rdg dt{border-bottom:0;padding:5px 0 0}
  .rdg dd{padding:1px 0 5px}
  .rdi-head .rmeta{margin-left:0;flex-basis:100%}
}
@media (max-width:760px){
  .gi-head{display:none}
  .grow{grid-template-columns:56px minmax(0,1fr) auto;gap:2px 8px;padding:7px 10px;min-height:0}
  .grow .gno{grid-row:1/3;align-self:center}
  .grow .gname{grid-column:2/4;grid-row:1;padding:0}
  .grow .gmeta{grid-column:2/3;grid-row:2;display:flex;align-items:center;gap:7px;min-width:0}
  .grow .gcat{display:inline-block;font-size:7.5px;letter-spacing:.7px;padding:1px 4px}
  .grow .gown{font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .grow .gown span{display:none}
  .grow .gst{grid-column:3/4;grid-row:2;align-self:center}
  .grow .gthumb{flex:0 0 26px;width:26px;height:26px}
  .grow .gt em{display:none}
  .gear-cmd .gcount{margin-left:0}
  .gear-cmd .cmd-row{gap:5px}
}
@media (max-width:640px){
  .page-hud-head h1{font-size:15px;letter-spacing:2px}
  .page-hud-head .sub{width:100%;margin-left:0;text-align:left}
  .crew-idbar{grid-template-columns:minmax(0,1fr);padding:11px 12px 10px;gap:8px}
  .idbar-main h1{font-size:19px;letter-spacing:2px}
  .idbar-meta{font-size:8px;gap:7px}
  .idbar-meter{grid-column:1/-1}
  .crew-rail .rnav{display:none}
  .crew-stage{border-top:0}
  .stage-top{font-size:7px;padding:10px 12px 0;flex-wrap:wrap}
  .stage-top span:last-child{display:none}
  .stage-canvas{height:clamp(340px,58vh,470px);padding:4px 10px 0}
  .stage-fig{max-height:none}
  .stage-fig img{max-height:min(400px,56vh)}
  .stage-cap{padding:8px 12px 9px}
  .stage-cap .hint{display:none}
  .stage-aux{padding:0 12px 10px}
  .film-h{padding:0 12px 6px}
  .film-note{margin:0 12px 7px;padding:0 12px 8px}
  .film-track{padding:0 12px 9px}
  .fcell{flex:0 0 84px}
  .crew-side{padding:12px}
  .crew-side .vit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dossier-sec{padding:10px 12px}
  .rooms-cmd{padding:8px 10px}
  .rooms-cmd .gcount{margin-left:0}
  .deck-track{padding:9px 10px 10px 28px}
  .deck-track::before{left:14px}
  .deck-node{padding:7px 8px}
  .deck-node::before{left:-18px}
  .deck-node::after{left:-11px;width:10px}
  .deck-node .nl1 .gst{margin-left:0}
  .rd-body{padding:10px 11px 12px}
}

body.light footer{color:#7b8b9b}

body.light .tool b{color:#12212c}
body.light .tool:hover{border-color:#b9c7d4;color:#12212c}
body.light .pop{background:#fbfcfe;border-color:#d5dde7;box-shadow:0 18px 46px rgba(30,45,60,.16)}
body.light .pop .row{border-top-color:#e5eaf1}
body.light .pop .sw{background:#e5eaf1;border-color:#d5dde7}
body.light .pop .sw i{background:#fff;box-shadow:0 1px 3px rgba(20,30,40,.2)}
body.light .pop .sw.on{background:#2d7f9c;border-color:#2d7f9c}
body.light .pop .pbtn{background:#fff;border-color:#d5dde7;color:#5a6d7d}

body.light .crew-card,body.light .kpi,body.light .card{background:#fbfcfe;border-color:#d9e1ea}
body.light .crew-card:hover{box-shadow:0 6px 20px rgba(30,45,60,.08);border-color:#c9d4e0}
body.light .ov{box-shadow:none}
body.light .ov-nameblk b,body.light .ov-bar h2{color:#12212c}

body.light #themeBtn .ic-sun{display:block}
body.light #themeBtn .ic-moon{display:none}
body.light .crew-arc{background:linear-gradient(90deg,rgba(251,252,254,.95),rgba(251,252,254,.35))}
body.light .crew-stage{background:rgba(245,248,251,.55)}
body.light .hud-input input{color:#25333f}
body.light .hud-input input::placeholder{color:#93a1af}

/* ===================== 舰船设计板块 ===================== */
.ship-entry{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 14px;padding:11px 16px;
  border:1px solid var(--line3);border-radius:12px;color:var(--text);
  background:linear-gradient(90deg,rgba(95,208,255,.10),transparent 62%),var(--panel)}
.ship-entry:hover{text-decoration:none;border-color:var(--line4)}
.ship-entry .se-k{font-size:10px;letter-spacing:.18em;color:var(--amber);border:1px solid var(--line3);
  border-radius:999px;padding:2px 9px;white-space:nowrap}
.ship-entry b{font-size:15px;letter-spacing:.02em}
.ship-entry .se-s{font-size:11.5px;color:var(--muted)}
.ship-entry .se-go{margin-left:auto;font-size:12px;color:var(--blue);white-space:nowrap}
body.shipmode main#app{max-width:none;padding:0}
body.shipmode #foot{display:none}
.ship-hud{background:var(--panel);border-bottom:1px solid var(--line)}
.ship-hud .in{max-width:1240px;margin:0 auto;padding:7px 14px;display:flex;align-items:center;gap:4px;
  overflow-x:auto;scrollbar-width:none}
.ship-hud .in::-webkit-scrollbar{display:none}
.ship-hud .ttl{font-size:10.5px;letter-spacing:.16em;color:var(--faint);white-space:nowrap;
  padding-right:10px;margin-right:4px;border-right:1px solid var(--line)}

(function(){
  var D = window.XS_DATA;
  var app = document.getElementById('app');
  /* 生图 prompt 独立数据（不塞进人物对象，人物字段结构改动互不影响） */
  var PROMPTS = null, PROMPT_WAIT = [];
  function withPrompts(fn){ if(PROMPTS) fn(); else PROMPT_WAIT.push(fn); }
  (function loadPrompts(){
    fetch('prompts.json', {cache: 'no-cache'}).then(function(r){
      if(!r.ok) throw 0;
      return r.json();
    }).then(function(d){
      PROMPTS = (d && d.items) || {};
    }).catch(function(){ PROMPTS = {}; }).then(function(){
      var q = PROMPT_WAIT.splice(0);
      q.forEach(function(f){ try{ f(); }catch(e){} });
    });
  })();
  /* 图片统一编号：路径 -> 图号（只含可确认匹配的，未收录即显示「未编号」） */
  var IMGNUM = null, NUM_WAIT = [];
  function withNum(fn){ if(IMGNUM) fn(); else NUM_WAIT.push(fn); }
  (function loadNum(){
    fetch('imgnum.json', {cache: 'no-cache'}).then(function(r){
      if(!r.ok) throw 0;
      return r.json();

    LBR.from = lbBox(LBR.rect, T);
    lbCap.style.opacity = '0';
    clearTimeout(LBR.t);
    var reduce = RM.matches, dx = d * 28;
    lbFrame.style.width = T.w + 'px';
    lbFrame.style.height = T.h + 'px';
    if(reduce){
      lbImg.src = el.currentSrc || el.src;
      lbFrame.style.transition = 'opacity .15s ease';
      lbFrame.style.transform = 'translate(' + T.x + 'px,' + T.y + 'px)';
      lbFrame.style.opacity = '1';
      lbCap.textContent = cap;
      setTimeout(function(){ if(LBR.open) lbCap.style.opacity = '1'; }, 60);
      lbFull(src, el.alt);
      return;
    }
    lbFrame.style.transition = 'transform .15s ease-in, opacity .15s ease-in';
    lbFrame.style.transform = 'translate(' + T.x + 'px,' + T.y + 'px) translateX(' + (-dx) + 'px)';
    lbFrame.style.opacity = '0';
    LBR.t = setTimeout(function(){
      if(!LBR.open) return;
      lbImg.src = el.currentSrc || el.src;
      lbImg.alt = el.alt || '';
      lbFrame.style.transition = 'none';
      lbFrame.style.transform = 'translate(' + T.x + 'px,' + T.y + 'px) translateX(' + dx + 'px)';
      void lbFrame.offsetWidth;
      requestAnimationFrame(function(){
        lbFrame.style.transition = 'transform .22s ' + EASE + ', opacity .18s ease';
        lbFrame.style.transform = 'translate(' + T.x + 'px,' + T.y + 'px)';
        lbFrame.style.opacity = '1';
      });
      lbCap.textContent = cap;
      setTimeout(function(){ if(LBR.open) lbCap.style.opacity = '1'; }, 100);
      lbFull(src, el.alt);
    }, 150);

  function ovRadar(c){
    var a = c.attrs || {};
    if(!Object.keys(a).length){
      return '<div class="ov-na"><b>ATTRS / 八轴</b>卷内未提供八轴数值<br>按原档口径留空，不作推演</div>';
    }
    var vals = ATTRS.map(function(k){
      var v = Number(a[k]);
      return [k, isNaN(v) ? 0 : Math.max(0, Math.min(100, v))];
    });
    var cx = 120, cy = 112, R = 68, n = vals.length, i;
    function pt(k, r){
      var ang = -Math.PI / 2 + k * 2 * Math.PI / n;
      return [cx + r * Math.cos(ang), cy + r * Math.sin(ang), ang];
    }
    var s = '<svg class="ov-radar" viewBox="0 0 240 226" role="img" aria-label="人物属性雷达">';
    [0.25, 0.5, 0.75, 1].forEach(function(f){
      var p = [];
      for(var k = 0; k < n; k++){ var q = pt(k, R * f); p.push(q[0].toFixed(1) + ',' + q[1].toFixed(1)); }
      s += '<polygon class="rg" points="' + p.join(' ') + '"/>';
    });
    for(i = 0; i < n; i++){
      var e = pt(i, R);
      s += '<line class="ra" x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '"/>';
    }
    var poly = [];
    for(i = 0; i < n; i++){
      var dv = pt(i, R * Math.max(vals[i][1] / 100, 0.04));
      poly.push(dv[0].toFixed(1) + ',' + dv[1].toFixed(1));
    }
    s += '<polygon class="rv" points="' + poly.join(' ') + '"/>';
    for(i = 0; i < n; i++){
      var d = pt(i, R * Math.max(vals[i][1] / 100, 0.04));
      s += '<circle class="rd" cx="' + d[0].toFixed(1) + '" cy="' + d[1].toFixed(1) + '" r="1.9"/>';
    }
    for(i = 0; i < n; i++){
      var lp = pt(i, R + 17), cos = Math.cos(lp[2]);
      var anchor = cos > 0.28 ? 'start' : (cos < -0.28 ? 'end' : 'middle');
      s += '<g class="ax" data-i="' + i + '" role="button" tabindex="0" aria-label="' + esc(vals[i][0]) + '">'
        + '<circle class="rh" cx="' + lp[0].toFixed(1) + '" cy="' + lp[1].toFixed(1) + '" r="12"/>'
        + '<text class="rt" x="' + lp[0].toFixed(1) + '" y="' + lp[1].toFixed(1) + '" text-anchor="' + anchor + '" dominant-baseline="middle">' + esc(vals[i][0]) + '</text>'
        + '</g>';
    }
    s += '</svg><div class="ov-atip" id="ovAtip"></div>';
    return s;
  }

    for(var k = 0; k < avs.length; k++) avs[k].classList.toggle('on', Number(avs[k].getAttribute('data-i')) === i);
    /* 换人后相框列回到顶部 */
    var frames = document.querySelector('#ovLeft .ov-frames');
    if(frames){ frames.scrollTop = 0; frames.scrollLeft = 0; }
    var lft = document.getElementById('ovLeft');
    if(lft) lft.scrollTop = 0;
    var cut = !!floatOf(c);
    fig.classList.toggle('cut', cut);
    fig.classList.toggle('soft', !cut);
    var src = stageSrc(c);
    if(img && src){
      if(img.getAttribute('src') !== src){
        var warm = OV_WARM[src];
        if(warm && warm.complete && warm.naturalWidth > 0){
          img.src = src;
        } else {
          /* 大图还在路上：先用底部头像条已缓存的缩略图顶上，避免出现"名字已变、图还是上一张" */
          if(c.main && c.main.thumb) img.src = c.main.thumb;
          else img.src = src;
          ovFill(img, src, i);
        }
        if(img.decode) img.decode().catch(function(){});
      }
      img.alt = c.name + ' 立绘';
      img.setAttribute('data-full', (c.main && c.main.src) || src);
      img.setAttribute('data-cap', c.id + ' ' + c.name + ' · ' + (c.main ? c.main.title : '立绘'));
    }
    /* grav 版优先：静默探测后替换，缺失则保留旧版 */
    if(FLOAT_OK[c.id]){
      resolveFloat(c, function(p){
        if(OV_IDX !== i) return;
        var im = document.getElementById('ovImg');
        if(!im) return;
        if(p){
          if(im.getAttribute('src') !== p){ im.src = p; ovFill(im, p, i); }
          fig.classList.add('cut'); fig.classList.remove('soft');
          var ov = FLOAT_SRC[c.id];
          fig.classList.toggle('baked-ring', !!(ov && ov.bakedRing));
        }else{
          var msrc = figSrc(c);
          if(msrc && im.getAttribute('src') !== msrc){ im.src = msrc; ovFill(im, msrc, i); }
          fig.classList.add('soft'); fig.classList.remove('cut');
          fig.classList.remove('baked-ring');
        }
      });
    }
    var hudNo = document.getElementById('ovHudNo');
    if(hudNo) hudNo.textContent = c.id;
    var hudRole = document.getElementById('ovHudRole');
    if(hudRole) hudRole.textContent = (c.en || c.code || '—') + ' · ' + (c.role || '待补');
    var hudEye = document.getElementById('ovHudEye');
    if(hudEye){
      var eye = (c.main && c.main.eye) || (c.profile && c.profile['瞳色']) || c.accent || '—';
      hudEye.textContent = String(eye).replace(/[，,].*$/, '').toUpperCase();
    }
  }

  /* 大图就绪后替换占位图；期间若已切到别人则放弃 */
  function ovFill(img, full, idx){
    var im = OV_WARM[full];
    if(!im){
      im = new Image();
      im.decoding = 'async';
      im.src = full;
      OV_WARM[full] = im;
    }
    function done(){
      if(OV_IDX !== idx) return;
      /* grav 版已生效时，别让旧版大图的异步回填把它顶掉 */
      if((img.getAttribute('src') || '').indexOf('/grav/') >= 0) return;
      if(img.getAttribute('src') !== full){
        img.src = full;
        if(img.decode) img.decode().catch(function(){});
      }
    }
    if(im.complete && im.naturalWidth > 0){ done(); return; }
    im.addEventListener('load', done);
  }

    var next = OV_IDX + d;

    ovApply(next, 0);
    SND.swap();
  }

      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })

  /* ---------- 装备库 #/gear ---------- */
  var GEAR = null, GEAR_BUSY = false, GEAR_ERR = false, GCATS = [], GQ = '';
  function gearLoad(cb){
    if(GEAR) return cb();
    if(GEAR_BUSY) return;
    GEAR_BUSY = true;
    fetch('gear.json', {cache: 'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(j){ GEAR = j.items || []; GCATS = (j.meta && j.meta.cats) || []; GEAR_ERR = false; })
      .catch(function(){ GEAR = null; GEAR_ERR = true; })
      .then(function(){ GEAR_BUSY = false; cb(); });
  }
  function gearOwner(id){
    var c = crewById[id];
    return c ? c.name : (id === 'SHIP' ? '舰内公用' : '未指派');
  }
  function gearFilter(items, cat, owner){
    var k = GQ.trim().toLowerCase();
    return items.filter(function(it){
      if(cat !== 'all' && it.cat !== cat) return false;
      if(owner && it.owner !== owner) return false;
      if(!k) return true;
      return (it.id + ' ' + it.name + ' ' + (it.tags || []).join(' ')).toLowerCase().indexOf(k) >= 0;
    });
  }
  function gearCard(it){
    var catName = '';
    GCATS.forEach(function(t){ if(t[0] === it.cat) catName = t[1]; });
    var catCode = String(it.cat || '---').toUpperCase();

      ? '<span class="gthumb"><img loading="lazy" decoding="async" src="' + esc(it.file)
        + '" alt="' + esc(it.id + ' ' + it.name) + '" data-full="' + esc(it.file)
        + '" data-cap="' + esc(it.id + ' · ' + it.name + ' · ' + (it.desc || '')) + '"></span>'
      : '';
    var loc = '';
    if(it.loc){
      var rm = roomById(it.loc);
      loc = ' · <a class="gloc" href="#/rooms' + roomQuery({deck: rm ? rm['甲板'] : 'all', id: it.loc}) + '">'
        + esc(it.loc + ' ' + (rm ? (rm.name || rm['房间名']) : '')) + '</a>';
    }
    var own = it.owner === 'SHIP'
      ? '<span class="gown">舰内公用<span>SHIP</span></span>'
      : '<a class="gown" href="#/crew/' + esc(it.owner) + '">' + esc(gearOwner(it.owner)) + '<span>' + esc(it.owner) + '</span></a>';

      +   '<em>' + esc((it.spec || []).join(' · ') || catName || '—') + loc + '</em>'
      +   (it.note ? '<span class="gnote">' + esc(it.note) + '</span>' : '')
      + '</span></div>'

  function viewGear(q){

  function seedOf(s){
    var h = 2166136261;
    s = String(s || '');
    for(var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 10000) / 10000;
  }
  function fracOf(t, p){ var x = t / p; return x - Math.floor(x); }
  function triOf(t, p){ var x = fracOf(t, p); return x < .5 ? x * 2 : 2 - x * 2; }

  function ageOf(c){
    var s = (c.profile && c.profile['年龄']) || '';

    var a = m ? parseFloat(m[1]) : 24;

  function baseWeightOf(c){
    var con = (c.attrs && c.attrs.体质) || 50;

  function vitalsFor(c){

    function tone(v){ return v >= 75 ? 'bad' : (v >= 50 ? 'warn' : ''); }

    return [
      {k:'age', label:'岁数', text:(age < 1 ? age.toFixed(2) : age.toFixed(1)) + ' 岁', pct:clampV(age / life * 100, 0, 100), tone:age / life > .92 ? 'warn' : '', sub:(ageKnown(c) ? '' : '推定 · ') + '寿命推演 ~' + life + ' 岁'},
      {k:'weight', label:'体重', text:weight.toFixed(1) + ' kg', pct:clampV(weight / (baseWeightOf(c) * 1.28) * 100, 0, 100), tone:'', sub:'基准 ' + baseWeightOf(c).toFixed(1) + ' kg'},

      {k:'irrit', label:'烦躁', text:Math.round(irrit) + ' / 100', pct:irrit, tone:tone(irrit), sub:irrit < 25 ? '平静' : irrit < 50 ? '略躁' : irrit < 75 ? '烦躁' : '易怒'},
      {k:'sanity', label:'理智', text:Math.round(sanity) + ' / 100', pct:sanity, tone:toneUp(sanity), sub:sanity >= 80 ? '清明' : sanity >= 60 ? '稳定' : sanity >= 40 ? '恍惚' : '涣散'},

      + '<button class="fold-h" type="button" aria-expanded="false" aria-controls="foldB' + kind + '">'
      + '<span class="fold-t">' + title + '</span><span class="fold-k">' + en + '</span>'
      + '<span class="fold-n" data-n>— 张</span><span class="fold-c">展开</span></button>'
      + '<div class="fold-b" id="foldB' + kind + '" hidden></div></section>';
  }
  function foldLockHTML(){
    return '<div class="fold-lock">'
      + '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="1.6"/>'
      + '<path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/></svg>'
      + '<b>需要密码</b><span>参考图与弃用图已上锁 · 在「设置 → 解锁原图与垃圾箱」输入一次密码即可全站查看</span>'
      + '<button class="pbtn" type="button" data-goset="1">去设置解锁</button></div>';
  }
  function paintFolds(){
    var c = CUR_CREW;
    if(!c) return;
    var ex = extrasOf(c.id);
    var groups = [['Ref', '参考图', ex.refs], ['Junk', '垃圾箱', ex.junk]];
    groups.forEach(function(g){
      var sec = document.getElementById('fold' + g[0]);
      if(!sec) return;
      var n = sec.querySelector('[data-n]');
      if(n) n.textContent = g[2].length + ' 张';
      var body = sec.querySelector('.fold-b');
      var open = sec.classList.contains('on');
      if(!open){ body.innerHTML = ''; body.hidden = true; return; }
      body.hidden = false;
      if(!isUnlocked()){ body.innerHTML = foldLockHTML(); return; }
      if(!g[2].length){ body.innerHTML = '<div class="fold-empty">暂无' + g[1] + '</div>'; return; }
      body.innerHTML = '<div class="fold-grid">' + g[2].map(function(it){
        return '<div class="fold-cell">'
          + '<img loading="lazy" decoding="async" src="' + esc(it.src) + '" alt="' + esc(it.cap) + '"'
          + ' data-full="' + esc(it.src) + '" data-cap="' + esc(it.cap) + '"></div>';
      }).join('') + '</div>';
      decorateNums(body);
    });
  }
  function applyUnlock(){
    if(!CUR_CREW) return;
    if(!isUnlocked()){
      ['foldRef', 'foldJunk'].forEach(function(id2){
        var sec = document.getElementById(id2);
        if(!sec) return;
        sec.classList.remove('on');
        var btn = sec.querySelector('.fold-h');
        if(btn) btn.setAttribute('aria-expanded', 'false');
        var lb = sec.querySelector('.fold-c');
        if(lb) lb.textContent = '展开';
      });
      if(document.getElementById('czIn')) czClose();
    }
    CZ.list = czListFor(CUR_CREW);
    paintFolds();
  }
  var UNLOCK_STATE = null;
  function refreshUnlockUI(){
    var on = isUnlocked();
    var sw = document.getElementById('swUnlock');
    if(sw){ sw.classList.toggle('on', on); sw.setAttribute('aria-checked', on ? 'true' : 'false'); }
    var w = document.getElementById('pwdWrap');
    if(w && on) w.hidden = true;
    if(UNLOCK_STATE === on) return;
    UNLOCK_STATE = on;
    applyUnlock();
  }
  function setUnlocked(on){
    try{
      if(on) sessionStorage.setItem(UNLOCK_KEY, '1');
      else sessionStorage.removeItem(UNLOCK_KEY);
    }catch(e){}
    refreshUnlockUI();
  }
  /* 就地撑开：插入到被点图片所在行之后，不滚动、不跳顶 */
  function crewZoom(img){
    var c = CUR_CREW;
    if(!c) return;
    var src = img.getAttribute('data-full') || img.currentSrc || img.src;
    var list = czListFor(c), i = -1;
    for(var k = 0; k < list.length; k++){ if(list[k].src === src){ i = k; break; } }
    if(i < 0) return;
    czClose();
    var panel = document.createElement('section');
    panel.className = 'cz-in';
    panel.id = 'czIn';
    panel.innerHTML = '<div class="cz-top"><span class="cz-k">ENLARGED · IN PLACE</span><b>立绘放大</b>'
      + '<span class="cz-hint">← → 翻页 · Esc 收起</span>'
      + '<button class="cz-x" id="czClose" type="button">收起 ×</button></div>'
      + '<div class="cz-body">'
      + '<button class="cz-nav prev" id="czPrev" type="button" aria-label="上一张">‹</button>'
      + '<figure class="cz-fig"><div class="cz-pic"><img id="czImg" alt="">'
      + '<button type="button" class="imgnum" id="czNum"></button></div>'
      + '<figcaption id="czCap"></figcaption></figure>'
      + '<button class="cz-nav next" id="czNext" type="button" aria-label="下一张">›</button>'
      + '<aside class="cz-prompt" id="czPrompt"></aside></div>';
    var film = img.closest('.film'), stageFig = img.closest('.stage-fig');
    if(stageFig){
      /* 主图：原位替换（隐藏原图，放大区占据它的位置） */
      CZ.stageFig = stageFig;
      stageFig.style.display = 'none';
      stageFig.parentNode.insertBefore(panel, stageFig.nextSibling);
    }
    else if(film) film.parentNode.insertBefore(panel, film.nextSibling);
    else{
      var grid = img.closest('.fold-grid');
      if(grid){
        /* 折叠区缩略图：整块网格下方就地展开，滚动位置不变 */
        grid.parentNode.insertBefore(panel, grid.nextSibling);
      }else{
        var wrap = img.closest('figure');
        if(!wrap) return;
        wrap.parentNode.insertBefore(panel, wrap.nextSibling);
      }
    }
    CZ.box = panel;
    CZ.list = list;
    CZ.cid = c.id;
    panel.querySelector('#czClose').addEventListener('click', function(e){ e.stopPropagation(); czClose(); SND.click(); });
    panel.querySelector('#czPrev').addEventListener('click', function(e){ e.stopPropagation(); czGo(-1); });
    panel.querySelector('#czNext').addEventListener('click', function(e){ e.stopPropagation(); czGo(1); });
    czShow(i);
    czFillPrompt(c.id);
    SND.click();
  }
  document.addEventListener('keydown', function(e){
    if(!document.getElementById('czIn')) return;
    if(e.key === 'Escape'){ e.preventDefault(); czClose(); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); czGo(-1); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); czGo(1); }
  });

          Array.prototype.forEach.call(app.querySelectorAll('.clone .cl-p'), function(p){

    var sn = document.getElementById('sndBtn');
    if(wb) wb.addEventListener('click', function(){ SND.click(); openPop('popWorld', wb); paintWorld(); });

      location.hash = prev;
    });
