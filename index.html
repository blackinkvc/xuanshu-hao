<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>玄枢号 · 工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111a24'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%235fd0ff' stroke-width='2'/%3E%3Cpath d='M16 6.5v19M6.5 16h19' stroke='%235fd0ff' stroke-width='1.4'/%3E%3C/svg%3E">
<meta name="description" content="玄枢号项目工作台：舰员档案总览、人物详情与姿势缺位、完成度看板、弃用图区。">
<style>
:root{
  --bg:#f7f8fa; --panel:#fff; --line:#e3e6eb; --line2:#eef1f6;
  --text:#1f2329; --muted:#6b7280; --faint:#9aa1ab;
  --green:#0a7d3c; --amber:#8a6d1a; --red:#c62828; --blue:#1a5fb4;
  --accent:#1a5fb4; --accent-soft:#eaf1fb;
  --radius:10px;
}

/* ===================== 主题令牌：暗色为默认，浅色见 body.light ===================== */
:root{
  --hud:#63d7ff; --hud-rgb:99,215,255;
  --hud-2:#9fdcff; --hud-3:#8fc6ff; --hud-4:#bfeaff; --hud-ink:#eaf6ff;
  --ink-0:#f2f9ff; --ink-1:#cfe0ef; --ink-1b:#c1d5e5; --ink-2:#b9cede;
  --ink-3:#8ba6bb; --ink-4:#6f8fa6; --ink-5:#577086; --ink-rgb:126,163,186;
  --amber:#f0b45c; --amber-2:#c79a52; --amber-rgb:240,180,92;
  --ok:#8fdca8; --ok-rgb:143,220,168; --bad:#ff8f7a;
  --line:#16293a; --line2:#122130; --line3:#1c3040; --line4:#2b4a5e; --line5:#2f5d7a;
  --line5-rgb:26,64,92;
  --deep:#07131d; --deep2:#0a1620; --deep3:#08131d;
  --panel-rgb:9,20,30; --bg2-rgb:6,13,20; --bg3-rgb:4,9,14;
  --ov-1:#0e1d2a; --ov-2:#071019; --ov-3:#04090e;
  --ov-r1:#122c40; --ov-r2:#081725; --ov-r3:#040a10;
}
body.light{
  --bg:#eef2f6; --panel:#fbfcfe; --line:#d5dde7; --line2:#e5eaf1;
  --text:#25333f; --muted:#5a6d7d; --faint:#8593a2;
  --accent:#2d7f9c; --accent-soft:#e4f0f5;
  --hud:#2d7f9c; --hud-rgb:45,127,156;
  --hud-2:#3c7e93; --hud-3:#3a6f86; --hud-4:#1f5f79; --hud-ink:#1a5670;
  --ink-0:#12212c; --ink-1:#25333f; --ink-1b:#33424f; --ink-2:#3f5261;
  --ink-3:#5a6d7d; --ink-4:#6b7d8d; --ink-5:#8593a2; --ink-rgb:107,125,141;
  --amber:#96671c; --amber-2:#8a6420; --amber-rgb:150,103,28;
  --ok:#2f7d4f; --ok-rgb:47,125,79; --bad:#b0452f;
  --hud-line:#d5dde7; --hud-line2:#e5eaf1;
  --line3:#d9e1ea; --line4:#c3cfdb; --line5:#9fb2c2; --line5-rgb:159,178,194;
  --deep:#eef3f8; --deep2:#f1f5f9; --deep3:#eff4f8;
  --panel-rgb:251,252,254; --bg2-rgb:245,248,251; --bg3-rgb:239,244,249;
  --ov-1:#e7edf4; --ov-2:#eef3f8; --ov-3:#f6f9fc;
  --ov-r1:#dbe5ef; --ov-r2:#e8eff6; --ov-r3:#f4f8fb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{overflow-x:clip}
body{
  font:14px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;
  background:var(--bg); color:var(--text);
  overflow-x:clip;
  -webkit-text-size-adjust:100%;
}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
img{display:block;max-width:100%}

/* ---------- 顶栏 ---------- */
header.top{
  position:sticky; top:0; z-index:40; background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(8px);
  border-bottom:1px solid var(--line);
}
.top-in{
  max-width:1240px; margin:0 auto; padding:10px 20px;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-size:17px;letter-spacing:.5px;white-space:nowrap}
.brand span{font-size:11px;color:var(--faint);letter-spacing:1.2px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{
  padding:6px 13px;border-radius:999px;color:var(--muted);font-size:13px;white-space:nowrap;
}
nav.tabs a:hover{background:var(--line2);text-decoration:none;color:var(--text)}
nav.tabs a.on{background:var(--text);color:#fff}

/* ---------- 顶栏工具（世界年份 / 音效 / 设置 / 返回） ---------- */
.tools{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12px;height:28px;padding:0 10px;
  border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tool:hover{border-color:#c9cfd8;color:var(--text)}
.tool.icon{width:30px;padding:0;justify-content:center}
.tool svg{width:14px;height:14px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#themeBtn .ic-sun{display:none}
#themeBtn .ic-moon{display:block}
.tool b{font:700 12.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.6px;color:var(--text);font-variant-numeric:tabular-nums}
.tool .k{font-size:9.5px;letter-spacing:1.2px;color:var(--faint)}
.tool .u{font-size:10.5px;color:var(--faint)}
.tool.off{color:#aab1ba}
.tool.off b{color:#9aa1ab}
.tool.off svg{opacity:.45}
.tool .mute{display:none}
.tool.off .mute{display:block}
.tool.off .w1,.tool.off .w2{display:none}
.tool[hidden]{display:none}
.tool:disabled{opacity:.4;cursor:not-allowed}
body.no-motion *,body.no-motion *::before,body.no-motion *::after{animation:none!important;transition:none!important}
.pop{position:absolute;right:20px;top:calc(100% + 8px);z-index:60;width:min(92vw,318px);
  background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 46px rgba(20,26,36,.18);
  padding:14px 15px;display:none;color:var(--text)}
.pop.on{display:block}
.pop h4{margin:0 0 4px;font-size:13.5px}
.pop .ps{font-size:11.5px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.pop .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line2);font-size:12.5px}
.pop .row span{color:var(--muted)}
.pop .row b{font-variant-numeric:tabular-nums}
.pop .sw{width:38px;height:21px;border-radius:999px;border:1px solid var(--line);background:var(--line2);position:relative;cursor:pointer;flex:0 0 auto}
.pop .sw i{position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:.16s}
.pop .sw.on{background:#0a7d3c;border-color:#0a7d3c}
.pop .sw.on i{left:19px}
.pop .pbtn{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 10px;cursor:pointer;color:var(--muted)}
.pop .pbtn:hover{border-color:#c9cfd8;color:var(--text)}
.pop .pbtn.danger{color:#b3261e;border-color:#efcfcb}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,8px);z-index:95;background:#1f2329;color:#fff;
  font-size:12.5px;padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.dark .tool{background:#0d151d;border-color:#1b2734;color:#8a9bb0}
body.dark .tool b{color:#eaf3ff}
body.dark .pop{background:#0c141d;border-color:#1e2c3b;box-shadow:0 18px 46px rgba(0,0,0,.55)}
body.dark .pop .row{border-top-color:#17242f}
body.dark .pop .sw{background:#16222d;border-color:#22303f}
body.dark .pop .sw.on{background:#1f7a4a;border-color:#1f7a4a}
body.dark .pop .pbtn{background:#101a24;border-color:#22303f;color:#9fb2c6}


main{max-width:1240px;margin:0 auto;padding:22px 20px 64px}

/* ---------- 通用块 ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .n{font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .sub{font-size:11px;color:var(--faint);margin-top:6px}
h2.sec{font-size:15px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec .hint{font-size:12px;color:var(--faint);font-weight:400}
.btn{font:inherit;font-size:12px;padding:3px 11px;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--muted);cursor:pointer}
.btn:hover{border-color:#c9cfd8;color:var(--text)}
h2.sec .btn{margin-left:auto;font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.muted{color:var(--muted)}
.tiny{font-size:11.5px;color:var(--faint)}
.bar{background:var(--line);height:8px;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:5px}
.bar.amber i{background:#c99a1a}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--line2);color:var(--muted);white-space:nowrap}
.pill.warn{background:#fdf3e3;color:var(--amber)}
.pill.ok{background:#e8f5ec;color:var(--green)}
.pill.blue{background:var(--accent-soft);color:var(--blue)}

/* ---------- 总览 ---------- */
.crew-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.crew-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;color:inherit;
  transition:box-shadow .15s ease,transform .15s ease,border-color .15s ease;
}
.crew-card:hover{text-decoration:none;box-shadow:0 6px 20px rgba(31,35,41,.08);transform:translateY(-1px);border-color:#d3d8e0}
.crew-card .shot{position:relative;aspect-ratio:9/16;background:#edeff2;overflow:hidden}
.crew-card .shot img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.crew-card .shot .tag{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.9);border-radius:6px;font-size:11px;padding:2px 6px;color:var(--muted)}
.crew-card .shot .miss{position:absolute;right:8px;top:8px;background:#fdf3e3;color:var(--amber);border-radius:6px;font-size:11px;padding:2px 6px;font-weight:600}
.crew-card .body{padding:11px 12px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
.crew-card .nm{display:flex;align-items:baseline;gap:7px}
.crew-card .nm b{font-size:15px}
.crew-card .nm em{font-style:normal;font-size:11px;color:var(--faint);letter-spacing:.6px}
.crew-card .role{font-size:11.5px;color:var(--muted);line-height:1.45;min-height:32px}
.crew-card .stat{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- 人物详情 ---------- */
.crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chips a{font-size:12.5px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:#fff;white-space:nowrap}
.chips a.on{color:#fff;background:var(--text);border-color:var(--text)}
.chips a:hover{text-decoration:none;border-color:#c9cfd8;color:var(--text)}
.chips a.on:hover{color:#fff}

/* ---------- 素材库 ---------- */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px}
.lib-card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  transition:border-color .15s ease,box-shadow .15s ease}
.lib-card:hover{border-color:#cdd4de;box-shadow:0 6px 18px rgba(31,35,41,.07)}
.lib-card .im{display:block;background:#0b0f14;overflow:hidden;cursor:zoom-in}
.lib-card .im img{width:100%;height:100%;object-fit:cover}
.lib-card .im.out,.lib-card .im.pos{aspect-ratio:3/4}
.lib-card .im.rm{aspect-ratio:16/9}
.lib-card .im.eq{aspect-ratio:1/1}
.lib-card .tx{display:flex;align-items:baseline;gap:7px;padding:8px 9px 0;min-width:0}
.lib-card .tx b{font:700 10.5px/1 Consolas,monospace;letter-spacing:.6px;color:var(--blue)}
.lib-card .tx a{font-size:12.5px;color:#2b3138;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-card .tx a:hover{text-decoration:none;color:var(--blue)}
.lib-card .mt{font-size:10.5px;color:var(--faint);padding:4px 9px 9px}
.lib-card .mt a{color:var(--muted)}
.lib-empty{padding:26px 0;color:var(--muted);font-size:13px}
.lib-owner{margin:-6px 0 14px;font-size:12px;color:var(--muted)}
.lib-owner b{color:var(--text)}

/* ---------- 装备页 #/gear ---------- */
.gear-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 14px}
.gsearch{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:999px;min-width:190px;flex:1 1 190px;max-width:290px}
.gsearch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:12px/1 -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif}
.gsearch input::placeholder{color:var(--faint)}
.gsearch svg{width:12px;height:12px;stroke:var(--faint);fill:none;stroke-width:1.8;flex:0 0 auto}
.gsel{height:30px;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:0 10px;font:12px/1 -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;outline:0;max-width:210px}
.gcount{margin-left:auto;font:600 10.5px/1 Consolas,monospace;letter-spacing:.8px;color:var(--faint);white-space:nowrap}
.gear-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s ease,box-shadow .15s ease}
.gcard:hover{border-color:#cdd4de;box-shadow:0 6px 18px rgba(31,35,41,.07)}
.gcard .im{position:relative;aspect-ratio:4/3;background:#0b0f14;overflow:hidden}
.gcard .im.can{cursor:zoom-in}
.gcard .im img{width:100%;height:100%;object-fit:cover}
.gcard .id{position:absolute;left:7px;top:6px;z-index:2;font:700 9.5px/1 Consolas,monospace;letter-spacing:.6px;color:#cfd8e2;background:rgba(6,10,14,.72);padding:3px 5px;border-radius:4px}
.gcard .ph{position:relative;display:flex;align-items:flex-end;justify-content:flex-start;height:100%;padding:8px;
  background:repeating-linear-gradient(135deg,rgba(31,35,41,.055) 0 1px,transparent 1px 9px),#eef1f5}
.gcard .ph em{font-style:normal;font:700 9px/1 Consolas,monospace;letter-spacing:.4px;color:#8a6d1a;border:1px solid #e2d3ab;padding:2px 4px;border-radius:3px;background:#fffdf6}
.gcard .ph i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;color:#c9d0d9;font:600 22px/1 Consolas,monospace;letter-spacing:1px}
.gcard .bd{padding:8px 9px 10px;display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.gcard .nm{font-size:12.5px;line-height:1.45;color:var(--text)}
.gcard .sp{font:10px/1.55 Consolas,monospace;color:var(--muted);min-height:31px}
.gcard .ft{display:flex;justify-content:space-between;gap:6px;align-items:baseline;margin-top:auto;padding-top:6px;border-top:1px solid var(--line2);font-size:10px;color:var(--faint)}
.gcard .ft a{color:var(--blue)}
.gcard .ft a:hover{text-decoration:none;color:#1a4f96}
.gcard .ft .cat{font:600 9px/1 Consolas,monospace;letter-spacing:.6px;color:var(--faint);white-space:nowrap}
.gcard .loc{font-size:10px;color:var(--faint);margin-top:1px;padding-top:5px;border-top:1px dashed var(--line2)}
.gcard .loc a{color:var(--blue)}
.gcard .loc a:hover{text-decoration:none;color:#1a4f96}

/* ---------- 房间页 #/rooms ---------- */
.rseg{margin-bottom:22px}
.rseg-h{display:flex;align-items:baseline;gap:9px;padding-bottom:8px;margin-bottom:11px;border-bottom:1px solid var(--line)}
.rseg-h .mk{font:700 10px/1 Consolas,monospace;letter-spacing:.6px;color:#fff;background:var(--text);border-radius:4px;padding:3px 5px}
.rseg-h b{font-size:14px}
.rseg-h .wh{font-size:11px;color:var(--faint)}
.rseg-h .ct{margin-left:auto;font:600 10.5px/1 Consolas,monospace;color:var(--faint);letter-spacing:.4px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rcard{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  overflow:hidden;color:inherit;transition:border-color .15s ease,box-shadow .15s ease}
.rcard:hover{text-decoration:none;border-color:#cdd4de;box-shadow:0 6px 18px rgba(31,35,41,.07)}
.rcard.on{border-color:#9dbfe8;box-shadow:inset 0 0 0 1px #9dbfe8}
.rcard .im{position:relative;aspect-ratio:16/9;background:#0b0f14;overflow:hidden}
.rcard .im img{width:100%;height:100%;object-fit:cover}
.rcard .im .id{position:absolute;left:7px;top:6px;z-index:2;font:700 9.5px/1 Consolas,monospace;letter-spacing:.6px;
  color:#cfd8e2;background:rgba(6,10,14,.72);padding:3px 5px;border-radius:4px}
.rcard .im .st{position:absolute;right:6px;top:6px;z-index:2;font-size:10px;padding:2px 6px;border-radius:4px;
  background:rgba(255,255,255,.93);color:var(--green)}
.rcard .im .st.warn{color:var(--amber)}
.rcard .im .st.off{color:#8a9099}
.rcard .ph{position:relative;display:flex;align-items:flex-end;height:100%;padding:8px;
  background:repeating-linear-gradient(135deg,rgba(31,35,41,.055) 0 1px,transparent 1px 9px),#eef1f5}
.rcard .ph i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;
  color:#c9d0d9;font:600 20px/1 Consolas,monospace;letter-spacing:1px}
.rcard .ph em{position:relative;font-style:normal;font:700 9px/1 Consolas,monospace;letter-spacing:.4px;color:#8a6d1a;
  border:1px solid #e2d3ab;padding:2px 4px;border-radius:3px;background:#fffdf6}
.rcard .bd{padding:9px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.rcard .r1{display:flex;align-items:baseline;gap:7px}
.rcard .r1 b{font:700 10.5px/1 Consolas,monospace;letter-spacing:.7px;color:var(--blue)}
.rcard .r1 em{font-style:normal;font-size:10px;color:var(--faint)}
.rcard .nm{font-size:13.5px;font-weight:600;line-height:1.35}
.rcard .ds{font-size:11.5px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.rcard .ft{display:flex;justify-content:space-between;gap:6px;margin-top:auto;padding-top:6px;
  border-top:1px solid var(--line2);font-size:10px;color:var(--faint)}

.dt{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:20px}
.dt .im{position:relative;aspect-ratio:16/9;background:#0b0f14;border-radius:6px;overflow:hidden;align-self:start}
.dt .im img{width:100%;height:100%;object-fit:cover}
.dt .im .ph{display:flex;align-items:flex-end;height:100%;padding:9px;
  background:repeating-linear-gradient(135deg,rgba(31,35,41,.055) 0 1px,transparent 1px 9px),#eef1f5;position:relative}
.dt .im .ph i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;
  color:#c9d0d9;font:600 22px/1 Consolas,monospace;letter-spacing:1px}
.dt .im .ph em{position:relative;font-style:normal;font:700 9px/1 Consolas,monospace;color:#8a6d1a;
  border:1px solid #e2d3ab;background:#fffdf6;padding:2px 4px;border-radius:3px}
.dt .bd{min-width:0}
.dt .cr{font:600 10px/1.4 Consolas,monospace;letter-spacing:.7px;color:var(--faint)}
.dt h2{margin:3px 0 7px;font-size:19px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.dt .ds{font-size:12.5px;color:var(--muted);line-height:1.65;margin:0 0 10px}
.dt dl{display:grid;grid-template-columns:52px minmax(0,1fr);margin:0 0 4px}
.dt dt{font-size:11.5px;color:var(--faint);padding:4px 0;border-bottom:1px solid var(--line2)}
.dt dd{margin:0;font-size:12px;padding:4px 0;border-bottom:1px solid var(--line2);line-height:1.55;word-break:break-word}
.dt .blk{border-top:1px solid var(--line2);padding-top:9px;margin-top:10px}
.dt .blk>b{display:flex;align-items:baseline;gap:7px;font-size:12px}
.dt .blk>b i{font-style:normal;font:600 10px/1 Consolas,monospace;color:var(--faint)}
.dt .kit{font-size:11px;color:var(--faint);line-height:1.65;margin-top:6px}
.dt .fn{margin:5px 0 0;padding:0;list-style:none}
.dt .fn li{position:relative;padding-left:11px;font-size:11.5px;line-height:1.7;color:#454c56}
.dt .fn li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:1px;background:#c3cbd6}
.dt .blk .eqs{margin-top:6px}
.gcard.on{outline:2px solid #9dbfe8;outline-offset:-2px}
.eqc{display:inline-block;font-size:11px;color:var(--blue);background:var(--accent-soft);border:1px solid #d8e6f8;
  border-radius:6px;padding:3px 7px;margin:0 5px 5px 0;white-space:nowrap}
.eqc b{font:700 9.5px/1 Consolas,monospace;letter-spacing:.4px;margin-right:4px}
.eqc:hover{text-decoration:none;background:#dfeafa}
.nb{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:12px;color:var(--text)}
.nb:last-child{border-bottom:0}
.nb em{font-style:normal;font:700 9.5px/1 Consolas,monospace;letter-spacing:.4px;color:var(--faint);flex:0 0 auto}
.nb .md{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;white-space:nowrap;flex:0 0 auto}
.nb .tm{margin-left:auto;font:600 10px/1 Consolas,monospace;color:var(--faint);white-space:nowrap}
.nb:hover{text-decoration:none;color:var(--blue)}
.pill.st-ok{background:#e8f5ec;color:var(--green)}
.pill.st-warn{background:#fdf3e3;color:var(--amber)}
.pill.st-off{background:#eef1f6;color:#7b828c}

/* ---------- 舰员选择 ---------- */
.pick-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pick-head h1{font-size:20px;margin:0;letter-spacing:.5px}
.pick-head .sub{font-size:12px;color:var(--muted)}
.pick-head .btn{margin-left:auto;text-decoration:none}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px}
.pick-card{display:flex;gap:12px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  color:inherit;transition:box-shadow .15s ease,transform .15s ease,border-color .15s ease}
.pick-card:hover{text-decoration:none;box-shadow:0 6px 20px rgba(31,35,41,.08);transform:translateY(-1px);border-color:#d3d8e0}
.pick-card .im{flex:0 0 74px;width:74px;aspect-ratio:9/16;border-radius:6px;overflow:hidden;background:#edeff2}
.pick-card .im img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.pick-card .bd{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1;justify-content:center}
.pick-card .nm{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.pick-card .nm b{font-size:15.5px}
.pick-card .nm em{font-style:normal;font-size:10.5px;letter-spacing:.7px;color:var(--faint);font-variant-numeric:tabular-nums}
.pick-card .nm .last{font-style:normal;font-size:10px;color:var(--blue);background:var(--accent-soft);border-radius:4px;padding:0 5px;white-space:nowrap}
.pick-card .rl{font-size:11.5px;color:var(--muted);line-height:1.45;min-height:0}
.pick-card .pg{display:flex;align-items:center;gap:8px}
.pick-card .pb{flex:1 1 auto;height:5px;border-radius:4px;background:var(--line);overflow:hidden}
.pick-card .pb i{display:block;height:100%;border-radius:4px;background:var(--green)}
.pick-card .pv{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pick-card .ms{font-size:10.5px;color:var(--faint)}
.pick-card .ms.warn{color:var(--amber)}
.pick-card.last-on{border-color:#bcd3ee;box-shadow:0 0 0 1px rgba(26,95,180,.12)}

.hero{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;align-items:start}
.hero .photo{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.hero .photo img{width:100%;aspect-ratio:9/16;object-fit:cover;cursor:zoom-in;background:#edeff2}
.hero .photo .cap{padding:8px 11px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--line2)}
.hero .info h1{font-size:26px;margin:0 0 2px;letter-spacing:.5px}
.hero .info .meta{font-size:12px;color:var(--faint);letter-spacing:1px;margin-bottom:10px;text-transform:uppercase}
.hero .info .tagline{
  font-size:14px;color:#333a44;background:var(--panel);border-left:3px solid var(--accent);
  padding:9px 13px;border-radius:0 8px 8px 0;margin:0 0 14px;
}
.hero .info .role{font-size:13px;color:var(--muted);margin-bottom:12px}
.hero .mods{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.hero .mods span{font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:#3d4450}

/* ---------- 克隆体切换 ---------- */
.hero .clone{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin:0 0 14px;overflow:hidden}
.clone .cl-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line2);background:#fbfcfd}
.clone .cl-h b{font-size:12.5px;letter-spacing:.4px}
.clone .cl-h span{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.clone .cl-tabs{display:flex;border-bottom:1px solid var(--line2)}
.clone .cl-t{font:inherit;font-size:11.5px;flex:1;padding:7px 4px;border:0;border-right:1px solid var(--line2);background:#fff;
  color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.clone .cl-t:last-child{border-right:0}
.clone .cl-t b{font:700 12px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.6px}
.clone .cl-t em{font-style:normal;font-size:10px;color:var(--faint)}
.clone .cl-t:hover{background:#f7f9fb;color:var(--text)}
.clone .cl-t.on{background:var(--accent-soft);color:var(--blue);box-shadow:inset 0 -2px 0 var(--blue)}
.clone .cl-t.on em{color:var(--blue);opacity:.85}
.clone .cl-p{display:none;padding:2px 12px 8px}
.clone .cl-p.on{display:block}
.clone .cl-p dl{display:grid;grid-template-columns:60px minmax(0,1fr);margin:0}
.clone .cl-p dt{font-size:11.5px;color:var(--faint);padding:5px 0;border-bottom:1px solid var(--line2)}
.clone .cl-p dd{margin:0;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums;word-break:break-word}
.clone .cl-p dt:nth-last-of-type(1),.clone .cl-p dd:nth-last-of-type(1){border-bottom:0}
.clone .cl-note{font-size:11px;color:var(--faint);line-height:1.6;padding:8px 12px;border-top:1px solid var(--line2);background:#fbfcfd}
dl.profile{display:grid;grid-template-columns:86px minmax(0,1fr);gap:0;margin:0;border-top:1px solid var(--line2)}
dl.profile dt{padding:7px 0;font-size:12px;color:var(--faint);border-bottom:1px solid var(--line2)}
dl.profile dd{padding:7px 0;margin:0;font-size:12.5px;line-height:1.6;border-bottom:1px solid var(--line2);word-break:break-word}
details.more{margin-top:10px}
details.more summary{cursor:pointer;font-size:12px;color:var(--blue);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ "}
details.more[open] summary::before{content:"▾ "}
.kink .kbtn{font:inherit;font-size:11px;margin-left:6px;padding:1px 8px;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--muted);cursor:pointer}
.kink .kbtn:hover{border-color:#c9cfd8;color:var(--text)}
.kink .kbtn:disabled{opacity:.45;cursor:not-allowed}
.kink .kc{font:700 13px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--text);font-variant-numeric:tabular-nums}

/* ---------- 生命体征 ---------- */
.vitals,.evlog{margin-top:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.vitals .vh,.evlog .vh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--line2);background:#fbfcfd}
.vitals .vh b,.evlog .vh b{font-size:13px;letter-spacing:.4px}
.vitals .vh span,.evlog .vh span{font-size:10.5px;color:var(--faint);letter-spacing:.9px;text-transform:uppercase}
.vitals .vh em,.evlog .vh em{font-style:normal;margin-left:auto;font-size:10px;color:var(--amber);background:#fdf3e3;border-radius:4px;padding:1px 6px;white-space:nowrap}
.vit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 14px 14px}
.vit{border:1px solid var(--line2);border-radius:8px;padding:8px 10px 9px;background:#fff;min-width:0}
.vit .vt{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.vit .vt span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.vit .vt b{font:700 13px/1 ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.vit .vb{display:block;height:4px;border-radius:3px;background:var(--line);margin:7px 0 5px;overflow:hidden}
.vit .vb s{display:block;height:100%;width:0;border-radius:3px;background:#2f9e63;text-decoration:none;transition:width .9s linear,background .5s}
.vit .s{display:block;font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vit.warn .vb s{background:#d8a72c}
.vit.warn .vt b{color:#8a6d1a}
.vit.bad .vb s{background:#c8563d}
.vit.bad .vt b{color:#b23c2b}

/* ---------- 事件流 ---------- */
.tl{list-style:none;margin:0;padding:10px 14px 12px 14px}
.tli{position:relative;margin-left:72px;padding:6px 0 6px 20px;border-left:1px solid var(--line2)}
.tli time{position:absolute;left:-72px;top:7px;width:60px;text-align:right;font:11.5px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.tli i{position:absolute;left:-5px;top:11px;width:9px;height:9px;border-radius:50%;border:2px solid #cfd6df;background:#fff;box-sizing:content-box}
.tli .tx b{display:block;font-size:12.5px;line-height:1.5}
.tli .tx span{display:block;font-size:11.5px;color:var(--muted);line-height:1.55}
.tli.past i{background:#2f9e63;border-color:#2f9e63}
.tli.dead i{background:#c8563d;border-color:#c8563d}
.tli.future .tx b{color:var(--muted);font-weight:600}
.tli.now i{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,95,180,.16)}
.tli.now .tx b{color:var(--blue)}
.tli.pending time{font-size:10.5px}

.gapbox{background:#fffdf7;border:1px solid #f0e2c4;border-radius:var(--radius);padding:12px 14px;margin:18px 0 4px}
.gapbox b{color:var(--amber)}
.gapbox ul{margin:8px 0 0;padding-left:18px}
.gapbox li{font-size:12.5px;margin:3px 0;color:#54462a}
.gapbox .cnt{font-size:12px;color:var(--muted)}

.series{margin-top:26px}
.series-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.series-h b{font-size:15px}
.series-h .sid{font-size:11px;letter-spacing:1px;color:var(--faint);font-variant-numeric:tabular-nums}
.series-h .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.series-note{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-left:3px solid #d9dee6;border-radius:0 6px 6px 0;padding:7px 11px;margin:6px 0 12px;line-height:1.65}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px}
.shot-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.shot-card .im{aspect-ratio:9/16;background:#edeff2;overflow:hidden}
.shot-card .im img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;transition:transform .25s ease}
.shot-card:hover .im img{transform:scale(1.03)}
.shot-card .t{padding:6px 8px 7px;font-size:11px;line-height:1.35;color:#3d4450}
.shot-card .t em{display:block;font-style:normal;color:var(--faint);font-size:10.5px;margin-top:2px}
.shot-card .tags{display:flex;flex-wrap:wrap;gap:3px;padding:0 8px 8px}
.shot-card .tags i{font-style:normal;font-size:10px;color:#7a828d;background:var(--line2);border-radius:4px;padding:1px 5px}

/* 缺图占位：用该人物主图顶替 + 编号与「待补」角标，不留空框 */
.shot-card.ph{border-style:dashed;border-color:#d9c9a4}
.shot-card.ph .im{position:relative}
.shot-card.ph .im img{filter:saturate(.5) brightness(.94) contrast(.96)}
.shot-card.ph .im::after{content:"";position:absolute;inset:0;background:rgba(37,32,20,.16)}
.ph-tag{
  position:absolute;left:6px;top:6px;z-index:2;display:flex;align-items:center;gap:4px;
  font:700 10px/1 Consolas,monospace;letter-spacing:.4px;color:#3b2f12;
  background:rgba(255,247,224,.94);border:1px solid #e0c893;border-radius:4px;padding:3px 5px;
}
.ph-tag em{font-style:normal;color:#a8842f;font-weight:400;letter-spacing:0}
.shot-card.ph .t em{color:#a8842f}

/* ---------- 看板 ---------- */
.board-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px}
.panel h3{margin:0 0 3px;font-size:14px}
.panel .sub{font-size:11.5px;color:var(--faint);margin-bottom:12px}
.prow{display:grid;grid-template-columns:76px minmax(0,1fr) 74px;gap:10px;align-items:center;margin:9px 0;font-size:12.5px}
.prow .nm b{font-weight:600}
.prow .nm{display:flex;align-items:baseline;gap:5px}
.prow .nm span{font-size:10.5px;color:var(--faint)}
.prow .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px}
.heat{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.hrow{display:grid;grid-template-columns:70px minmax(0,1fr);gap:9px;align-items:center}
.hrow .nm{font-size:12px;white-space:nowrap}
.hcells{display:flex;gap:3px;flex-wrap:wrap}
.hcell{width:26px;height:22px;border-radius:4px;font-size:9.5px;display:flex;align-items:center;justify-content:center;color:#fff;font-variant-numeric:tabular-nums;cursor:default}
.hcell.p0{background:#eceff3;color:#9aa1ab}
.hcell.part{background:#e3b23c}
.hcell.full{background:#2f9e63}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}

table.q{width:100%;border-collapse:collapse;font-size:12px}
table.q th,table.q td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.q th{background:var(--line2);position:sticky;top:0;font-weight:600}
table.q tr:nth-child(even) td{background:#fbfcfd}
.done{color:var(--green);font-weight:600}
.failed{color:var(--red);font-weight:600}
.pending{color:var(--amber)}
.running{color:var(--blue);font-weight:600}
.scrollbox{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.scrollbox table.q th{position:sticky;top:0;z-index:1}
.scrollbox table.q{min-width:520px}
.qgroups{display:flex;flex-direction:column;gap:10px}
.qg{font-size:12px}
.qg .top{display:flex;justify-content:space-between;margin-bottom:4px;color:var(--muted)}
.qg .top b{color:var(--text);font-weight:600}

/* ---------- 垃圾站 ---------- */
.quotes{width:100%;border-collapse:collapse;font-size:12.5px}
.quotes td{border-bottom:1px solid var(--line2);padding:6px 8px;vertical-align:top}
.quotes td:first-child{color:var(--muted);width:44%}
.tgroup{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin-bottom:10px;overflow:hidden}
.tgroup summary{cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;list-style:none;font-size:13.5px}
.tgroup summary::-webkit-details-marker{display:none}
.tgroup summary .arrow{color:var(--faint);font-size:11px;transition:transform .15s}
.tgroup[open] summary .arrow{transform:rotate(90deg)}
.tgroup summary b{font-weight:600}
.tgroup summary .c{margin-left:auto;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.tgroup .inner{padding:0 14px 14px;border-top:1px solid var(--line2)}
.tgroup .reason{font-size:12px;color:#5b6472;background:#fbfcfd;border:1px solid var(--line2);border-radius:6px;padding:8px 10px;margin:11px 0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px}
.tcell{border:1px solid var(--line2);border-radius:7px;overflow:hidden;background:#fff}
.tcell .im{aspect-ratio:1/1;background:#edeff2;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tcell .im img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.tcell .t{padding:5px 7px 6px;font-size:10.5px;line-height:1.35;color:#4a515c;word-break:break-all}
.tcell .t em{display:block;font-style:normal;color:#a8842f;margin-top:2px}

/* ---------- 总览 · 舰桥 ---------- */
body.dark{background:#070b10;color:#dfe7f2}
body.dark header.top{background:rgba(9,14,20,.9);border-bottom-color:#1b2734}
body.dark .brand b{color:#eaf3ff}
body.dark .brand span{color:#5a6b80}
body.dark nav.tabs a{color:#8a9bb0}
body.dark nav.tabs a:hover{background:#151d28;color:#eaf3ff;text-decoration:none}
body.dark nav.tabs a.on{background:#5fd0ff;color:#04121b}
body.dark footer{color:#5a7089}
body.dark main{max-width:1360px}

.ov{position:relative;border-radius:14px;overflow:hidden;color:#dfe7f2;
  background:radial-gradient(120% 90% at 50% -10%,#15202c 0%,#0b1118 48%,#070b10 100%);
  border:1px solid #1b2734;
  box-shadow:0 26px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(150,200,255,.07)}
.ov::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;z-index:0;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 88px),
    repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 44px),
    radial-gradient(circle at 22px 22px,rgba(150,200,255,.09) 1.2px,transparent 1.7px);
  background-size:auto,auto,88px 44px}

.ov-bar{position:relative;z-index:2;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:11px 18px;border-bottom:1px solid #1b2734;
  background:linear-gradient(180deg,rgba(23,35,48,.92),rgba(11,17,24,.55))}
.ov-bar .k{font:600 9.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2.6px;color:#5fd0ff}
.ov-bar h2{margin:5px 0 0;font-size:15px;letter-spacing:3px;font-weight:600;color:#eef6ff}
.ov-bar .flex{flex:1 1 auto}
.led{width:7px;height:7px;border-radius:50%;background:#3ce08a;box-shadow:0 0 9px #3ce08a;animation:led 2.2s ease-in-out infinite;flex:0 0 auto}
@keyframes led{0%,100%{opacity:1}50%{opacity:.28}}
.ov-stats{display:flex}
.ov-stat{padding:0 13px;border-left:1px solid #223142;text-align:right}
.ov-stat:first-child{border-left:0}
.ov-stat .n{font:700 16px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;color:#eaf3ff;font-variant-numeric:tabular-nums}
.ov-stat .l{font-size:9.5px;letter-spacing:1.1px;color:#6d8098;margin-top:2px;white-space:nowrap}

.ov-stage{position:relative;z-index:2;display:grid;grid-template-columns:196px minmax(0,1fr) 300px;align-items:stretch}
.ov-side{padding:20px 18px;display:flex;flex-direction:column;gap:13px;min-width:0}
.ov-left{border-right:1px solid #1b2734;background:linear-gradient(90deg,rgba(9,15,22,.92),rgba(9,15,22,.3))}
.ov-right{border-left:1px solid #1b2734;background:linear-gradient(270deg,rgba(9,15,22,.92),rgba(9,15,22,.3))}
.ov-k{font:600 9.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2.4px;color:#5fd0ff;opacity:.85}
.ov-field{min-width:0}
.ov-lab{font-size:9.5px;letter-spacing:1.6px;color:#66798f;text-transform:uppercase;margin-bottom:4px}
.ov-val{font-size:13px;color:#cfdbe9;word-break:break-word}
.ov-eye-row{display:flex;align-items:center;gap:8px}
.ov-eye-row i{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.ov-eye-row b{font:600 11.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.6px;color:#a9bccf}
.ov-led{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3ce08a;box-shadow:0 0 8px #3ce08a;margin-right:6px;vertical-align:1px}
.ov-led.warn{background:#e8b64c;box-shadow:0 0 8px #e8b64c}
.ov-meter{height:6px;border-radius:4px;background:#16202b;overflow:hidden;border:1px solid #1e2b39}
.ov-meter i{display:block;height:100%;background:linear-gradient(90deg,#2b8fd0,#5fd0ff);box-shadow:0 0 12px rgba(95,208,255,.6)}
.ov-num{font:600 10.5px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;color:#8fa5bb;margin-top:5px;font-variant-numeric:tabular-nums}

.ov-center{position:relative;display:flex;align-items:center;justify-content:center;min-height:566px;overflow:hidden;padding:20px 0}
.ov-space{position:absolute;left:50%;top:47%;width:min(88%,668px);aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#143049 0%,#091826 42%,#050a10 72%,#04070a 100%);
  box-shadow:inset 0 0 90px 30px rgba(2,6,10,.94),0 0 0 1px #1d3145,0 0 80px rgba(50,140,220,.13)}
.ov-space i{position:absolute;inset:0;opacity:.75;
  background-image:
    radial-gradient(1.3px 1.3px at 22% 28%,#fff,transparent),
    radial-gradient(1px 1px at 62% 18%,#cfe6ff,transparent),
    radial-gradient(1.6px 1.6px at 78% 62%,#fff,transparent),
    radial-gradient(1px 1px at 34% 72%,#9fc6e8,transparent),
    radial-gradient(1px 1px at 48% 46%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 14% 58%,#bcd8f0,transparent),
    radial-gradient(1px 1px at 86% 34%,#fff,transparent),
    radial-gradient(1px 1px at 70% 84%,#cfe6ff,transparent);
  animation:twinkle 7s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.45}to{opacity:.9}}
.ov-ring{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}
.ov-ring.r1{width:min(94%,610px);aspect-ratio:1/1;border:1px solid rgba(95,208,255,.18);box-shadow:inset 0 0 44px rgba(95,208,255,.13)}
.ov-ring.r2{width:min(84%,540px);aspect-ratio:1/1;border:1px dashed rgba(95,208,255,.24);animation:spin 30s linear infinite}
.ov-ring.r3{width:min(68%,440px);aspect-ratio:1/1;
  background:conic-gradient(from 0deg,transparent 0deg,rgba(95,208,255,.45) 42deg,transparent 96deg,transparent 210deg,rgba(232,192,114,.34) 250deg,transparent 300deg);
  -webkit-mask:radial-gradient(circle,transparent 63%,#000 64%);
  mask:radial-gradient(circle,transparent 63%,#000 64%);
  animation:spin 18s linear infinite reverse;opacity:.9}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.ov-figure{position:relative;z-index:3;display:flex;align-items:flex-end;justify-content:center;height:100%;padding-bottom:4px}
.ov-figure img{position:relative;z-index:2;max-height:min(438px,52vh);width:auto;max-width:100%;object-fit:contain;border-radius:10px;cursor:zoom-in;
  box-shadow:0 0 0 1px rgba(120,190,255,.17),0 0 46px rgba(40,110,180,.16),0 24px 50px rgba(0,0,0,.7);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 87%,rgba(0,0,0,.45) 100%);
  mask-image:linear-gradient(180deg,#000 0%,#000 87%,rgba(0,0,0,.45) 100%)}
/* 透明底立绘接入位：CUT.on 后立绘从舷窗浮出，矩形补偿（描边/渐隐/台座光斑）全部撤掉 */
.ov-figure.cut img{border-radius:0;box-shadow:none;-webkit-mask-image:none;mask-image:none;
  max-height:min(500px,60vh);
  filter:drop-shadow(0 20px 34px rgba(0,0,0,.5)) drop-shadow(0 0 20px rgba(95,208,255,.16))}
.ov-figure.cut .ov-plinth{opacity:0}
.ov-plinth{position:absolute;z-index:1;left:50%;bottom:1%;width:82%;height:24px;transform:translateX(-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(95,208,255,.4),rgba(95,208,255,.1) 56%,transparent 76%);
  filter:blur(6px)}
.ov-aura{position:absolute;z-index:1;left:50%;top:50%;width:82%;height:84%;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(58% 52% at 50% 46%,rgba(120,210,255,.22),rgba(120,210,255,.06) 58%,transparent 74%);
  filter:blur(10px);mix-blend-mode:screen;opacity:.7;animation:aura 5.5s ease-in-out infinite}
@keyframes aura{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}50%{opacity:.92;transform:translate(-50%,-50%) scale(1.035)}}

.ov-rbox{min-width:0}
.ov-radar{width:100%;max-width:238px;height:auto;display:block;margin:4px auto 2px}
.ov-radar .rg{fill:none;stroke:rgba(120,170,215,.22);stroke-width:.8}
.ov-radar .ra{stroke:rgba(120,170,215,.18);stroke-width:.6}
.ov-radar .rv{fill:var(--eye,#5fd0ff);fill-opacity:.24;stroke:var(--eye,#5fd0ff);stroke-width:1.1;stroke-linejoin:round}
.ov-radar .rd{fill:var(--eye,#5fd0ff)}
.ov-radar .rt{fill:#8095ab;font-size:9px;letter-spacing:.3px}
.ov-radar .rh{fill:transparent}
.ov-radar .ax{cursor:pointer}
.ov-radar .ax:hover .rt,.ov-radar .ax.on .rt{fill:#5fd0ff}
.ov-radar .ax.on .rt{font-weight:700}
.ov-gear{display:flex;flex-direction:column;gap:5px;margin-top:2px;max-height:246px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2d4356 transparent;padding-right:2px}
.ov-gear::-webkit-scrollbar{width:4px}
.ov-gear::-webkit-scrollbar-thumb{background:#2d4356;border-radius:3px}
.ov-grow{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:#b9c9da;
  background:linear-gradient(90deg,rgba(24,36,49,.85),rgba(24,36,49,.25));
  border-left:2px solid rgba(95,208,255,.5);border-radius:0 5px 5px 0;padding:5px 9px}
.ov-grow span{flex:1 1 auto;min-width:0;line-height:1.5;word-break:break-word}
.ov-grow b{flex:0 0 auto;margin-top:1px;font:600 9.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:#5fd0ff;letter-spacing:.6px}
.ov-grow.empty{color:#5f7186;border-left-color:#2b3b4c}
/* P2 · 装备行可点 + 浮卡 */
.ov-grow.eq{width:100%;font:inherit;font-size:11.5px;color:#b9c9da;text-align:left;cursor:pointer;
  border:0;border-left:2px solid rgba(95,208,255,.5);transition:background .16s,color .16s,border-color .16s,box-shadow .16s}
.ov-grow.eq:hover{background:linear-gradient(90deg,rgba(36,55,74,.95),rgba(30,45,60,.4));color:#eaf6ff;border-left-color:#5fd0ff}
.ov-grow.eq.on{background:linear-gradient(90deg,rgba(44,68,92,.96),rgba(34,52,70,.55));border-left-color:#a8e6ff;
  box-shadow:0 0 0 1px rgba(95,208,255,.25) inset}
.ov-grow.eq i{font-style:normal;font-size:9.5px;color:#6f8aa2;margin-left:6px;letter-spacing:.3px}
.ov-grow.eq:hover i,.ov-grow.eq.on i{color:#8fb6d4}
.ov-kc{margin-left:auto;font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:#5f7a92;letter-spacing:.6px}
#eqPop{position:fixed;z-index:86;width:266px;display:none;padding:11px 13px 12px;border-radius:10px;
  background:#0c141d;border:1px solid #24374a;box-shadow:0 18px 46px rgba(0,0,0,.6);color:#c6d6e6}
#eqPop.on{display:block}
#eqPop .hd{display:flex;align-items:center;gap:7px}
#eqPop .hd b{font:700 10.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.7px;color:#5fd0ff}
#eqPop .hd em{font-style:normal;font-size:9px;color:#8ea4bb;border:1px solid #24374a;border-radius:4px;padding:1px 5px}
#eqPop .hd .x{margin-left:auto;width:20px;height:20px;border:0;border-radius:5px;background:transparent;color:#7d93a8;
  font-size:14px;line-height:1;cursor:pointer}
#eqPop .hd .x:hover{background:#182534;color:#dceaf7}
#eqPop h4{margin:7px 0 3px;font-size:14px;line-height:1.35;color:#f0f7ff}
#eqPop .ow{font-size:10.5px;color:#8ea4bb;margin-bottom:7px}
#eqPop .ow a{color:#9fdcff}
#eqPop p{margin:0 0 10px;font-size:11.5px;line-height:1.62;color:#a9bccd;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
#eqPop .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px solid #1b2734}
#eqPop .spec{font:600 9px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:#74899e;letter-spacing:.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#eqPop a.more{font-size:11.5px;color:#9fdcff;white-space:nowrap;flex:0 0 auto}
#eqPop a.more:hover{color:#d4f1ff}

.ov-dock{position:relative;z-index:2;border-top:1px solid #1b2734;padding:10px 12px 12px;
  background:linear-gradient(180deg,rgba(13,20,28,.55),rgba(7,11,16,.95))}
.ov-dockrow{display:flex;align-items:center;gap:8px}
.ov-strip{display:flex;gap:7px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:2px 0;flex:0 1 auto;max-width:100%;margin:0 auto;min-width:0}
.ov-strip::-webkit-scrollbar{display:none}
.ov-nav{flex:0 0 28px;width:28px;height:74px;border-radius:7px;border:1px solid #243244;background:#0d151d;color:#8ea4bb;font-size:16px;line-height:1;cursor:pointer;transition:.18s}
.ov-nav:hover{color:#5fd0ff;border-color:#3a6484;box-shadow:0 0 14px rgba(95,208,255,.25)}
.ov-nav:disabled{opacity:.28;cursor:not-allowed;color:#5b6b7c;border-color:#1b2734;box-shadow:none}
.ov-av{flex:0 0 58px;height:74px;border-radius:7px;overflow:hidden;position:relative;cursor:pointer;
  border:1px solid #22303f;opacity:.45;filter:saturate(.45);transition:opacity .2s,transform .2s,box-shadow .2s,border-color .2s}
.ov-av img{width:100%;height:100%;object-fit:cover;object-position:50% 14%}
.ov-av:hover{opacity:.8;transform:translateY(-1px);border-color:#8fb6d6}
.ov-av.press{opacity:.92;transform:scale(.95);border-color:var(--hud)}
.ov-av.on{opacity:1;filter:none;border-color:#e8c072;box-shadow:0 0 0 1px rgba(232,192,114,.9),0 0 18px rgba(232,192,114,.4);transform:translateY(-2px)}
.ov-av .no{position:absolute;left:0;right:0;bottom:0;text-align:center;font:600 8.5px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;color:#dfe7f2;background:linear-gradient(transparent,rgba(3,7,11,.9))}
.ov-plate{position:relative;z-index:2;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;
  padding:13px 20px 6px;border-top:1px solid #1b2734;
  background:linear-gradient(180deg,rgba(13,20,28,.25),rgba(9,14,20,.72))}
.ov-plate::before{content:"";position:absolute;left:0;top:13px;bottom:8px;width:2px;
  background:var(--eye,#5fd0ff);box-shadow:0 0 14px var(--eye,#5fd0ff)}
.ov-plate .nm{min-width:0;flex:1 1 auto}
.ov-plate .nm b{display:block;font-size:clamp(22px,3.4vw,34px);line-height:1.12;letter-spacing:4px;color:#f6faff;
  word-break:break-word;overflow-wrap:anywhere;text-shadow:0 0 26px rgba(95,208,255,.22)}
.ov-plate .nm em{display:block;font-style:normal;font:600 10px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:2.4px;color:#7f93a9;margin-top:3px}
.ov-plate .sub{display:flex;flex-direction:column;gap:2px;font-size:10.5px;color:#8ea4bb;letter-spacing:1px;text-align:right;max-width:52%}
.ov-plate .sub b{font-size:12px;color:#dfe7f2;letter-spacing:1.4px}
.ov-plate .ov-goto{align-self:center}
.ov-nameblk b{display:block;font-size:23px;line-height:1.15;letter-spacing:2px;color:#f6faff;
  word-break:break-word;overflow-wrap:anywhere}
.ov-nameblk em{display:block;font-style:normal;font:600 9.5px/1.9 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px;color:#6d8098}
.ov-cname{display:none}
.ov-link{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.ov-link::after{content:"›";font-size:11px;color:#4e6075;transition:.16s}
.ov-link:hover{color:#eaf3ff;text-decoration:none}
.ov-link:hover::after{color:#5fd0ff;transform:translateX(1px)}
.ov-atip{margin-top:7px;min-height:48px;font-size:11px;line-height:1.55;color:#8ea4bb;
  border-left:2px solid rgba(95,208,255,.38);padding:5px 9px;background:rgba(24,36,49,.42);border-radius:0 5px 5px 0}
.ov-atip b{color:#dfe7f2;font-weight:600;margin-right:5px}
.ov-atip b i{font-style:normal;font:700 12px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:#5fd0ff;margin-left:5px}
.ov-glink{display:block;margin-top:8px;padding-top:7px;border-top:1px solid #1b2734;font-size:10.5px;letter-spacing:.9px;color:#8fc6ff}
.ov-na{margin:6px 0 2px;padding:16px 12px;border:1px dashed #22303f;border-radius:2px;text-align:center;
  font-size:10.5px;letter-spacing:1.6px;color:#577086;line-height:1.8;background:rgba(99,215,255,.02)}
.ov-na b{display:block;font:700 11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2.4px;color:#6f8fa6;margin-bottom:6px}
.ov-glink:hover{color:#eaf6ff;text-decoration:none}
.ov-tip{text-align:center;font-size:10.5px;letter-spacing:1.2px;color:#4e6075;margin-top:5px}
.ov-goto{margin-left:6px;font-size:10.5px;letter-spacing:1px;color:#8fc6ff;border:1px solid rgba(95,208,255,.35);
  border-radius:999px;padding:2px 9px;white-space:nowrap;background:rgba(95,208,255,.08)}
.ov-goto:hover{color:#eaf6ff;border-color:rgba(95,208,255,.7);text-decoration:none}

/* ---------- 总览 · 悬浮状态卡（P1） ---------- */
.ov-pcard{position:absolute;left:14px;bottom:14px;z-index:6;width:196px;
  display:flex;flex-direction:column;gap:7px;padding:9px 10px 11px;
  border:1px solid rgba(95,208,255,.22);border-radius:10px;
  background:linear-gradient(180deg,rgba(11,20,29,.9),rgba(6,11,17,.96));
  box-shadow:0 14px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(150,200,255,.08)}
.ov-pcol{position:relative;height:132px;border-radius:7px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 102%,rgba(95,208,255,.2),transparent 64%)}
.ov-pbeam{position:absolute;left:50%;top:3px;bottom:4px;width:56px;transform:translateX(-50%);border-radius:28px;
  background:linear-gradient(0deg,rgba(150,228,255,.32) 0%,rgba(95,208,255,.16) 34%,rgba(95,208,255,.04) 72%,rgba(95,208,255,0) 100%);
  box-shadow:inset 0 0 18px rgba(120,215,255,.32),0 0 22px rgba(80,180,255,.14)}
.ov-pflow{position:absolute;left:50%;top:3px;bottom:4px;width:42px;transform:translateX(-50%);opacity:.7;
  background:repeating-linear-gradient(0deg,rgba(180,235,255,0) 0 7px,rgba(190,238,255,.4) 7px 8px,rgba(180,235,255,0) 8px 20px);
  -webkit-mask:linear-gradient(180deg,transparent,#000 20%,#000 80%,transparent);
  mask:linear-gradient(180deg,transparent,#000 20%,#000 80%,transparent);
  animation:pflow 2.2s linear infinite}
@keyframes pflow{from{background-position:0 0}to{background-position:0 -20px}}
.ov-pport{position:absolute;left:50%;top:1px;bottom:4px;width:80px;transform:translateX(-50%);
  display:flex;align-items:flex-end;justify-content:center;animation:pfloat 4.8s ease-in-out infinite}
.ov-pport img{max-width:100%;max-height:100%;object-fit:contain;
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 70%,rgba(0,0,0,.45) 88%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0,#000 70%,rgba(0,0,0,.45) 88%,transparent 100%);
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.55)) drop-shadow(0 0 14px rgba(95,208,255,.5))}
.ov-pport.ph img{opacity:.6;filter:drop-shadow(0 0 10px rgba(95,208,255,.35))}
@keyframes pfloat{0%,100%{transform:translateX(-50%) translateY(-3px)}50%{transform:translateX(-50%) translateY(2px)}}
.ov-pmiss{position:absolute;right:3px;top:3px;z-index:2;font-size:8px;line-height:1.4;padding:0 5px;border-radius:999px;
  background:rgba(232,182,76,.2);color:#e8c072;letter-spacing:.5px;white-space:nowrap}
.ov-pmiss[hidden]{display:none}
.ov-pfoot{position:absolute;left:50%;bottom:1px;width:84px;height:14px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%,rgba(150,228,255,.55),rgba(95,208,255,.16) 55%,transparent 78%);
  filter:blur(3px);pointer-events:none}
.ov-pring{position:absolute;left:50%;border-radius:50%;border:1px solid rgba(130,218,255,.55);pointer-events:none;
  box-shadow:0 0 10px rgba(95,208,255,.35),inset 0 0 10px rgba(95,208,255,.25);
  animation:pring 3.4s ease-in-out infinite}
.ov-pring.r1{width:72px;height:16px;bottom:18px}
.ov-pring.r2{width:56px;height:12px;bottom:25px;animation-delay:1s;opacity:.6}
@keyframes pring{0%,100%{transform:translateX(-50%) scaleX(.92);opacity:.35}50%{transform:translateX(-50%) scaleX(1.06);opacity:.95}}
.ov-pmeta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;min-width:0}
.ov-pmeta .no{font:600 8.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.8px;color:#7e93a9}
.ov-pmeta strong{flex:1 1 auto;min-width:0;font-size:15px;letter-spacing:1.4px;color:#f2f8ff;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-ptag{font-size:9px;line-height:1.5;padding:1px 6px;border-radius:999px;background:rgba(95,208,255,.14);color:#9fdcff;white-space:nowrap}
.ov-ptag.warn{background:rgba(232,182,76,.16);color:#e8c072}
.ov-preads{width:100%;display:flex;flex-direction:column;gap:3px;margin-top:3px;padding-top:6px;border-top:1px solid rgba(95,208,255,.14)}
.ov-preads div{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:9.5px;letter-spacing:.5px;color:#75899f}
.ov-preads b{font:600 10px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;color:#cfe4f6;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64%}

/* ---------- 灯箱 ---------- */
#lb{position:fixed;inset:0;z-index:90;display:none;background-color:rgba(6,8,10,0);touch-action:none}
#lb.on{display:block}
#lb .lb-frame{position:fixed;left:0;top:0;width:100px;height:100px;transform-origin:0 0;border-radius:8px;
  overflow:hidden;background:#0b0f14;box-shadow:0 24px 70px rgba(0,0,0,.55);will-change:transform,opacity}
#lb .lb-frame img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
#lb .x{position:fixed;right:16px;top:12px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;

  border-radius:2px;border-color:var(--line3);
  background:radial-gradient(130% 90% at 50% -18%,var(--ov-1) 0%,var(--ov-2) 55%,var(--ov-3) 100%);
  box-shadow:0 0 0 1px rgba(var(--hud-rgb),.04)}
.ov::before{opacity:.5;
  background:repeating-linear-gradient(90deg,rgba(var(--hud-rgb),.045) 0 1px,transparent 1px 80px),
    repeating-linear-gradient(0deg,rgba(var(--hud-rgb),.035) 0 1px,transparent 1px 40px)}
.ov::after{content:"";position:absolute;inset:0;z-index:9;pointer-events:none;opacity:.055;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='120'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='120' height='120' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}
.ov-brk{position:absolute;z-index:8;width:16px;height:16px;pointer-events:none;border:0 solid var(--hud);opacity:.75}
.ov-brk.tl{left:7px;top:7px;border-left-width:1px;border-top-width:1px}
.ov-brk.tr{right:7px;top:7px;border-right-width:1px;border-top-width:1px}

.ov-bar{padding:13px 20px;border-bottom:1px solid var(--hud-line);background:rgba(var(--bg2-rgb),.6)}
