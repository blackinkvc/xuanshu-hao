<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>玄枢号 · 工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111a24'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%235fd0ff' stroke-width='2'/%3E%3Cpath d='M16 6.5v19M6.5 16h19' stroke='%235fd0ff' stroke-width='1.4'/%3E%3C/svg%3E">
<meta name="description" content="玄枢号项目工作台：舰员档案总览、人物详情与姿势缺位、完成度看板、弃用图区。">
<style>
:root{
  --bg:#f7f8fa; --panel:#fff; --line:#e3e6eb; --line2:#eef1f6;
  --text:#1f2329; --muted:#6b7280; --faint:#9aa1ab;
  --green:#0a7d3c; --amber:#8a6d1a; --red:#c62828; --blue:#1a5fb4;
  --accent:#1a5fb4; --accent-soft:#eaf1fb;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font:14px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;
  background:var(--bg); color:var(--text);
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
img{display:block;max-width:100%}

/* ---------- 顶栏 ---------- */
header.top{
  position:sticky; top:0; z-index:40; background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(8px);
  border-bottom:1px solid var(--line);
}
.top-in{
  max-width:1240px; margin:0 auto; padding:10px 20px;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-size:17px;letter-spacing:.5px;white-space:nowrap}
.brand span{font-size:11px;color:var(--faint);letter-spacing:1.2px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{
  padding:6px 13px;border-radius:999px;color:var(--muted);font-size:13px;white-space:nowrap;
}
nav.tabs a:hover{background:var(--line2);text-decoration:none;color:var(--text)}
nav.tabs a.on{background:var(--text);color:#fff}

/* ---------- 顶栏工具（世界年份 / 音效 / 设置 / 返回） ---------- */
.tools{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12px;height:28px;padding:0 10px;
  border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tool:hover{border-color:#c9cfd8;color:var(--text)}
.tool.icon{width:30px;padding:0;justify-content:center}
.tool svg{width:14px;height:14px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool b{font:700 12.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.6px;color:var(--text);font-variant-numeric:tabular-nums}
.tool .k{font-size:9.5px;letter-spacing:1.2px;color:var(--faint)}
.tool .u{font-size:10.5px;color:var(--faint)}
.tool.off{color:#aab1ba}
.tool.off b{color:#9aa1ab}
.tool.off svg{opacity:.45}
.tool .mute{display:none}
.tool.off .mute{display:block}
.tool.off .w1,.tool.off .w2{display:none}
.tool[hidden]{display:none}
.tool:disabled{opacity:.4;cursor:not-allowed}
body.no-motion *,body.no-motion *::before,body.no-motion *::after{animation:none!important;transition:none!important}
.pop{position:absolute;right:20px;top:calc(100% + 8px);z-index:60;width:min(92vw,318px);
  background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 46px rgba(20,26,36,.18);
  padding:14px 15px;display:none;color:var(--text)}
.pop.on{display:block}
.pop h4{margin:0 0 4px;font-size:13.5px}
.pop .ps{font-size:11.5px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.pop .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line2);font-size:12.5px}
.pop .row span{color:var(--muted)}
.pop .row b{font-variant-numeric:tabular-nums}
.pop .sw{width:38px;height:21px;border-radius:999px;border:1px solid var(--line);background:var(--line2);position:relative;cursor:pointer;flex:0 0 auto}
.pop .sw i{position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:.16s}
.pop .sw.on{background:#0a7d3c;border-color:#0a7d3c}
.pop .sw.on i{left:19px}
.pop .pbtn{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 10px;cursor:pointer;color:var(--muted)}
.pop .pbtn:hover{border-color:#c9cfd8;color:var(--text)}
.pop .pbtn.danger{color:#b3261e;border-color:#efcfcb}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,8px);z-index:95;background:#1f2329;color:#fff;
  font-size:12.5px;padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.dark .tool{background:#0d151d;border-color:#1b2734;color:#8a9bb0}
body.dark .tool b{color:#eaf3ff}
body.dark .pop{background:#0c141d;border-color:#1e2c3b;box-shadow:0 18px 46px rgba(0,0,0,.55)}
body.dark .pop .row{border-top-color:#17242f}
body.dark .pop .sw{background:#16222d;border-color:#22303f}
body.dark .pop .sw.on{background:#1f7a4a;border-color:#1f7a4a}
body.dark .pop .pbtn{background:#101a24;border-color:#22303f;color:#9fb2c6}


main{max-width:1240px;margin:0 auto;padding:22px 20px 64px}

/* ---------- 通用块 ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .n{font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .sub{font-size:11px;color:var(--faint);margin-top:6px}
h2.sec{font-size:15px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec .hint{font-size:12px;color:var(--faint);font-weight:400}
.btn{font:inherit;font-size:12px;padding:3px 11px;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--muted);cursor:pointer}
.btn:hover{border-color:#c9cfd8;color:var(--text)}
h2.sec .btn{margin-left:auto;font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.muted{color:var(--muted)}
.tiny{font-size:11.5px;color:var(--faint)}
.bar{background:var(--line);height:8px;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:5px}
.bar.amber i{background:#c99a1a}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--line2);color:var(--muted);white-space:nowrap}
.pill.warn{background:#fdf3e3;color:var(--amber)}
.pill.ok{background:#e8f5ec;color:var(--green)}
.pill.blue{background:var(--accent-soft);color:var(--blue)}

/* ---------- 总览 ---------- */
.crew-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.crew-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;color:inherit;
  transition:box-shadow .15s ease,transform .15s ease,border-color .15s ease;
}
.crew-card:hover{text-decoration:none;box-shadow:0 6px 20px rgba(31,35,41,.08);transform:translateY(-1px);border-color:#d3d8e0}
.crew-card .shot{position:relative;aspect-ratio:9/16;background:#edeff2;overflow:hidden}
.crew-card .shot img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.crew-card .shot .tag{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.9);border-radius:6px;font-size:11px;padding:2px 6px;color:var(--muted)}
.crew-card .shot .miss{position:absolute;right:8px;top:8px;background:#fdf3e3;color:var(--amber);border-radius:6px;font-size:11px;padding:2px 6px;font-weight:600}
.crew-card .body{padding:11px 12px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
.crew-card .nm{display:flex;align-items:baseline;gap:7px}
.crew-card .nm b{font-size:15px}
.crew-card .nm em{font-style:normal;font-size:11px;color:var(--faint);letter-spacing:.6px}
.crew-card .role{font-size:11.5px;color:var(--muted);line-height:1.45;min-height:32px}
.crew-card .stat{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- 人物详情 ---------- */
.crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chips a{font-size:12.5px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:#fff;white-space:nowrap}
.chips a.on{color:#fff;background:var(--text);border-color:var(--text)}
.chips a:hover{text-decoration:none;border-color:#c9cfd8;color:var(--text)}
.chips a.on:hover{color:#fff}

/* ---------- 素材库 ---------- */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px}
.lib-card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  transition:border-color .15s ease,box-shadow .15s ease}
.lib-card:hover{border-color:#cdd4de;box-shadow:0 6px 18px rgba(31,35,41,.07)}
.lib-card .im{display:block;background:#0b0f14;overflow:hidden}
.lib-card .im img{width:100%;height:100%;object-fit:cover}
.lib-card .im.out,.lib-card .im.pos{aspect-ratio:3/4}
.lib-card .im.rm{aspect-ratio:16/9}
.lib-card .im.eq{aspect-ratio:1/1}
.lib-card .tx{display:flex;align-items:baseline;gap:7px;padding:8px 9px 0;min-width:0}
.lib-card .tx b{font:700 10.5px/1 Consolas,monospace;letter-spacing:.6px;color:var(--blue)}
.lib-card .tx a{font-size:12.5px;color:#2b3138;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-card .tx a:hover{text-decoration:none;color:var(--blue)}
.lib-card .mt{font-size:10.5px;color:var(--faint);padding:4px 9px 9px}
.lib-card .mt a{color:var(--muted)}
.lib-empty{padding:26px 0;color:var(--muted);font-size:13px}
.lib-owner{margin:-6px 0 14px;font-size:12px;color:var(--muted)}
.lib-owner b{color:var(--text)}

/* ---------- 舰员选择 ---------- */
.pick-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pick-head h1{font-size:20px;margin:0;letter-spacing:.5px}
.pick-head .sub{font-size:12px;color:var(--muted)}
.pick-head .btn{margin-left:auto;text-decoration:none}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px}
.pick-card{display:flex;gap:12px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  color:inherit;transition:box-shadow .15s ease,transform .15s ease,border-color .15s ease}
.pick-card:hover{text-decoration:none;box-shadow:0 6px 20px rgba(31,35,41,.08);transform:translateY(-1px);border-color:#d3d8e0}
.pick-card .im{flex:0 0 74px;width:74px;aspect-ratio:9/16;border-radius:6px;overflow:hidden;background:#edeff2}
.pick-card .im img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.pick-card .bd{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1;justify-content:center}
.pick-card .nm{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.pick-card .nm b{font-size:15.5px}
.pick-card .nm em{font-style:normal;font-size:10.5px;letter-spacing:.7px;color:var(--faint);font-variant-numeric:tabular-nums}
.pick-card .nm .last{font-style:normal;font-size:10px;color:var(--blue);background:var(--accent-soft);border-radius:4px;padding:0 5px;white-space:nowrap}
.pick-card .rl{font-size:11.5px;color:var(--muted);line-height:1.45;min-height:0}
.pick-card .pg{display:flex;align-items:center;gap:8px}
.pick-card .pb{flex:1 1 auto;height:5px;border-radius:4px;background:var(--line);overflow:hidden}
.pick-card .pb i{display:block;height:100%;border-radius:4px;background:var(--green)}
.pick-card .pv{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pick-card .ms{font-size:10.5px;color:var(--faint)}
.pick-card .ms.warn{color:var(--amber)}
.pick-card.last-on{border-color:#bcd3ee;box-shadow:0 0 0 1px rgba(26,95,180,.12)}

.hero{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;align-items:start}
.hero .photo{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.hero .photo img{width:100%;aspect-ratio:9/16;object-fit:cover;cursor:zoom-in;background:#edeff2}
.hero .photo .cap{padding:8px 11px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--line2)}
.hero .info h1{font-size:26px;margin:0 0 2px;letter-spacing:.5px}
.hero .info .meta{font-size:12px;color:var(--faint);letter-spacing:1px;margin-bottom:10px;text-transform:uppercase}
.hero .info .tagline{
  font-size:14px;color:#333a44;background:var(--panel);border-left:3px solid var(--accent);
  padding:9px 13px;border-radius:0 8px 8px 0;margin:0 0 14px;
}
.hero .info .role{font-size:13px;color:var(--muted);margin-bottom:12px}
.hero .mods{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.hero .mods span{font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:#3d4450}
dl.profile{display:grid;grid-template-columns:86px minmax(0,1fr);gap:0;margin:0;border-top:1px solid var(--line2)}
dl.profile dt{padding:7px 0;font-size:12px;color:var(--faint);border-bottom:1px solid var(--line2)}
dl.profile dd{padding:7px 0;margin:0;font-size:12.5px;line-height:1.6;border-bottom:1px solid var(--line2);word-break:break-word}
details.more{margin-top:10px}
details.more summary{cursor:pointer;font-size:12px;color:var(--blue);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ "}
details.more[open] summary::before{content:"▾ "}

.gapbox{background:#fffdf7;border:1px solid #f0e2c4;border-radius:var(--radius);padding:12px 14px;margin:18px 0 4px}
.gapbox b{color:var(--amber)}
.gapbox ul{margin:8px 0 0;padding-left:18px}
.gapbox li{font-size:12.5px;margin:3px 0;color:#54462a}
.gapbox .cnt{font-size:12px;color:var(--muted)}

.series{margin-top:26px}
.series-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.series-h b{font-size:15px}
.series-h .sid{font-size:11px;letter-spacing:1px;color:var(--faint);font-variant-numeric:tabular-nums}
.series-h .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.series-note{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-left:3px solid #d9dee6;border-radius:0 6px 6px 0;padding:7px 11px;margin:6px 0 12px;line-height:1.65}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px}
.shot-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.shot-card .im{aspect-ratio:9/16;background:#edeff2;overflow:hidden}
.shot-card .im img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;transition:transform .25s ease}
.shot-card:hover .im img{transform:scale(1.03)}
.shot-card .t{padding:6px 8px 7px;font-size:11px;line-height:1.35;color:#3d4450}
.shot-card .t em{display:block;font-style:normal;color:var(--faint);font-size:10.5px;margin-top:2px}
.shot-card .tags{display:flex;flex-wrap:wrap;gap:3px;padding:0 8px 8px}
.shot-card .tags i{font-style:normal;font-size:10px;color:#7a828d;background:var(--line2);border-radius:4px;padding:1px 5px}

/* 缺图占位：用该人物主图顶替 + 编号与「待补」角标，不留空框 */
.shot-card.ph{border-style:dashed;border-color:#d9c9a4}
.shot-card.ph .im{position:relative}
.shot-card.ph .im img{filter:saturate(.5) brightness(.94) contrast(.96)}
.shot-card.ph .im::after{content:"";position:absolute;inset:0;background:rgba(37,32,20,.16)}
.ph-tag{
  position:absolute;left:6px;top:6px;z-index:2;display:flex;align-items:center;gap:4px;
  font:700 10px/1 Consolas,monospace;letter-spacing:.4px;color:#3b2f12;
  background:rgba(255,247,224,.94);border:1px solid #e0c893;border-radius:4px;padding:3px 5px;
}
.ph-tag em{font-style:normal;color:#a8842f;font-weight:400;letter-spacing:0}
.shot-card.ph .t em{color:#a8842f}

/* ---------- 看板 ---------- */
.board-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px}
.panel h3{margin:0 0 3px;font-size:14px}
.panel .sub{font-size:11.5px;color:var(--faint);margin-bottom:12px}
.prow{display:grid;grid-template-columns:76px minmax(0,1fr) 74px;gap:10px;align-items:center;margin:9px 0;font-size:12.5px}
.prow .nm b{font-weight:600}
.prow .nm{display:flex;align-items:baseline;gap:5px}
.prow .nm span{font-size:10.5px;color:var(--faint)}
.prow .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px}
.heat{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.hrow{display:grid;grid-template-columns:70px minmax(0,1fr);gap:9px;align-items:center}
.hrow .nm{font-size:12px;white-space:nowrap}
.hcells{display:flex;gap:3px;flex-wrap:wrap}
.hcell{width:26px;height:22px;border-radius:4px;font-size:9.5px;display:flex;align-items:center;justify-content:center;color:#fff;font-variant-numeric:tabular-nums;cursor:default}
.hcell.p0{background:#eceff3;color:#9aa1ab}
.hcell.part{background:#e3b23c}
.hcell.full{background:#2f9e63}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}

table.q{width:100%;border-collapse:collapse;font-size:12px}
table.q th,table.q td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.q th{background:var(--line2);position:sticky;top:0;font-weight:600}
table.q tr:nth-child(even) td{background:#fbfcfd}
.done{color:var(--green);font-weight:600}
.failed{color:var(--red);font-weight:600}
.pending{color:var(--amber)}
.running{color:var(--blue);font-weight:600}
.scrollbox{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.scrollbox table.q th{position:sticky;top:0;z-index:1}
.scrollbox table.q{min-width:520px}
.qgroups{display:flex;flex-direction:column;gap:10px}
.qg{font-size:12px}
.qg .top{display:flex;justify-content:space-between;margin-bottom:4px;color:var(--muted)}
.qg .top b{color:var(--text);font-weight:600}

/* ---------- 垃圾站 ---------- */
.quotes{width:100%;border-collapse:collapse;font-size:12.5px}
.quotes td{border-bottom:1px solid var(--line2);padding:6px 8px;vertical-align:top}
.quotes td:first-child{color:var(--muted);width:44%}
.tgroup{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin-bottom:10px;overflow:hidden}
.tgroup summary{cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;list-style:none;font-size:13.5px}
.tgroup summary::-webkit-details-marker{display:none}
.tgroup summary .arrow{color:var(--faint);font-size:11px;transition:transform .15s}
.tgroup[open] summary .arrow{transform:rotate(90deg)}
.tgroup summary b{font-weight:600}

<body>
<header class="top" id="top">
  <div class="top-in">
  <div class="brand"><b>玄枢号 · 工作台</b><span>XUANSHU / CREW WORKBENCH</span></div>
  <div class="tools">
    <button class="tool" id="worldBtn" type="button" title="玄枢历 · 世界时间流" aria-haspopup="dialog" aria-expanded="false">
      <span class="k">玄枢历</span><b id="worldYear">41000</b><span class="u">年</span>
    </button>
    <button class="tool icon" id="sndBtn" type="button" aria-label="音效开关" aria-pressed="true" title="音效开关">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9h3l4-3v12l-4-3H4z"/>
        <path class="w1" d="M15.5 8.6a4.8 4.8 0 0 1 0 6.8"/>
        <path class="w2" d="M18 6.2a8.2 8.2 0 0 1 0 11.6"/>
        <path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/>
      </svg>
    </button>
    <button class="tool icon" id="setBtn" type="button" aria-label="设置" aria-haspopup="dialog" aria-expanded="false" title="设置">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M12 3v2.3M12 18.7V21M3 12h2.3M18.7 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7"/>
      </svg>
    </button>
    <button class="tool icon" id="backBtn" type="button" aria-label="返回上一页" title="返回" hidden>←</button>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#/" data-r="overview">总览</a>
    <a href="#/crew" data-r="crew">舰员详情</a>
    <a href="#/board" data-r="board">完成度看板</a>
    <a href="#/lib" data-r="lib">素材库</a>
    <a href="#/trash" data-r="trash">垃圾站</a>
  </nav>
  </div>

  <div class="pop" id="popWorld" role="dialog" aria-label="玄枢历">
    <h4>玄枢历 · 世界时间</h4>
    <div class="ps">时间流与现实同步：1 现实分钟 = 1 世界年，起始 41000 年。关闭页面后仍在走。</div>
    <div class="row"><span>当前年份</span><b id="pwYear">41000 年</b></div>
    <div class="row"><span>本次已运行</span><b id="pwRun">0 分 0 秒</b></div>
    <div class="row"><span>时间流</span><button class="pbtn" id="pwPause" type="button">暂停</button></div>
  </div>

  <div class="pop" id="popSet" role="dialog" aria-label="设置">
    <h4>工作台设置</h4>
    <div class="ps">设置只存在这台设备的本地存储里。</div>
    <div class="row"><span>音效</span><button class="sw" id="swSnd" type="button" role="switch" aria-checked="true" aria-label="音效"><i></i></button></div>
    <div class="row"><span>界面动效</span><button class="sw" id="swMotion" type="button" role="switch" aria-checked="true" aria-label="界面动效"><i></i></button></div>
    <div class="row"><span>时间流</span><button class="sw" id="swTime" type="button" role="switch" aria-checked="true" aria-label="时间流"><i></i></button></div>
    <div class="row"><span>本地记忆（上次查看 / 时间种子）</span><button class="pbtn danger" id="btnReset" type="button">清除</button></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</header>

<main id="app"></main>
<footer id="foot"></footer>

<div id="lb"><span class="x">×</span><img alt=""><div class="cap"></div></div>

<script src="data.js"></script>
<script>
(function(){
  var D = window.XS_DATA;
  var app = document.getElementById('app');
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var pct = function(a,b){ return b ? Math.round(a/b*1000)/10 : 0; };
  /* 统一缺图占位：任何图加载失败都不留空框 */
  var PH = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640">'
    + '<rect width="360" height="640" fill="#edeff2"/>'
    + '<rect x="18" y="18" width="324" height="604" fill="none" stroke="#d6c294" stroke-dasharray="8 6"/>'
    + '<text x="180" y="308" text-anchor="middle" font-size="30" fill="#a8842f" font-family="sans-serif">待补</text>'
    + '<text x="180" y="344" text-anchor="middle" font-size="13" fill="#9aa1ab" font-family="sans-serif">IMAGE PENDING</text>'
    + '</svg>');
  document.addEventListener('error', function(e){
    var img = e.target;
    if(!img || img.tagName !== 'IMG') return;
    if(img.dataset.ph === '2') return;
    var fb = img.getAttribute('data-fb');
    if(img.dataset.ph !== '1' && fb){ img.dataset.ph = '1'; img.src = fb; }
    else { img.dataset.ph = '2'; img.src = PH; }
  }, true);

  /* ---------- 音效：WebAudio 合成，无外链音频 ---------- */
  var SND = (function(){
    var KEY = 'xs_sound_v1';
    var on = true;
    try{ on = localStorage.getItem(KEY) !== '0'; }catch(e){}
    var ctx = null, armed = false;
    var AC = window.AudioContext || window.webkitAudioContext;
    function ready(){
      if(!on || !armed || !AC) return null;
      if(!ctx){
        try{ ctx = new AC(); }catch(e){ return null; }
      }
      if(ctx.state === 'suspended' && ctx.resume) ctx.resume();
      return ctx;
    }
    function ping(f, dur, type, vol, to){
      var a = ready(); if(!a) return;
      var o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      if(to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + dur + 0.03);
    }
    return {
      isOn: function(){ return on; },
      supported: !!AC,
      arm: function(){ armed = true; },
      set: function(v){
        on = !!v;
        try{ localStorage.setItem(KEY, on ? '1' : '0'); }catch(e){}
        if(!on && ctx && ctx.suspend) ctx.suspend();
        if(on && ctx && ctx.state === 'suspended' && ctx.resume) ctx.resume();
      },
      click: function(){ ping(1180, 0.035, 'triangle', 0.05); },
      swap: function(){ ping(520, 0.05, 'sine', 0.05, 660); setTimeout(function(){ ping(880, 0.06, 'sine', 0.042); }, 45); },
      page: function(){ ping(760, 0.06, 'triangle', 0.04, 600); },
      err: function(){ ping(190, 0.16, 'sawtooth', 0.045, 140); }
    };
  })();

  /* ---------- 玄枢历：1 现实分钟 = 1 世界年 ---------- */
  var WORLD = (function(){
    var KEY = 'xs_world_v1', START = 41000, YPM = 1 / 60000;
    var st = {y: START, ts: Date.now(), paused: false};
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var o = JSON.parse(raw);
        if(o && typeof o.y === 'number' && isFinite(o.y)){ st.y = Math.max(START, o.y); st.paused = !!o.paused; }
      }
    }catch(e){}
    var saveT = 0;
    function save(){
      try{ localStorage.setItem(KEY, JSON.stringify({y: st.y, paused: st.paused})); }catch(e){}
    }
    function tick(){
      var now = Date.now();
      if(!st.paused){ st.y += Math.max(0, now - st.ts) * YPM; saveT += now - st.ts; if(saveT > 5000){ saveT = 0; save(); } }
      st.ts = now;
    }
    return {
      now: function(){ tick(); return st.y; },
      paused: function(){ return st.paused; },
      pause: function(v){ tick(); st.paused = !!v; st.ts = Date.now(); save(); },
      reset: function(){ st.y = START; st.paused = false; st.ts = Date.now(); save(); },
      save: save,
      START: START
    };
  })();

  var toastT = 0;
  function toast(msg){
    var t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function(){ t.classList.remove('on'); }, 1900);
  }
  function fmtNum(n){
    return String(Math.max(0, Math.floor(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function paintWorld(){
    var y = WORLD.now();
    var el = document.getElementById('worldYear');
    if(el) el.textContent = fmtNum(y);
    var pw = document.getElementById('pwYear');
    if(pw) pw.textContent = fmtNum(y) + ' 年';
    var pr = document.getElementById('pwRun');
    if(pr){
      var s = Math.max(0, Math.floor((y - WORLD.START) * 60));
      pr.textContent = Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒';
    }
    var pauseBtn = document.getElementById('pwPause');
    if(pauseBtn) pauseBtn.textContent = WORLD.paused() ? '继续' : '暂停';
    var sw = document.getElementById('swTime');
    if(sw){
      sw.classList.toggle('on', !WORLD.paused());
      sw.setAttribute('aria-checked', WORLD.paused() ? 'false' : 'true');
    }
  }
  function paintSnd(){
    var b = document.getElementById('sndBtn');
    if(!b) return;
    b.classList.toggle('off', !SND.isOn());
    b.setAttribute('aria-pressed', SND.isOn() ? 'true' : 'false');
    b.disabled = !SND.supported;
    b.title = !SND.supported ? '当前浏览器不支持音效' : (SND.isOn() ? '音效：开（点击关闭）' : '音效：关（点击开启）');
    var sw = document.getElementById('swSnd');
    if(sw){
      sw.classList.toggle('on', SND.isOn());
      sw.setAttribute('aria-checked', SND.isOn() ? 'true' : 'false');
    }
  }
  function toggleSnd(v){
    if(!SND.supported) return;
    SND.arm();
    SND.set(v == null ? !SND.isOn() : v);
    paintSnd();
  }
  var MOTION_KEY = 'xs_motion_v1';
  function motionOn(){
    try{ return localStorage.getItem(MOTION_KEY) !== '0'; }catch(e){ return true; }
  }
  function setMotion(v){
    try{ localStorage.setItem(MOTION_KEY, v ? '1' : '0'); }catch(e){}
    document.body.classList.toggle('no-motion', !v);
    var sw = document.getElementById('swMotion');
    if(sw){ sw.classList.toggle('on', v); sw.setAttribute('aria-checked', v ? 'true' : 'false'); }
  }

  var POP = null;
  function closePop(){
    var ps = document.querySelectorAll('.pop');
    for(var i = 0; i < ps.length; i++) ps[i].classList.remove('on');
    var a = document.getElementById('worldBtn'), b = document.getElementById('setBtn');
    if(a) a.setAttribute('aria-expanded', 'false');
    if(b) b.setAttribute('aria-expanded', 'false');
    POP = null;
  }
  function openPop(id, btn){
    if(POP === id){ closePop(); return; }
    closePop();
    var p = document.getElementById(id);
    if(!p) return;
    p.classList.add('on');
    if(btn) btn.setAttribute('aria-expanded', 'true');
    POP = id;
  }

  var crewById = {};
  D.crews.forEach(function(c){ crewById[c.id] = c; });

  /* ---------- 灯箱 ---------- */
  var lb = document.getElementById('lb');
  var lbImg = lb.querySelector('img'), lbCap = lb.querySelector('.cap');
  document.addEventListener('click', function(e){
    var img = e.target.closest('img[data-full]');
    if(img){
      lbImg.src = img.getAttribute('data-full');
      lbCap.textContent = img.getAttribute('data-cap') || '';
      lb.classList.add('on');
      return;
    }
    if(e.target.closest('#lb')) lb.classList.remove('on');
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){ lb.classList.remove('on'); closePop(); }
    SND.arm();
    if(!document.getElementById('ov')) return;
    if(e.key==='ArrowLeft'){ e.preventDefault(); ovStep(-1); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); ovStep(1); }
  });

  /* ---------- 总览 · 舰桥 ---------- */
  var ATTRS = ['魅力', '统御', '战斗', '智力', '体质', '意志', '技术', '幸运'];
  var ADESC = {
    '魅力': '舰内评级的直观项：站定三秒，舱内说话声会自己降一档。',
    '统御': '看的是下指令后的队列迟滞；没人复述，才算这条指令真的有效。',
    '战斗': '以近接三招内的收势判断——不看得手，看能不能收住。',
    '智力': '战术数据板的推演速度：同一组参数，能比别人少试两次。',
    '体质': '长时值勤后维持姿态的时长，与维生剂消耗成反比。',
    '意志': '疼痛与失压条件下的指令完成度。不看忍，看是否照做。',
    '技术': '对舰内管路的熟悉程度：闭眼能指出哪一段该响。',
    '幸运': '不列入考核。只在事故记录里，总差半格没写到名字。'
  };
  var OV_AXIS = 0;
  var OV_IDX = 0;

  function ovLeft(c){
    var p = pct(c.done, c.planned);
    var eye = c.accent || '#5fd0ff';
    var det = '#/crew/' + esc(c.id);
    return '<div class="ov-k">CREW FILE</div>'
      + '<div class="ov-nameblk"><b>' + esc(c.name) + '</b><em>' + esc(c.id) + (c.en ? ' · ' + esc(c.en) : '') + '</em></div>'
      + '<div class="ov-field"><div class="ov-lab">义眼微光 / OPTIC</div>'
      +   '<div class="ov-eye-row"><i style="background:' + esc(eye) + ';box-shadow:0 0 10px ' + esc(eye) + ',0 0 22px ' + esc(eye) + '"></i><b>' + esc(eye.toUpperCase()) + '</b></div></div>'
      + '<div class="ov-field"><div class="ov-lab">机体型号 / MODEL</div><div class="ov-val">' + esc(c.code || '待定') + '</div></div>'
      + '<div class="ov-field"><div class="ov-lab">战术代号 / CALLSIGN</div><div class="ov-val">' + esc(c.en || '—') + '</div></div>'
      + '<div class="ov-field"><div class="ov-lab">战备状态 / STATUS</div><div class="ov-val"><span class="ov-led' + (p < 100 ? ' warn' : '') + '"></span>' + esc(c.status || '在档') + '</div></div>'
      + '<div class="ov-field"><div class="ov-lab">系列 / SERIES</div><div class="ov-val"><a class="ov-link" href="' + det + '">' + (c.series || []).length + ' 组</a></div></div>'
      + '<div class="ov-field"><div class="ov-lab">立绘 / FRAMES</div><div class="ov-val"><a class="ov-link" href="' + det + '">' + (c.done || 0) + ' 张已入档</a></div></div>'
      + '<div class="ov-field ov-wide"><div class="ov-lab">姿势完整度</div>'
      +   '<div class="ov-meter"><i style="width:' + p + '%"></i></div>'
      +   '<div class="ov-num"><a class="ov-link" href="#/board" style="color:inherit">' + c.done + ' / ' + c.planned + ' · ' + p + '%' + (c.missing ? ' · 缺 ' + c.missing : '') + '</a></div></div>';
  }

  function ovRadar(c){
    var a = c.attrs || {};
    var vals = ATTRS.map(function(k){
      var v = Number(a[k]);
      return [k, isNaN(v) ? 0 : Math.max(0, Math.min(100, v))];
    });
    var cx = 120, cy = 112, R = 68, n = vals.length, i;
    function pt(k, r){
      var ang = -Math.PI / 2 + k * 2 * Math.PI / n;
      return [cx + r * Math.cos(ang), cy + r * Math.sin(ang), ang];
    }
    var s = '<svg class="ov-radar" viewBox="0 0 240 226" role="img" aria-label="人物属性雷达">';
    [0.25, 0.5, 0.75, 1].forEach(function(f){
      var p = [];
      for(var k = 0; k < n; k++){ var q = pt(k, R * f); p.push(q[0].toFixed(1) + ',' + q[1].toFixed(1)); }
      s += '<polygon class="rg" points="' + p.join(' ') + '"/>';
    });
    for(i = 0; i < n; i++){
      var e = pt(i, R);
      s += '<line class="ra" x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '"/>';
    }
    var poly = [];
    for(i = 0; i < n; i++){
      var dv = pt(i, R * Math.max(vals[i][1] / 100, 0.04));
      poly.push(dv[0].toFixed(1) + ',' + dv[1].toFixed(1));
    }
    s += '<polygon class="rv" points="' + poly.join(' ') + '"/>';
    for(i = 0; i < n; i++){
      var d = pt(i, R * Math.max(vals[i][1] / 100, 0.04));
      s += '<circle class="rd" cx="' + d[0].toFixed(1) + '" cy="' + d[1].toFixed(1) + '" r="1.9"/>';
    }
    for(i = 0; i < n; i++){
      var lp = pt(i, R + 17), cos = Math.cos(lp[2]);
      var anchor = cos > 0.28 ? 'start' : (cos < -0.28 ? 'end' : 'middle');
      s += '<g class="ax" data-i="' + i + '" role="button" tabindex="0" aria-label="' + esc(vals[i][0]) + '">'
        + '<circle class="rh" cx="' + lp[0].toFixed(1) + '" cy="' + lp[1].toFixed(1) + '" r="12"/>'
        + '<text class="rt" x="' + lp[0].toFixed(1) + '" y="' + lp[1].toFixed(1) + '" text-anchor="' + anchor + '" dominant-baseline="middle">' + esc(vals[i][0]) + '</text>'
        + '</g>';
    }
    s += '</svg><div class="ov-atip" id="ovAtip"></div>';
    return s;
  }

  function ovTip(i){
    i = Number(i) || 0;
    OV_AXIS = i;
    var c = D.crews[OV_IDX];
    if(!c) return;
    var k = ATTRS[i], v = (c.attrs || {})[k];
    var t = document.getElementById('ovAtip');
    if(t) t.innerHTML = '<b>' + esc(k) + '<i>' + esc(v == null ? '—' : v) + '</i></b>' + esc(ADESC[k] || '');
    var axs = document.querySelectorAll('.ov-radar .ax');
    for(var j = 0; j < axs.length; j++) axs[j].classList.toggle('on', Number(axs[j].getAttribute('data-i')) === i);
  }

  function ovRight(c){
    var mods = c.mods || [];
    var h = '<div class="ov-rbox"><div class="ov-k">人物属性 / ATTRIBUTES</div>' + ovRadar(c) + '</div>';
    h += '<div class="ov-rbox"><div class="ov-k">装备栏 / LOADOUT</div><div class="ov-gear">';
    if(mods.length){
      mods.forEach(function(m, i){
        h += '<div class="ov-grow"><b>' + (i < 9 ? '0' : '') + (i + 1) + '</b><span>' + esc(m) + '</span></div>';
      });
    } else {
      h += '<div class="ov-grow empty"><span>未登记改装</span></div>';
    }
    h += '</div><a class="ov-glink" href="#/lib?cat=eq&amp;owner=' + esc(c.id) + '">素材库 · ' + esc(c.name) + ' 的装备条目 →</a></div>';
    return h;
  }

  function ovBar(m){
    function st(n, l){ return '<div class="ov-stat"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>'; }
    return '<div class="ov-bar"><span class="led"></span>'
      + '<div><div class="k">XUANSHU · BATTLE READY</div><h2>玄枢号 · 全员战备配置</h2></div>'
      + '<div class="flex"></div>'
      + '<div class="ov-stats">'
      +   st(m.crewCount, '在档舰员')
      +   st(m.artwork, '已入档立绘')
      +   st(m.missing, '待补姿势位')
      +   st(pct(m.artwork, m.planned) + '%', '整体完成度')
      + '</div></div>';
  }

  function ovDock(){
    var h = '<div class="ov-plate">'
      + '<div class="nm"><b id="ovName"></b><em id="ovNameEn"></em></div>'
      + '<div class="sub"><b id="ovType"></b><span id="ovSub"></span></div>'
      + '<a class="ov-goto" id="ovGo" href="#/crew/' + esc(D.crews[0].id) + '">查看档案 →</a>'
      + '</div>';
    h += '<div class="ov-dock"><div class="ov-dockrow">'
      + '<button class="ov-nav" id="ovPrev" type="button" aria-label="上一位">‹</button>'
      + '<div class="ov-strip" id="ovStrip">';
    D.crews.forEach(function(c, i){
      h += '<div class="ov-av" data-i="' + i + '" title="' + esc(c.name + ' ' + c.id) + '">'
        + (c.main ? '<img decoding="async" src="' + esc(c.main.thumb) + '" alt="' + esc(c.name) + '">' : '')
        + '<span class="no">' + esc(c.id.replace('CREW-', '')) + '</span></div>';
    });
    h += '</div><button class="ov-nav" id="ovNext" type="button" aria-label="下一位">›</button></div>'
      + '<div class="ov-tip">← → 切换 · 点立绘放大 · 点属性轴看释义</div></div>';
    return h;
  }

  /* 透明底立绘接入位：assets/p/crew-00X.png 全部到位后把 CUT.on 改成 true 即可整站切换 */
  var CUT = { on: false, base: 'assets/p/', ext: '.png', map: null };
  function figSrc(c){
    if(!c) return '';
    if(CUT.on){
      if(CUT.map && CUT.map[c.id]) return CUT.map[c.id];
      if(CUT.base) return CUT.base + String(c.id).toLowerCase() + CUT.ext;
    }
    return c.main ? c.main.src : '';
  }

  /* 立绘预热：进总览即把全部立绘拉进内存并解码，点选时直接命中缓存 */
  var OV_WARM = {};
  function ovWarm(){
    D.crews.forEach(function(c){
      var s = figSrc(c);
      if(!s || OV_WARM[s]) return;
      var im = new Image();
      im.decoding = 'async';
      im.src = s;
      OV_WARM[s] = im;
      if(im.decode) im.decode().catch(function(){});
    });
  }

  function ovApply(i, still){
    var c = D.crews[i];
    if(!c) return;
    OV_IDX = i;
    var ovEl = document.getElementById('ov');
    var fig = document.getElementById('ovFig');
    var img = document.getElementById('ovImg');
    var eye = c.accent || '#5fd0ff';
    ovEl.style.setProperty('--eye', eye);
    document.getElementById('ovLeft').innerHTML = ovLeft(c);
    document.getElementById('ovRight').innerHTML = ovRight(c);
    var nm = document.getElementById('ovName');
    if(nm) nm.textContent = c.name;
    var en = document.getElementById('ovNameEn');
    if(en) en.textContent = (c.en || '') + (c.en ? ' · ' + c.id : c.id);
    var ty = document.getElementById('ovType');
    if(ty) ty.textContent = c.code || c.id;
    var sub = document.getElementById('ovSub');
    if(sub) sub.textContent = c.id + ' · ' + (c.role || '在档');
    var go = document.getElementById('ovGo');
    if(go) go.setAttribute('href', '#/crew/' + c.id);
    var cn = document.getElementById('ovCN');
    if(cn) cn.textContent = c.name;
    var ce = document.getElementById('ovCE');
    if(ce) ce.textContent = (c.code || c.id) + ' · ' + c.id;
    var pv = document.getElementById('ovPrev'), nx = document.getElementById('ovNext');
    if(pv) pv.disabled = OV_IDX <= 0;
    if(nx) nx.disabled = OV_IDX >= D.crews.length - 1;
    ovTip(OV_AXIS);
    var avs = document.querySelectorAll('#ovStrip .ov-av');
    for(var k = 0; k < avs.length; k++) avs[k].classList.toggle('on', Number(avs[k].getAttribute('data-i')) === i);
    var strip = document.getElementById('ovStrip');
    var on = document.querySelector('#ovStrip .ov-av.on');
    if(strip && on){
      var target = on.offsetLeft - (strip.clientWidth - on.offsetWidth) / 2;
      target = Math.max(0, target);
      if(still) strip.scrollLeft = target;
      else if(strip.scrollTo) strip.scrollTo({left: target, behavior: 'smooth'});
      else strip.scrollLeft = target;
    }
    fig.classList.toggle('cut', CUT.on);
    var src = figSrc(c);
    if(img && src){
      if(img.getAttribute('src') !== src){
        var warm = OV_WARM[src];
        if(warm && warm.complete && warm.naturalWidth > 0){
          img.src = src;
        } else {
          /* 大图还在路上：先用底部头像条已缓存的缩略图顶上，避免出现"名字已变、图还是上一张" */
          if(c.main && c.main.thumb) img.src = c.main.thumb;
          else img.src = src;
          ovFill(img, src, i);
        }
        if(img.decode) img.decode().catch(function(){});
      }
      img.alt = c.name + ' 立绘';
      img.setAttribute('data-full', src);
      img.setAttribute('data-cap', c.id + ' ' + c.name + ' · ' + (c.main ? c.main.title : '立绘'));
    }
  }

  /* 大图就绪后替换占位图；期间若已切到别人则放弃 */
  function ovFill(img, full, idx){
    var im = OV_WARM[full];
    if(!im){
      im = new Image();
      im.decoding = 'async';
      im.src = full;
      OV_WARM[full] = im;
    }
    function done(){
      if(OV_IDX !== idx) return;
      if(img.getAttribute('src') !== full){
        img.src = full;
        if(img.decode) img.decode().catch(function(){});
      }
    }
    if(im.complete && im.naturalWidth > 0){ done(); return; }
    im.addEventListener('load', done);
  }

  function ovStep(d){
    if(!document.getElementById('ov')) return;
    var n = D.crews.length;
    if(!n) return;
    var next = OV_IDX + d;
    if(next < 0 || next >= n){ SND.err(); return; }
    ovApply(next, 0);
    SND.swap();
  }

      var av = e.target.closest('.ov-av');

  function kpi(n,l,sub){ return '<div class="kpi"><div class="n">' + n + '</div><div class="l">' + l + '</div><div class="sub">' + esc(sub) + '</div></div>'; }

  /* ---------- 素材库 ---------- */
  var LIB = null, LIB_BUSY = false, LIB_ERR = false;
  var LIB_CATS = [['all', '全部'], ['out', '服装'], ['pos', '姿势'], ['rm', '房间'], ['eq', '装备']];
  function libLoad(cb, force){
    if(LIB && !force) return cb();
    if(LIB_BUSY) return;
    LIB_BUSY = true;
    fetch('assets-index.json', {cache: 'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(j){ LIB = j.items || []; LIB_ERR = false; })
      .catch(function(e){ LIB = null; LIB_ERR = true; })
      .then(function(){ LIB_BUSY = false; cb(); });
  }
  function libOwner(it){
    if(it.category === 'eq'){
      var c = crewById[it.owner];
      return c ? '<a href="#/crew/' + it.owner + '">' + esc(c.name) + '</a>' : (it.owner === 'SHIP' ? '舰船固定' : '未指派');
    }
    return it.category === 'rm' ? '舰内固定区域' : '全员通用';
  }
  function viewLib(q){
    var p = {};
    (q || '').replace(/^\?/, '').split('&').forEach(function(kv){
      if(!kv) return;
      var a = kv.split('=');
      p[decodeURIComponent(a[0])] = decodeURIComponent(a[1] || '');
    });
    var cat = p.cat || 'all';
    var owner = p.owner || '';
    var oCrew = owner && crewById[owner];
    var h = '<div class="crumbs"><a href="#/">总览</a><span>/</span><span>素材库</span></div>';
    h += '<div class="pick-head"><h1>素材库</h1><span class="sub" id="libSub">索引加载中…</span></div><div class="chips">';
    LIB_CATS.forEach(function(t){
      h += '<a class="' + (cat === t[0] ? 'on' : '') + '" href="#/lib' + (t[0] === 'all' ? '' : '?cat=' + t[0]) + '">' + t[1] + '</a>';
    });
    h += '</div>';
    if(owner){
      h += '<div class="lib-owner">仅看 <b>' + esc(oCrew ? oCrew.name : owner) + '</b> 的装备 · '
        + '<a href="#/lib?cat=' + esc(cat === 'all' ? 'eq' : cat) + '">清除筛选</a></div>';
    }
    h += '<div id="libBody"><div class="lib-empty">正在读取 assets-index.json…</div></div>';
    app.innerHTML = h;
    libLoad(function(){
      var host = document.getElementById('libBody');
      if(!host) return;
      if(LIB_ERR || !LIB){
        host.innerHTML = '<div class="lib-empty">素材索引加载失败，可能是网络中断。 '
          + '<button class="btn" id="libRetry" type="button">重试</button></div>';
        var rb = document.getElementById('libRetry');
        if(rb) rb.addEventListener('click', function(){
          SND.err();
          host.innerHTML = '<div class="lib-empty">正在重新读取索引…</div>';
          libLoad(function(){ viewLib(q); }, true);
        });
        return;
      }
      var sub = document.getElementById('libSub');
      if(sub){
        var n = {out: 0, pos: 0, rm: 0, eq: 0};
        LIB.forEach(function(it){ if(n[it.category] !== undefined) n[it.category]++; });
        sub.textContent = LIB.length + ' 件在库 · 服装 ' + n.out + ' / 姿势 ' + n.pos + ' / 房间 ' + n.rm + ' / 装备 ' + n.eq;
      }
      var items = LIB.filter(function(it){
        return (cat === 'all' || it.category === cat) && (!owner || it.owner === owner);
      });
      if(!items.length){
        host.innerHTML = '<div class="lib-empty">' + (owner ? '该员暂无符合条件的装备条目。' : '该类目暂无条目。') + '</div>';
        return;
      }
      var g = '<div class="lib-grid">';
      items.forEach(function(it){
        var href = '#/lib?cat=' + it.category + '&id=' + it.id;
        g += '<div class="lib-card">'
          + '<a class="im ' + it.category + '" href="' + href + '"><img loading="lazy" decoding="async" src="' + esc(it.file)
          + '" alt="' + esc(it.id + ' ' + it.name) + '"></a>'
          + '<div class="tx"><b>' + esc(it.id) + '</b><a href="' + href + '">' + esc(it.name) + '</a></div>'
          + '<div class="mt">' + libOwner(it) + ' · ' + esc((it.tags || []).join(' / ')) + '</div></div>';
      });
      g += '</div>';
      host.innerHTML = g;
      if(p.id){
        var cur = items.filter(function(it){ return it.id === p.id; })[0];
        if(cur){
          lbImg.src = cur.file;
          lbImg.alt = cur.id + ' ' + cur.name;
          lbCap.textContent = cur.id + ' · ' + cur.name + ' · ' + cur.desc;
          lb.classList.add('on');
        }
      }
    });
  }

      + kpi(t.groups.length, '分组', '按作废原因分目录')
      + kpi('0', '进入档案', '不写 manifest、不上展示页')
      + kpi('折叠', '默认展示', '展开后才加载图片')
      + '</div>';

    h += '<h2 class="sec">用户点名判退<span class="hint">原话留档，作为弃用原因依据</span></h2>';
    h += '<div class="panel"><table class="quotes"><tbody>';
    t.quotes.forEach(function(q){ h += '<tr><td>' + esc(q[0]) + '</td><td>' + esc(q[1]) + '</td></tr>'; });
    h += '</tbody></table></div>';

    h += '<h2 class="sec">废稿分组<span class="hint">点标题展开 · 图片按需懒加载</span>'
      + '<button class="btn" id="tall" type="button">全部展开</button></h2>';
    t.groups.forEach(function(g){
      h += '<details class="tgroup"><summary><span class="arrow">▶</span><b>' + esc(g.title) + '</b>'
        + '<span class="pill">' + esc(g.id) + '</span><span class="c">' + g.count + ' 件</span></summary>'
        + '<div class="inner"><div class="reason">' + esc(g.reason) + '</div><div class="tgrid">';
      g.files.forEach(function(f){
        h += '<div class="tcell"><div class="im"><img loading="lazy" decoding="async" src="' + esc(f.src) + '" alt="' + esc(f.label) + '" data-full="' + esc(f.src) + '" data-cap="' + esc(f.label) + '"></div>'
          + '<div class="t">' + esc(f.label) + (f.note ? '<em>' + esc(f.note) + '</em>' : '') + '</div></div>';
      });
      h += '</div></div></details>';
    });
    app.innerHTML = h;
    var btn = document.getElementById('tall');
    if(btn){
      btn.addEventListener('click', function(){
        var open = btn.getAttribute('data-open') !== '1';
        var ds = document.querySelectorAll('.tgroup');
        for(var i=0;i<ds.length;i++) ds[i].open = open;
        btn.setAttribute('data-open', open ? '1' : '0');
        btn.textContent = open ? '全部收起' : '全部展开';
      });
    }
  }

  /* ---------- 顶栏工具 ---------- */
  var RSTACK = [];
  function bindTop(){
    var wb = document.getElementById('worldBtn');
    var sb = document.getElementById('setBtn');
    var bb = document.getElementById('backBtn');
    var sn = document.getElementById('sndBtn');
    if(wb) wb.addEventListener('click', function(){ SND.click(); openPop('popWorld', wb); paintWorld(); });
    if(sb) sb.addEventListener('click', function(){ SND.click(); openPop('popSet', sb); });
    if(sn) sn.addEventListener('click', function(){ toggleSnd(); });
    if(bb) bb.addEventListener('click', function(){
      SND.click();
      RSTACK.pop();
      var prev = RSTACK[RSTACK.length - 1] || '#/';
      if(prev === location.hash) prev = '#/';
      location.hash = prev;
    });
    var swS = document.getElementById('swSnd');
    if(swS) swS.addEventListener('click', function(){ toggleSnd(); });
    var swM = document.getElementById('swMotion');
    if(swM) swM.addEventListener('click', function(){ setMotion(!swM.classList.contains('on')); toast(swM.classList.contains('on') ? '界面动效：开' : '界面动效：关'); });
    function flipTime(){
      WORLD.pause(!WORLD.paused());
      paintWorld();
      toast(WORLD.paused() ? '时间流已暂停' : '时间流已继续');
    }
    var swT = document.getElementById('swTime');
    if(swT) swT.addEventListener('click', flipTime);
    var pp = document.getElementById('pwPause');
    if(pp) pp.addEventListener('click', flipTime);
    var rs = document.getElementById('btnReset');
    if(rs) rs.addEventListener('click', function(){
      try{ localStorage.removeItem(LAST_KEY); localStorage.removeItem('xs_world_v1'); }catch(e){}
      WORLD.reset();
      paintWorld();
      toast('已清除本地记忆：上次查看与时间种子');
      render();
    });
    /* 点空白关浮层 */
    document.addEventListener('click', function(e){
      if(POP && !e.target.closest('.pop') && !e.target.closest('#worldBtn') && !e.target.closest('#setBtn')) closePop();
    });
    /* 全局点击音：链接交给路由音，雷达轴/头像单独处理 */
    document.addEventListener('click', function(e){
      if(!SND.isOn() || !SND.supported) return;
      if(e.target.closest('a')) return;
      if(e.target.closest('.ov-radar .ax')) return;
      if(e.target.closest('.ov-av')) return;
      if(e.target.closest('button, summary, .sw, .ov-link')) SND.click();
    });
  }

  /* ---------- 路由 ---------- */
  function nav(route){
    var tabs = document.querySelectorAll('#tabs a');
    for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on', tabs[i].getAttribute('data-r')===route);
  }
  function render(){
    lb.classList.remove('on');
    closePop();
    var hash = location.hash || '#/';
    if(RSTACK[RSTACK.length-1] !== hash) RSTACK.push(hash);
    var isDetail = hash.indexOf('#/crew/') === 0 && hash.length > 7;
    var isCrewRoot = !isDetail && hash.indexOf('#/crew') === 0;
    var isLib = hash.indexOf('#/lib') === 0;
    document.body.classList.toggle('dark', !(isDetail || isCrewRoot || isLib || hash === '#/board' || hash === '#/trash'));
    if(!(isDetail || isCrewRoot)) document.documentElement.style.removeProperty('--accent');
    var bb = document.getElementById('backBtn');
    if(bb) bb.hidden = !(isDetail || isCrewRoot || isLib || hash === '#/board' || hash === '#/trash');
    if(isDetail){ viewCrew(hash.slice(7)); nav('crew'); }
    else if(isCrewRoot){ viewCrewPicker(); nav('crew'); }
    else if(isLib){ viewLib(hash.replace(/^#\/lib/, '')); nav('lib'); }
    else if(hash === '#/board'){ viewBoard(); nav('board'); }
    else if(hash === '#/trash'){ viewTrash(); nav('trash'); }
    else { viewOverview(); nav('overview'); }
  }

  var m = D.meta;
  document.getElementById('foot').innerHTML =
    '玄枢号项目 · 工作台 &nbsp;|&nbsp; ' + m.crewCount + ' 位舰员 / ' + m.artwork + ' 张入档 / ' + m.missing + ' 个待补姿势位 / ' + m.trash + ' 件废稿<br>'
    + '上线范围：<code>01_舰员档案库</code> + <code>03_弃用图区</code>；<code>02_人物示例图库</code>、<code>04_待存档工作稿</code>、<code>05_未归档散稿</code> 仅本地保留。<br>'
    + '数据源：' + esc(m.note);

  window.addEventListener('hashchange', function(){ SND.page(); render(); });
  ['pointerdown', 'keydown', 'touchstart'].forEach(function(ev){
    document.addEventListener(ev, function(){ SND.arm(); }, {once: true, capture: true});
  });
  bindTop();
  setMotion(motionOn());
  paintSnd();
  paintWorld();
  setInterval(paintWorld, 1000);
  window.addEventListener('pagehide', function(){ WORLD.save(); });
  render();
})();
</script>
</body>
</html>
