  /* ---------- 体征推演 / 事件流 / 性癖计数（站内补写） ---------- */
  var KINK_KEY = 'xs_kink_v1';
  function seedOf(s){
    var h = 2166136261;
    s = String(s || '');
    for(var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 10000) / 10000;
  }
  function fracOf(t, p){ var x = t / p; return x - Math.floor(x); }
  function triOf(t, p){ var x = fracOf(t, p); return x < .5 ? x * 2 : 2 - x * 2; }
  function clampV(v, a, b){ return Math.max(a, Math.min(b, v)); }
  function ageOf(c){
    var s = (c.profile && c.profile['年龄']) || '';
    var m = /(\d+(?:\.\d+)?)\s*岁/.exec(s);
    var a = m ? parseFloat(m[1]) : 24;
    var mm = /岁\s*(\d+)\s*个月/.exec(s);
    if(mm) a += parseInt(mm[1], 10) / 12;
    return a;
  }
  function ageKnown(c){ return /(\d+(?:\.\d+)?)\s*岁/.test((c.profile && c.profile['年龄']) || ''); }
  function heightOf(c){
    var m = /(\d{3})\s*cm/.exec((c.profile && c.profile['身高']) || '');
    return m ? parseInt(m[1], 10) : 165;
  }
  function baseWeightOf(c){
    var con = (c.attrs && c.attrs.体质) || 50;
    return Math.round(((heightOf(c) - 100) * 0.72 + (con - 50) * 0.12 + seedOf(c.id) * 3) * 10) / 10;
  }
  function lifespanOf(c){
    var con = (c.attrs && c.attrs.体质) || 50;
    return Math.round(60 + con * 0.3 + seedOf(c.id + 'life') * 5);
  }
  function vitalsFor(c){
    var y = WORLD.now(), t = Math.max(0, y - WORLD.START), ph = seedOf(c.id) * 3;
    var age = ageOf(c) + t, life = lifespanOf(c);
    var con = (c.attrs && c.attrs.体质) || 50;
    var hunger = clampV(16 + 84 * triOf(t + ph, 0.62), 0, 100);
    var thirst = clampV(14 + 86 * triOf(t + ph * 1.7, 0.47), 0, 100);
    var urine  = clampV(10 + 90 * triOf(t + ph * 2.3, 0.53), 0, 100);
    var stool  = clampV(8 + 92 * triOf(t + ph * 0.7, 0.86), 0, 100);
    var sleepy = clampV(12 + 88 * triOf(t + ph * 1.3, 1.15), 0, 100);
    var disease = clampV(4 + 60 * Math.pow(triOf(t + ph * 2.9, 6.4), 3), 0, 100);
    var pain   = clampV(disease * 0.72 + 18 * triOf(t + ph * 3.1, 1.9), 0, 100);
    var irrit  = clampV(hunger * 0.22 + thirst * 0.2 + sleepy * 0.24 + pain * 0.25 + 8 * triOf(t + ph, 0.37), 0, 100);
    var sanity = clampV(100 - irrit * 0.55 - pain * 0.45 + (con - 50) * 0.25, 0, 100);
    var mood   = clampV(52 + (con - 50) * 0.3 - irrit * 0.3 + 10 * (triOf(t + ph * 2, 2.7) - .5), 0, 100);
    var weight = baseWeightOf(c) + Math.sin((t + ph) * 2 * Math.PI / 1.6) * 0.6;
    function tone(v){ return v >= 75 ? 'bad' : (v >= 50 ? 'warn' : ''); }
    function toneUp(v){ return v < 30 ? 'bad' : (v < 50 ? 'warn' : ''); }
    return [
      {k:'age', label:'岁数', text:(age < 1 ? age.toFixed(2) : age.toFixed(1)) + ' 岁', pct:clampV(age / life * 100, 0, 100), tone:age / life > .92 ? 'warn' : '', sub:(ageKnown(c) ? '' : '推定 · ') + '寿命推演 ~' + life + ' 岁'},
      {k:'weight', label:'体重', text:weight.toFixed(1) + ' kg', pct:clampV(weight / (baseWeightOf(c) * 1.28) * 100, 0, 100), tone:'', sub:'基准 ' + baseWeightOf(c).toFixed(1) + ' kg'},
      {k:'hunger', label:'饥饿', text:Math.round(hunger) + ' / 100', pct:hunger, tone:tone(hunger), sub:hunger < 20 ? '饱腹' : hunger < 45 ? '正常' : hunger < 70 ? '空腹' : '饥饿'},
      {k:'thirst', label:'口渴', text:Math.round(thirst) + ' / 100', pct:thirst, tone:tone(thirst), sub:thirst < 20 ? '充足' : thirst < 45 ? '正常' : thirst < 70 ? '口干' : '干渴'},
      {k:'urine', label:'尿意', text:Math.round(urine) + ' / 100', pct:urine, tone:tone(urine), sub:urine < 25 ? '无感' : urine < 50 ? '轻微' : urine < 75 ? '明显' : '憋胀'},
      {k:'stool', label:'便意', text:Math.round(stool) + ' / 100', pct:stool, tone:tone(stool), sub:stool < 25 ? '无感' : stool < 50 ? '轻微' : stool < 75 ? '明显' : '紧迫'},
      {k:'irrit', label:'烦躁', text:Math.round(irrit) + ' / 100', pct:irrit, tone:tone(irrit), sub:irrit < 25 ? '平静' : irrit < 50 ? '略躁' : irrit < 75 ? '烦躁' : '易怒'},
      {k:'sanity', label:'理智', text:Math.round(sanity) + ' / 100', pct:sanity, tone:toneUp(sanity), sub:sanity >= 80 ? '清明' : sanity >= 60 ? '稳定' : sanity >= 40 ? '恍惚' : '涣散'},
      {k:'mood', label:'心情', text:Math.round(mood) + ' / 100', pct:mood, tone:toneUp(mood), sub:mood >= 75 ? '愉快' : mood >= 55 ? '平稳' : mood >= 35 ? '低落' : '消沉'},
      {k:'sleepy', label:'困意', text:Math.round(sleepy) + ' / 100', pct:sleepy, tone:tone(sleepy), sub:sleepy < 25 ? '清醒' : sleepy < 50 ? '一般' : sleepy < 75 ? '困倦' : '嗜睡'},
      {k:'disease', label:'疾病', text:Math.round(disease) + ' / 100', pct:disease, tone:tone(disease), sub:disease < 10 ? '健康' : disease < 30 ? '轻微' : disease < 55 ? '不适' : '患病'},
      {k:'pain', label:'痛苦', text:Math.round(pain) + ' / 100', pct:pain, tone:tone(pain), sub:pain < 10 ? '无痛' : pain < 30 ? '轻微' : pain < 55 ? '酸痛' : '剧痛'}
    ];
  }

  function eventsFor(c){
    var now = WORLD.now(), birth = WORLD.START - ageOf(c), life = lifespanOf(c), death = birth + life;
    var evs = [];
    function push(y, tt, dd, k){ evs.push({y:y, t:tt, d:dd, k:k}); }

    if(c.clone && c.clone.units){

    var join = birth + Math.max(18, ageOf(c));

    push(death, '寿命终点', '按体质推演 ' + life + ' 岁 · ' + (death <= now ? '已记为死亡事件' : '预计未发生'), death <= now ? 'dead' : 'future');
    return evs;
  }
  function eventLogHTML(c){
    var now = WORLD.now(), evs = eventsFor(c);
    evs.push({y:now, t:'现在', d:'玄枢历 ' + fmtNum(now) + ' 年 · 年龄 ' + (ageOf(c) + Math.max(0, now - WORLD.START)).toFixed(1) + ' 岁', k:'now'});

  function kinkDefault(c){ return Math.max(1, Math.min(5, Math.round(((c.attrs && c.attrs.体质) || 50) / 20))); }
  function kinkGet(c){
    try{
      var o = JSON.parse(localStorage.getItem(KINK_KEY) || '{}');
      if(o && typeof o[c.id] === 'number') return o[c.id];
    }catch(e){}
    return kinkDefault(c);
  }
  function kinkSet(c, v){
    var o = {};
    try{ o = JSON.parse(localStorage.getItem(KINK_KEY) || '{}') || {}; }catch(e){}
    o[c.id] = v;
    try{ localStorage.setItem(KINK_KEY, JSON.stringify(o)); }catch(e){}
  }

      + '</dl><div class="tiny" style="margin-top:6px">剩余次数为站内补写的互动计数，存于本机；刷新不丢。</div></details>';

  /* ---------- 舱室页 #/rooms ---------- */
  var ROOMS = null, ROOMS_META = null, ROOMS_BUSY = false, ROOMS_ERR = false, ROOM_BY = {}, RQ = '', ROOMS_Q = [];

  function roomsLoad(cb){
    if(ROOMS) return cb();
    ROOMS_Q.push(cb);
    if(ROOMS_BUSY) return;
    ROOMS_BUSY = true;
    fetch('rooms.json', {cache: 'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(j){
        ROOMS = j.rooms || [];
        ROOMS_META = j.meta || {};
        ROOM_BY = {};
        ROOMS.forEach(function(x){ ROOM_BY[x.id] = x; });
        ROOMS_ERR = false;
      })
      .catch(function(){ ROOMS = null; ROOMS_ERR = true; })
      .then(function(){
        ROOMS_BUSY = false;
        var q = ROOMS_Q; ROOMS_Q = [];
        q.forEach(function(f){ try{ f(); }catch(e){} });
      });
  }

  function roomById(id){ return ROOM_BY[id] || null; }
  function roomSegMeta(k){
    var segs = (ROOMS_META && ROOMS_META.segs) || [];
    for(var i = 0; i < segs.length; i++) if(segs[i].k === k) return segs[i];
    return null;
  }
  function roomStatusCls(s){ return s === '在用' ? 'st-ok' : (s === '检修' ? 'st-warn' : 'st-off'); }
  function roomPhoto(r){
    if(r.photo){
      return '<img loading="lazy" decoding="async" src="' + esc(r.photo) + '" alt="' + esc(r.id + ' ' + r.name) + '"'
        + ' data-full="' + esc(r.photo) + '" data-cap="' + esc(r.id + ' · ' + r.name + ' · ' + (r.desc || '')) + '">';
    }
    return '<div class="ph"><i>' + esc(r.id) + '</i><em>待补图</em></div>';
  }
  function roomQuery(o){
    var a = [];
    if(o.seg && o.seg !== 'all') a.push('seg=' + encodeURIComponent(o.seg));
    if(o.id) a.push('id=' + encodeURIComponent(o.id));
    return a.length ? '?' + a.join('&') : '';
  }
  function roomCard(r, active){
    return '<a class="rcard' + (active ? ' on' : '') + '" href="#/rooms' + roomQuery({seg: r.seg, id: r.id}) + '">'
      + '<div class="im">' + roomPhoto(r)
      +   '<span class="id">' + esc(r.id) + '</span>'
      +   '<span class="st' + (r.status === '在用' ? '' : (r.status === '检修' ? ' warn' : ' off')) + '">' + esc(r.status) + '</span>'
      + '</div>'
      + '<div class="bd">'
      +   '<div class="r1"><b>' + esc(r.id) + '</b><em>' + esc(r.en) + '</em></div>'
      +   '<div class="nm">' + esc(r.name) + '</div>'
      +   '<div class="ds">' + esc(r.desc) + '</div>'
      +   '<div class="ft"><span>' + esc(r.deck) + ' · ' + esc(r.zone) + '</span><span>' + esc(r.cap) + '</span></div>'
      + '</div></a>';
  }
  function roomDetail(r){
    var seg = roomSegMeta(r.seg);
    var eqs = (r.equip || []).map(function(id){
      var it = null;
      (GEAR || []).forEach(function(x){ if(x.id === id) it = x; });
      return '<a class="eqc" href="#/gear?eq=' + encodeURIComponent(id) + '"><b>' + esc(id) + '</b>' + esc(it ? it.name : '待补条目') + '</a>';
    }).join('');
    var nbs = (r.links || []).map(function(l){
      var t = roomById(l.id);
      return '<a class="nb" href="#/rooms' + roomQuery({seg: (t || {}).seg || r.seg, id: l.id}) + '">'
        + '<em>' + esc(l.id) + '</em><span>' + esc((t || {}).name || '—') + '</span>'
        + '<span class="md">' + esc(l.modeName || l.mode) + '</span>'
        + '<span class="tm">' + esc(l.dir || '双向') + ' · ' + esc(l.sec) + ' s</span></a>';
    }).join('');
    return '<div class="dt">'
      + '<div class="im">' + roomPhoto(r) + '</div>'
      + '<div class="bd">'
      +   '<div class="cr">' + esc(r.id) + ' · ' + esc(r.deck) + ' · ' + esc(r.zone) + '</div>'
      +   '<h2>' + esc(r.name) + '<span class="pill ' + roomStatusCls(r.status) + '">' + esc(r.status) + '</span>'
      +     '<span class="pill blue">' + esc(seg ? seg.mark + ' ' + seg.label : r.seg) + '</span></h2>'
      +   '<p class="ds">' + esc(r.desc) + '</p>'
      +   '<dl>'
      +     '<dt>容量</dt><dd>' + esc(r.cap) + '</dd>'
      +     '<dt>门制</dt><dd>' + esc(r.doorName || r.door) + '</dd>'
      +     '<dt>气压</dt><dd>' + esc(r.pressure ? (r.pressure.label + (r.pressure.pa ? ' · ' + (r.pressure.pa > 0 ? '+' : '') + r.pressure.pa + ' Pa' : '')) : '—') + '</dd>'
      +     '<dt>避险</dt><dd>' + (r.shelter ? '是 · 本舱为避险点' : '否') + '</dd>'
      +     '<dt>撤离</dt><dd>' + esc(r.evac || '—') + '</dd>'
      +   '</dl>'
      +   '<div class="blk"><b>功能 <i>FUNCTIONS</i></b><ul class="fn">' + (r.func || []).map(function(f){ return '<li>' + esc(f) + '</li>'; }).join('') + '</ul></div>'
      +   '<div class="blk"><b>设备挂接 <i>EQUIPMENT · ' + (r.equip || []).length + '</i></b><div class="eqs">'
      +     (eqs || '<span class="tiny">本舱未挂接装备条目。</span>') + '</div></div>'
      +   '<div class="blk"><b>邻接动线 <i>ADJACENCY · ' + (r.links || []).length + '</i></b>' + nbs + '</div>'
      + '</div></div>';
  }
  function viewRooms(q){
    var p = {};
    (q || '').replace(/^\?/, '').split('&').forEach(function(kv){
      if(!kv) return;
      var a = kv.split('=');
      p[decodeURIComponent(a[0])] = decodeURIComponent(a[1] || '');
    });
    var seg = p.seg || 'all', id = p.id || '';
    var h = '<div class="crumbs"><a href="#/">总览</a><span>/</span><span>舱室与动线</span></div>';
    h += '<div class="pick-head"><h1>舱室与动线</h1><span class="sub" id="roomSub">索引加载中…</span></div>';
    h += '<div class="chips" id="roomChips"></div>';
    h += '<div class="gear-tools">'
      + '<label class="gsearch"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>'
      + '<input id="rq" type="search" value="' + esc(RQ) + '" placeholder="搜索编号 / 房间名 / 功能" aria-label="搜索舱室"></label>'
      + '<span class="gcount" id="roomCount"></span></div>';
    h += '<div id="roomDetail"></div><div id="roomBody"><div class="lib-empty">正在读取 rooms.json…</div></div>';
    app.innerHTML = h;
    roomsLoad(function(){
      var host = document.getElementById('roomBody');
      if(!host) return;
      if(ROOMS_ERR || !ROOMS){
        host.innerHTML = '<div class="lib-empty">舱室索引读取失败。<button class="btn" type="button" onclick="location.reload()">重试</button></div>';
        return;
      }
      var sub = document.getElementById('roomSub');
      if(sub){
        var pairs = 0, mounts = 0;
        ROOMS.forEach(function(r){ pairs += (r.links || []).length; mounts += (r.equip || []).length; });
        sub.textContent = ROOMS.length + ' 间舱室 · ' + Math.round(pairs / 2) + ' 组邻接 · ' + mounts + ' 处设备挂接';
      }
      var chips = document.getElementById('roomChips');
      chips.innerHTML = '<a class="' + (seg === 'all' ? 'on' : '') + '" href="#/rooms">全部 ' + ROOMS.length + '</a>'
        + ((ROOMS_META && ROOMS_META.segs) || []).map(function(s){
            var n = ROOMS.filter(function(r){ return r.seg === s.k; }).length;
            return '<a class="' + (seg === s.k ? 'on' : '') + '" href="#/rooms' + roomQuery({seg: s.k}) + '">'
              + esc(s.mark + ' ' + s.label) + ' <i style="font-style:normal;opacity:.55">' + n + '</i></a>';
          }).join('');
      var det = document.getElementById('roomDetail');
      var cur = id ? roomById(id) : null;
      det.innerHTML = cur ? roomDetail(cur) : '';
      function paint(){
        var k = RQ.trim().toLowerCase();
        var list = ROOMS.filter(function(r){
          if(seg !== 'all' && r.seg !== seg) return false;
          if(!k) return true;
          return (r.id + ' ' + r.name + ' ' + (r.en || '') + ' ' + (r.func || []).join(' ') + ' ' + r.desc).toLowerCase().indexOf(k) >= 0;
        });
        var cnt = document.getElementById('roomCount');
        if(cnt) cnt.textContent = '显示 ' + list.length + ' / ' + ROOMS.length + ' 间';
        if(!list.length){
          host.innerHTML = '<div class="lib-empty">没有符合条件的舱室。 <a href="#/rooms">清除筛选</a></div>';
          return;
        }
        var segs = (ROOMS_META && ROOMS_META.segs) || [];
        var html = '';
        segs.forEach(function(s){
          var rows = list.filter(function(r){ return r.seg === s.k; });
          if(!rows.length) return;
          html += '<section class="rseg"><div class="rseg-h"><span class="mk">' + esc(s.mark) + '</span><b>'
            + esc(s.label) + '</b><span class="wh">' + esc(s.where || '') + '</span>'
            + '<span class="ct">' + rows.length + ' 间</span></div><div class="rgrid">'
            + rows.map(function(r){ return roomCard(r, r.id === id); }).join('') + '</div></section>';
        });
        host.innerHTML = html;
      }
      var inp = document.getElementById('rq');
      inp.addEventListener('input', function(){ RQ = inp.value; paint(); });
      paint();
      if(cur) window.scrollTo(0, 0);
    });
  }

  /* ---------- 路由 ---------- */
  function nav(route){
    var tabs = document.querySelectorAll('#tabs a');
    for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on', tabs[i].getAttribute('data-r')===route);
  }
  function render(){
    if(lb.classList.contains('on')){
      LBR.open = false;
      clearTimeout(LBR.t);
      lb.classList.remove('on');
      lb.setAttribute('aria-hidden', 'true');
      lb.style.backgroundColor = 'rgba(6,8,10,0)';
      lbFrame.style.transition = 'none';
      lbFrame.style.opacity = '0';
      lbImg.removeAttribute('src');
    }
    closePop();
    closeEqPop();
    var hash = location.hash || '#/';
    if(RSTACK[RSTACK.length-1] !== hash) RSTACK.push(hash);
    var isDetail = hash.indexOf('#/crew/') === 0 && hash.length > 7;
    var isCrewRoot = !isDetail && hash.indexOf('#/crew') === 0;
    var isLib = hash.indexOf('#/lib') === 0;
    var isGear = hash.indexOf('#/gear') === 0;
    var isRooms = hash.indexOf('#/rooms') === 0;
    if(isLib && hash.indexOf('cat=rm') >= 0){
      location.replace('#/rooms');
      return;
    }
    if(isLib && hash.indexOf('cat=eq') >= 0){
      var keep = (hash.split('?')[1] || '').split('&').filter(function(kv){ return kv && kv.indexOf('cat=eq') !== 0; });
      location.replace('#/gear' + (keep.length ? '?' + keep.join('&') : ''));
      return;
    }
    document.body.classList.toggle('dark', !(isDetail || isCrewRoot || isLib || isGear || isRooms || hash === '#/board' || hash === '#/trash'));
    if(!(isDetail || isCrewRoot)) document.documentElement.style.removeProperty('--accent');
    var bb = document.getElementById('backBtn');
    if(bb) bb.hidden = !(isDetail || isCrewRoot || isLib || isGear || isRooms || hash === '#/board' || hash === '#/trash');
    if(isDetail){ viewCrew(hash.slice(7)); nav('crew'); }
    else if(isCrewRoot){ viewCrewPicker(); nav('crew'); }
    else if(isRooms){ viewRooms(hash.replace(/^#\/rooms/, '')); nav('rooms'); }
    else if(isGear){ viewGear(hash.replace(/^#\/gear/, '')); nav('gear'); }
    else if(isLib){ viewLib(hash.replace(/^#\/lib/, '')); nav('lib'); }
    else if(hash === '#/board'){ viewBoard(); nav('board'); }
    else if(hash === '#/trash'){ viewTrash(); nav('trash'); }
    else { viewOverview(); nav('overview'); }
  }

  var m = D.meta;
  document.getElementById('foot').innerHTML =
    '玄枢号项目 · 工作台 &nbsp;|&nbsp; ' + m.crewCount + ' 位舰员 / ' + m.artwork + ' 张入档 / ' + m.missing + ' 个待补姿势位 / ' + m.trash + ' 件废稿<br>'
    + '上线范围：<code>01_舰员档案库</code> + <code>03_弃用图区</code>；<code>02_人物示例图库</code>、<code>04_待存档工作稿</code>、<code>05_未归档散稿</code> 仅本地保留。<br>'
    + '数据源：' + esc(m.note);

  window.addEventListener('hashchange', function(){ SND.page(); render(); });
  ['pointerdown', 'keydown', 'touchstart'].forEach(function(ev){
    document.addEventListener(ev, function(){ SND.arm(); }, {once: true, capture: true});
  });
  bindTop();
  setMotion(motionOn());
  paintSnd();
  paintWorld();
  setInterval(function(){ paintWorld(); paintVitals(); }, 1000);
  window.addEventListener('pagehide', function(){ WORLD.save(); });
  render();
})();
</script>
</body>
</html>
