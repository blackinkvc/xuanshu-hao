    if(swM) swM.addEventListener('click', function(){ setMotion(!swM.classList.contains('on')); toast(swM.classList.contains('on') ? '界面动效：开' : '界面动效：关'); });
    function flipTime(){
      WORLD.pause(!WORLD.paused());
      paintWorld();
      toast(WORLD.paused() ? '时间流已暂停' : '时间流已继续');
    }
    var swT = document.getElementById('swTime');
    if(swT) swT.addEventListener('click', flipTime);
    var pp = document.getElementById('pwPause');
    if(pp) pp.addEventListener('click', flipTime);
    /* 解锁原图与垃圾箱：开→密码框，关→立刻上锁 */
    var swU = document.getElementById('swUnlock');
    var pwW = document.getElementById('pwdWrap');
    var pwI = document.getElementById('pwdIn');
    var pwG = document.getElementById('pwdGo');
    var pwE = document.getElementById('pwdErr');
    function tryPwd(){
      var v = pwI ? pwI.value.trim() : '';
      if(!v) return;
      sha256(v).then(function(h){
        if(h === PWD_SHA){
          setUnlocked(true);
          if(pwW) pwW.hidden = true;
          if(pwW) pwW.classList.remove('bad');
          if(pwE) pwE.textContent = '';
          if(pwI) pwI.value = '';
          toast('已解锁：全站参考图与垃圾箱可见');
        }else{
          if(pwW) pwW.classList.add('bad');
          if(pwE) pwE.textContent = '密码不对，请再试一次';
          if(pwI){ pwI.focus(); pwI.select(); }
        }
      }).catch(function(){
        if(pwE) pwE.textContent = '当前环境不支持安全校验（需 http / https 打开）';
      });
    }
    if(swU) swU.addEventListener('click', function(){
      SND.click();
      if(isUnlocked()){
        setUnlocked(false);
        toast('已上锁：参考图与垃圾箱已隐藏');
        return;
      }
      if(pwW){
        pwW.hidden = false;
        pwW.classList.remove('bad');
        if(pwE) pwE.textContent = '';
        if(pwI){ pwI.value = ''; pwI.focus(); }
      }
    });
    if(pwG) pwG.addEventListener('click', tryPwd);
    if(pwI) pwI.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); tryPwd(); }
    });
    /* 外部清掉 sessionStorage 或换标签：回到前台时重新核对 */
    window.addEventListener('focus', refreshUnlockUI);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshUnlockUI(); });
    refreshUnlockUI();
    var rs = document.getElementById('btnReset');
    if(rs) rs.addEventListener('click', function(){
      try{ localStorage.removeItem(LAST_KEY); localStorage.removeItem('xs_world_v1'); }catch(e){}
      WORLD.reset();
      paintWorld();
      toast('已清除本地记忆：上次查看与时间种子');
      render();
    });
    /* 点空白关浮层 */
    document.addEventListener('click', function(e){
      if(POP && !e.target.closest('.pop') && !e.target.closest('#worldBtn') && !e.target.closest('#setBtn')){
        closePop();
        var w = document.getElementById('pwdWrap');
        if(w) w.hidden = true;
        var pe = document.getElementById('pwdErr');
        if(pe) pe.textContent = '';
      }
    });
    /* 全局点击音：链接交给路由音，雷达轴/头像单独处理 */
    document.addEventListener('click', function(e){
      if(!SND.isOn() || !SND.supported) return;
      if(e.target.closest('a')) return;
      if(e.target.closest('.ov-radar .ax')) return;
      if(e.target.closest('.ov-av')) return;
      if(e.target.closest('button, summary, .sw, .ov-link')) SND.click();
    });
  }

  /* ---------- 舱室页 #/rooms ---------- */
  var ROOMS = null, ROOMS_META = null, ROOMS_BUSY = false, ROOMS_ERR = false, ROOM_BY = {}, ROOM_S = {}, RQ = '', ROOMS_Q = [];
  var RCOLL = {}, UCOLL = {};
  var ROOM_ALL = false;   /* 全局展开态：允许同时展开多间 */
  var ROOM_GROUPS = [
    ['位置与编号', ['房间编号', '单元编号', '甲板', '分区', '房间名']],
    ['功能与尺度', ['用途', '面积m2', '净高m', '定员']],
    ['门与观察窗', ['门（编号/净宽/类型）', '舷窗或观察窗']],
    ['家具与设备', ['家具清单', '设备清单']],
    ['接口与构造', ['送风/回风/水/电/数据接口', '管井位置', '特殊要求']]
  ];

  function roomsLoad(cb){
    if(ROOMS) return cb();
    ROOMS_Q.push(cb);
    if(ROOMS_BUSY) return;
    ROOMS_BUSY = true;
    fetch('rooms.json', {cache: 'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(j){
        ROOMS = j.rooms || [];
        ROOMS_META = j.meta || {};
        ROOM_BY = {}; ROOM_S = {};
        ROOMS.forEach(function(x){
          ROOM_BY[x['房间编号']] = x;
          ROOM_S[x['房间编号']] = [x['房间编号'], x['房间名'], x['用途'], x['单元编号'], x['分区'],
            x['家具清单'], x['设备清单'], x['特殊要求']].join(' ').toLowerCase();
        });
        ROOMS_ERR = false;
        // 面积合计校验：设计值 229,117.5 m²，容差 ±0.05
        var expected = Number(ROOMS_META.areaTotal || 229117.5);
        var tol = Number(ROOMS_META.areaTolerance || 0.05);
        var sum = 0;
        ROOMS.forEach(function(x){ sum += Number(x['面积m2']) || 0; });
        var ok = Math.abs(sum - expected) <= tol;
        window.__ROOMS_AUDIT__ = {count: ROOMS.length, area: Math.round(sum * 10) / 10, expected: expected, tolerance: tol, ok: ok};
        if(!ok){
          console.error('[rooms] 面积合计与设计表不符：页面 ' + sum.toFixed(1) + ' m² / 设计 ' + expected.toFixed(1) + ' m²');
        }else{
          console.info('[rooms] 面积校验通过：' + ROOMS.length + ' 间 / ' + sum.toFixed(1) + ' m²');
        }
      })
      .catch(function(){ ROOMS = null; ROOMS_ERR = true; })
      .then(function(){
        ROOMS_BUSY = false;
        var q = ROOMS_Q; ROOMS_Q = [];
        q.forEach(function(f){ try{ f(); }catch(e){} });
      });
  }

  function roomById(id){ return ROOM_BY[id] || null; }
  function roomDeckMeta(k){
    var ds = (ROOMS_META && ROOMS_META.decks) || [];
    for(var i = 0; i < ds.length; i++) if(ds[i].k === k) return ds[i];
    return null;
  }
  function roomVal(v){ return (v === undefined || v === null || String(v) === '') ? '—' : String(v); }
  function roomQuery(o){
    var a = [];
    if(o.deck && o.deck !== 'all') a.push('deck=' + encodeURIComponent(o.deck));
    if(o.id) a.push('id=' + encodeURIComponent(o.id));
    return a.length ? '?' + a.join('&') : '';
  }
  function roomCard(r, active){
    var deck = roomDeckMeta(r['甲板']);
    var rid = r['房间编号'];
    return '<div class="room-item' + (active ? ' on' : '') + '" data-id="' + esc(rid) + '">'
      + '<a class="deck-node' + (active ? ' on' : '') + '" href="#/rooms' + roomQuery({id: rid}) + '">'
      + '<div class="nl1"><span class="rno">' + esc(rid) + '</span><b>' + esc(r['房间名']) + '</b>'
      +   '<span class="gst"><span class="amt">' + esc(roomVal(r['面积m2'])) + ' m²</span></span></div>'
      + '<div class="nmeta"><span>单元 <b>' + esc(r['单元编号']) + '</b></span>'
      +   '<span>分区 <b>' + esc(r['分区']) + '</b></span>'
      +   '<span>定员 <b>' + esc(r['定员']) + '</b></span>'
      +   '<span>' + esc(deck ? deck.label : r['甲板']) + '</span></div>'
      + '<div class="nuse">' + esc(roomVal(r['用途'])) + '</div>'
      + '</a><div class="room-inline">' + (active ? roomDetail(r) : '') + '</div></div>';
  }
  function roomDetail(r){
    var meta = ROOMS_META || {};
    var fields = meta.sourceFields || [];
    var unit = (meta.units || {})[r['单元编号']] || {};
    var deck = roomDeckMeta(r['甲板']);
    var shown = {};
    var groups = ROOM_GROUPS.map(function(g){
      var rows = g[1].map(function(k){
        shown[k] = 1;
        return '<dt>' + esc(k) + '</dt><dd>' + esc(roomVal(r[k])) + '</dd>';
      }).join('');
      return '<section class="rdg"><h4>' + esc(g[0]) + '</h4><dl>' + rows + '</dl></section>';
    });
    // 兜底：设计表若增列，未分组的字段仍全部展示，不丢字段
    var rest = fields.filter(function(k){ return !shown[k]; });
    if(rest.length){
      groups.push('<section class="rdg"><h4>其他字段</h4><dl>' + rest.map(function(k){
        return '<dt>' + esc(k) + '</dt><dd>' + esc(roomVal(r[k])) + '</dd>';
      }).join('') + '</dl></section>');
    }
    return '<div class="rd-inline">'
      + '<div class="rdi-head"><span class="rno">' + esc(r['房间编号']) + '</span><b>' + esc(r['房间名']) + '</b>'
      +   '<span class="rmeta">' + esc(deck ? deck.label : r['甲板']) + ' · ' + esc(unit.name || '') + ' ' + esc(r['单元编号'])
      +   ' · 分区 ' + esc(r['分区']) + ' · 面积 <b>' + esc(roomVal(r['面积m2'])) + '</b> m²</span></div>'
      + '<div class="rdg-wrap">' + groups.join('') + '</div>'
      + '<div class="rdi-note">以上字段逐项取自 <b>' + esc(meta.source || '房间明细_v3.csv')
      +   '</b> 的同名列，未做换算或改写 · 再次点击该行收起</div>'
      + '</div>';
  }
  function viewRooms(q){
    var p = {};
    var s = String(q || '');
    var pathId = s.match(/^\/([^?]+)/);
    if(pathId){
      p.id = decodeURIComponent(pathId[1]);
    }else{
      s.replace(/^\?/, '').split('&').forEach(function(kv){
        if(!kv) return;
        var a = kv.split('=');
        p[decodeURIComponent(a[0])] = decodeURIComponent(a[1] || '');
      });
    }
    var deck = p.deck || 'all', id = p.id || '';
    var h = '<section class="hud-page rooms-page">';
    h += '<div class="crumb-hud"><a href="#/">总览</a><span class="sl">/</span><span class="cur">舱室明细</span>'
      + '<a class="back" href="#/">← 舰桥</a></div>';
    h += '<div class="page-hud-head"><span class="ph-k">DECK · ROOM REGISTER</span>'
      + '<h1>舱室明细</h1><span class="sub" id="roomSub">索引加载中…</span></div>';
    h += '<div class="rooms-cmd hud-brk">'
      + '<span class="cmd-tag">REG&gt; <b>BY DECK</b></span>'
      + '<button class="rooms-all" id="roomAll" type="button" aria-pressed="false" title="一次展开/收起当前列表里的全部房间">全部展开</button>'
      + '<div id="roomChips"></div>'
      + '<label class="hud-input gsearch"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>'
      + '<input id="rq" type="search" value="' + esc(RQ) + '" placeholder="搜索编号 / 房间名 / 用途 / 单元" aria-label="搜索舱室"></label>'
      + '<span class="gcount" id="roomCount"></span></div>';
    h += '<div class="deck-wrap">'
      + '<div class="deck-tracks" id="roomBody"><div class="gi-empty">正在读取 rooms.json…</div></div></div>';
    h += '</section>';
    app.innerHTML = h;
    roomsLoad(function(){
      var host = document.getElementById('roomBody');
      if(!host) return;
      if(ROOMS_ERR || !ROOMS){
        host.innerHTML = '<div class="gi-empty">舱室索引读取失败。'
          + '<button class="btn" type="button" onclick="location.reload()">重试</button></div>';
        return;
      }
      var decks = (ROOMS_META && ROOMS_META.decks) || [];
      var unitsMeta = (ROOMS_META && ROOMS_META.units) || {};
      if(deck !== 'all' && !roomDeckMeta(deck)) deck = 'all';
      var sub = document.getElementById('roomSub');
      if(sub){
        var areaTxt = Number(ROOMS_META.areaTotal).toFixed(1).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        sub.textContent = ROOMS.length + ' 间舱室 · ' + decks.length + ' 个甲板 · '
          + ROOMS_META.unitCount + ' 个气密单元 · 面积 ' + areaTxt + ' m²';
      }
      var chips = document.getElementById('roomChips');
      chips.innerHTML = '<a class="hud-chip' + (deck === 'all' ? ' on' : '') + '" href="#/rooms">全部 <i>' + ROOMS.length + '</i></a>'
        + decks.map(function(d){
            return '<a class="hud-chip' + (deck === d.k ? ' on' : '') + '" href="#/rooms' + roomQuery({deck: d.k}) + '" title="'
              + esc(d.label) + '">' + esc(d.k) + ' <i>' + d.count + '</i></a>';
          }).join('');
      /* 进入页面：甲板 / 单元默认全部收起，房间详情也不展开（深链定位的除外） */
      RCOLL = {}; UCOLL = {}; ROOM_ALL = false;
      decks.forEach(function(d){ RCOLL[d.k] = 1; });
      Object.keys(unitsMeta).forEach(function(u){ UCOLL[u] = 1; });
      if(deck !== 'all') delete RCOLL[deck];
      var cur = id ? roomById(id) : null;
      if(cur){
        delete RCOLL[cur['甲板']];
        delete UCOLL[cur['单元编号']];
      }
      function docUrl(withId){
        return '#/rooms' + roomQuery({deck: deck === 'all' ? '' : deck, id: withId ? withId : ''});
      }
      function closeRoom(item){
        item.classList.remove('on');
        var node = item.querySelector('.deck-node');
        if(node) node.classList.remove('on');
        var inline = item.querySelector('.room-inline');
        if(inline) inline.innerHTML = '';
      }
      function openRoom(item, updateUrl){
        if(!item || item.classList.contains('on')) return;
        var prev = host.querySelector('.room-item.on');
        if(prev) closeRoom(prev);
        var r = roomById(item.getAttribute('data-id'));
        if(!r) return;
        item.classList.add('on');
        item.querySelector('.deck-node').classList.add('on');
        item.querySelector('.room-inline').innerHTML = roomDetail(r);
        if(updateUrl){
          try{ history.replaceState(null, '', docUrl(r['房间编号'])); }catch(e){}
        }
      }
      function toggleRoom(item){
        if(!item) return;
        if(item.classList.contains('on')){
          /* 收起：只收这一间，其他已展开的保持不动 */
          closeRoom(item);
          try{ history.replaceState(null, '', docUrl('')); }catch(e){}
        }else{
          /* 展开：回到单开逻辑（其他自动收起） */
          openRoom(item, true);
        }
        if(ROOM_ALL){ ROOM_ALL = false; syncAllBtn(); }
      }
      function syncAllBtn(){
        var b = document.getElementById('roomAll');
        if(!b) return;
        b.textContent = ROOM_ALL ? '全部收起' : '全部展开';
        b.setAttribute('aria-pressed', ROOM_ALL ? 'true' : 'false');
        if(ROOM_ALL) b.classList.add('on'); else b.classList.remove('on');
      }
      function setAllOpen(open){
        ROOM_ALL = !!open;
        if(open){ RCOLL = {}; UCOLL = {}; }
        paint();
        syncAllBtn();
        SND.click();
      }
      var allBtn = document.getElementById('roomAll');
      if(allBtn) allBtn.addEventListener('click', function(){ setAllOpen(!ROOM_ALL); });
      host.addEventListener('click', function(e){
        var t = e.target;
        var dh = t.closest && t.closest('.deck-h');
        if(dh){
          var seg = dh.closest('.deck-seg');
          var dk = seg.getAttribute('data-deck');
          var collapsed = seg.classList.toggle('collapsed');
          if(collapsed) RCOLL[dk] = 1; else delete RCOLL[dk];
          dh.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
          var tgd = dh.querySelector('.tg');
          if(tgd) tgd.textContent = collapsed ? '＋' : '－';
          return;
        }
        var uh = t.closest && t.closest('.unit-h');
        if(uh){
          var useg = uh.closest('.unit-seg');
          var uk = useg.getAttribute('data-unit');
          var ucollapsed = useg.classList.toggle('collapsed');
          if(ucollapsed) UCOLL[uk] = 1; else delete UCOLL[uk];
          uh.setAttribute('aria-expanded', ucollapsed ? 'false' : 'true');
          var tgu = uh.querySelector('.tg');
          if(tgu) tgu.textContent = ucollapsed ? '＋' : '－';
          return;
        }
        var a = t.closest && t.closest('.deck-node');
        if(a && host.contains(a)){
          e.preventDefault();
          toggleRoom(a.closest('.room-item'));
        }
      });
      function paint(){
        var k = RQ.trim().toLowerCase();
        var list = ROOMS.filter(function(r){
          if(deck !== 'all' && r['甲板'] !== deck) return false;
          if(!k) return true;
          return (ROOM_S[r['房间编号']] || '').indexOf(k) >= 0;
        });
        var cnt = document.getElementById('roomCount');
        if(cnt) cnt.textContent = '显示 ' + list.length + ' / ' + ROOMS.length + ' 间';
        if(!list.length){
          host.innerHTML = '<div class="gi-empty">没有符合条件的舱室。 <a href="#/rooms">清除筛选</a></div>';
          return;
        }
        var html = '';
        if(id && !cur){
          html += '<div class="gi-empty"><b>该编号不在设计表</b>'
            + esc(id) + ' 不属于 房间明细_v3.csv 的 ' + ROOMS.length + ' 个房间编号，可能来自旧舱室索引。'
            + '<a href="#/rooms">查看全部房间</a></div>';
        }
        decks.forEach(function(d){
          if(deck !== 'all' && d.k !== deck) return;
          var rows = list.filter(function(r){ return r['甲板'] === d.k; });
          if(!rows.length) return;
          var dColl = !!RCOLL[d.k];
          html += '<section class="deck-seg' + (dColl ? ' collapsed' : '') + '" data-deck="' + esc(d.k) + '">'
            + '<button class="deck-h" type="button" aria-expanded="' + (dColl ? 'false' : 'true') + '">'
            + '<span class="mk">' + esc(d.k) + '</span><b>' + esc(d.label) + '</b>'
            + '<span class="wh">' + d.count + ' 间 · 合计 ' + d.area + ' m²</span>'
            + '<span class="ct">显示 ' + rows.length + ' / ' + d.count + '</span>'
            + '<span class="tg">' + (dColl ? '＋' : '－') + '</span></button><div class="deck-body">';
          var ukeys = [];
          rows.forEach(function(r){
            var uk = r['单元编号'];
            if(ukeys.indexOf(uk) < 0) ukeys.push(uk);
          });
          ukeys.forEach(function(uk){
            var urs = rows.filter(function(r){ return r['单元编号'] === uk; });
            var u = unitsMeta[uk] || {};
            var uColl = !!UCOLL[uk];
            var ucnt = u.count ? (urs.length === u.count ? u.count + ' 间' : urs.length + ' / ' + u.count + ' 间') : urs.length + ' 间';
            html += '<section class="unit-seg' + (uColl ? ' collapsed' : '') + '" data-unit="' + esc(uk) + '">'
              + '<button class="unit-h" type="button" aria-expanded="' + (uColl ? 'false' : 'true') + '">'
              + '<span class="uk">' + esc(uk) + '</span><b>' + esc(u.name || '') + '</b>'
              + '<span class="uc">' + ucnt + ' · ' + (u.area || 0) + ' m²</span>'
              + '<span class="tg">' + (uColl ? '＋' : '－') + '</span></button>'
              + '<div class="unit-body">' + urs.map(function(r){ return roomCard(r, ROOM_ALL); }).join('') + '</div></section>';
          });
          html += '</div></section>';
        });
        host.innerHTML = html;
        if(cur){
          var item = host.querySelector('.room-item[data-id="' + cur['房间编号'] + '"]');
          if(item) openRoom(item, false);
        }
      }
      var inp = document.getElementById('rq');
      inp.addEventListener('input', function(){
        RQ = inp.value;
        if(RQ.trim()){ RCOLL = {}; UCOLL = {}; }
        if(ROOM_ALL){ ROOM_ALL = false; syncAllBtn(); }
        cur = null; id = '';
        try{ history.replaceState(null, '', docUrl('')); }catch(e){}
        paint();
      });
      syncAllBtn();
      paint();
      if(cur){
        var citem = host.querySelector('.room-item[data-id="' + cur['房间编号'] + '"]');
        if(citem) citem.scrollIntoView({block: 'center'});
      }
    });
  }

  /* ---------- 舰船设计（独立路由，iframe 承载静态子页） ---------- */
  var SHIP_TABS = [['', '总览'], ['deck', '甲板图'], ['doc', '内部深化'], ['3d', '三维舰体'],
                   ['units', '单元库'], ['render', '渲染图集'], ['log', '总账']];
  function shipTheme(){ return document.body.classList.contains('light') ? 'light' : 'dark'; }
  function viewShip(hash){
    var q = {}, qi = hash.indexOf('?');
    if(qi >= 0){
      hash.slice(qi + 1).split('&').forEach(function(kv){
        if(!kv) return;
        var a = kv.split('=');
        q[decodeURIComponent(a[0])] = decodeURIComponent(a[1] || '');
      });
    }
    var base = qi >= 0 ? hash.slice(0, qi) : hash;
    var sub = base.replace(/^#\/ship\/?/, '');
    var known = SHIP_TABS.some(function(t){ return t[0] === sub; });
    if(!known) sub = '';
    var th = shipTheme();
    var src = 'ship/overview.html?theme=' + th;
    if(sub === 'deck') src = 'ship/deck.html' + (q.d ? '#' + q.d : '');
    else if(sub === 'doc') src = 'ship/interior.html?theme=' + th;
    else if(sub === 'log') src = 'ship/ledger.html?theme=' + th;
    else if(sub === 'render') src = 'ship/gallery.html?theme=' + th;
    else if(sub === 'units') src = 'ship/units/index.html?theme=' + th;
    else if(sub === '3d'){
      var unit = q.unit ? '&unit=' + encodeURIComponent(q.unit) : '';
      src = q.mode === 'interior'
        ? 'ship/3d/index.html?model=hifi&lod=0&glb=models/xuanshu_interior_lod0.glb&manifest=models/manifest_interior.json' + unit
        : 'ship/3d/index.html?lod=1&model=hifi' + unit;
    }
    var h = '<div class="ship-hud"><div class="in"><span class="ttl">舰船设计</span>';
    SHIP_TABS.forEach(function(t){
      h += '<a class="chip' + (t[0] === sub ? ' on' : '') + '" href="#/ship' + (t[0] ? '/' + t[0] : '') + '">' + t[1] + '</a>';
    });
    h += '<span class="grow"></span>';
    if(sub === 'deck'){
      h += '<span class="xchips"><span class="lb">直达</span>'
        + '<a class="' + (!q.d ? 'on' : '') + '" href="#/ship/deck">总览</a>'
        + '<a class="' + (q.d === 'A:fire' ? 'on' : '') + '" href="#/ship/deck?d=A:fire">A · 火灾</a>'
        + '<a class="' + (q.d === 'T3' ? 'on' : '') + '" href="#/ship/deck?d=T3">T3 环层</a></span>';
    }else if(sub === '3d'){
      h += '<span class="xchips"><a class="' + (q.mode === 'interior' ? '' : 'on') + '" href="#/ship/3d">外壳</a>'
        + '<a class="' + (q.mode === 'interior' ? 'on' : '') + '" href="#/ship/3d?mode=interior">内构</a>'
        + (q.unit ? '<span class="lb">定位 ' + esc(q.unit) + '</span>' : '') + '</span>';
    }
    h += '</div></div><iframe class="ship-frame" id="shipFrame" src="' + esc(src)
      + '" title="玄枢号舰船设计" loading="eager"></iframe>';
    app.innerHTML = h;
    fitShipFrame();
    window.scrollTo(0, 0);
  }
  function fitShipFrame(){
    var f = document.getElementById('shipFrame');
    if(!f) return;
    var top = (document.querySelector('header.top') || {offsetHeight: 0}).offsetHeight
            + (document.querySelector('.ship-hud') || {offsetHeight: 0}).offsetHeight;
    f.style.height = Math.max(420, window.innerHeight - top) + 'px';
  }

  /* ---------- 路由 ---------- */
  function nav(route){
    var tabs = document.querySelectorAll('#tabs a');
    for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on', tabs[i].getAttribute('data-r')===route);
  }
  function viewChangelog(){
    var list = window.XS_CHANGELOG || [];
    var h = '';
    h += '<div class="crumb-hud"><a href="#/">总览</a><span class="sl">/</span><span class="cur">版本记录</span>'
      + '<a class="back" href="#/">← 舰桥</a></div>';
    h += '<h2 class="sec">版本记录<span class="hint">共 ' + list.length + ' 次提交 · 按时间倒序，最新一笔在最上</span></h2>';
    h += '<p class="clnote">版本号规则：按提交时间从早到晚顺序递增，最早一笔 v0.1，每笔 +0.1。时间为 UTC+8，精确到分钟；commit 为前七位，可与仓库对号。只更新版本戳与版本记录数据的元数据提交不单列。</p>';
    h += '<div class="panel clwrap">';
    list.forEach(function(it){
      h += '<div class="clrow">'
        + '<span class="clv">' + esc(it.v) + '</span>'
        + '<span class="clt">' + esc(it.t) + '</span>'
        + '<span class="clsha"><code>' + esc(it.sha) + '</code></span>'
        + '<span class="cln">' + esc(it.note) + '</span>'
        + '</div>';
    });
    h += '</div>';
    app.innerHTML = h;
    window.scrollTo(0, 0);
  }

  function render(){
    if(lb.classList.contains('on')){
      LBR.open = false;
      clearTimeout(LBR.t);
      lb.classList.remove('on');
      lb.setAttribute('aria-hidden', 'true');
      lb.style.backgroundColor = 'rgba(6,8,10,0)';
      lbFrame.style.transition = 'none';
      lbFrame.style.opacity = '0';
      lbImg.removeAttribute('src');
    }
    closePop();
    closeEqPop();
    var hash = location.hash || '#/';
    if(RSTACK[RSTACK.length-1] !== hash) RSTACK.push(hash);
    var isDetail = hash.indexOf('#/crew/') === 0 && hash.length > 7;
    var isShip = hash.indexOf('#/ship') === 0;
    var isCrewRoot = !isDetail && hash.indexOf('#/crew') === 0;
    var isLib = hash.indexOf('#/lib') === 0;
    var isGear = hash.indexOf('#/gear') === 0;
    var isRooms = hash.indexOf('#/rooms') === 0;
    if(isLib && hash.indexOf('cat=rm') >= 0){
      location.replace('#/rooms');
      return;
    }
    if(isLib && hash.indexOf('cat=eq') >= 0){
      var keep = (hash.split('?')[1] || '').split('&').filter(function(kv){ return kv && kv.indexOf('cat=eq') !== 0; });
      location.replace('#/gear' + (keep.length ? '?' + keep.join('&') : ''));
      return;
    }
    applyThemeClass();
    document.body.classList.toggle('shipmode', isShip);
    if(!(isDetail || isCrewRoot)) document.documentElement.style.removeProperty('--accent');
    var bb = document.getElementById('backBtn');
    if(bb) bb.hidden = !(isDetail || isCrewRoot || isShip || isLib || isGear || isRooms || hash === '#/board' || hash === '#/trash' || hash === '#/changelog');
    if(isShip){ viewShip(hash); nav('ship'); }
    else if(isDetail){ viewCrew(hash.slice(7)); nav('crew'); }
    else if(isCrewRoot){ viewCrewPicker(); nav('crew'); }
    else if(isRooms){ viewRooms(hash.replace(/^#\/rooms/, '')); nav('rooms'); }
    else if(isGear){ viewGear(hash.replace(/^#\/gear/, '')); nav('gear'); }
    else if(isLib){ viewLib(hash.replace(/^#\/lib/, '')); nav('lib'); }
    else if(hash === '#/board'){ viewBoard(); nav('board'); }
    else if(hash === '#/trash'){ viewTrash(); nav('trash'); }
    else if(hash === '#/changelog'){ viewChangelog(); nav('changelog'); }
    else { viewOverview(); nav('overview'); }
  }

  var BUILD_STAMP = '2026-11-11 12:54 (UTC+8)', BUILD_DATA_V = '202611111254', BUILD_COMMIT = '8a60eb6';
  var _bs = document.getElementById('buildStamp');
  if(_bs) _bs.textContent = BUILD_STAMP + ' · 数据 v' + BUILD_DATA_V + (BUILD_COMMIT ? ' · commit ' + BUILD_COMMIT : '');

  var m = D.meta;
  document.getElementById('foot').innerHTML =
    '玄枢号项目 · 工作台 &nbsp;|&nbsp; ' + m.crewCount + ' 位舰员 / ' + m.artwork + ' 张入档 / ' + m.missing + ' 个待补姿势位 / ' + m.trash + ' 件废稿<br>'
    + '上线范围：<code>01_舰员档案库</code> + <code>03_弃用图区</code>；<code>02_人物示例图库</code>、<code>04_待存档工作稿</code>、<code>05_未归档散稿</code> 仅本地保留。<br>'
    + '数据源：' + esc(m.note)
    + '<br><a class="buildstamp" href="#/changelog" title="查看版本记录">构建 <b>' + BUILD_STAMP + '</b> · 数据 v' + BUILD_DATA_V
    + (BUILD_COMMIT ? ' · commit <code>' + BUILD_COMMIT + '</code>' : '') + '</a>';

  window.addEventListener('hashchange', function(){ SND.page(); render(); });
  window.addEventListener('resize', fitShipFrame);
  ['pointerdown', 'keydown', 'touchstart'].forEach(function(ev){
    document.addEventListener(ev, function(){ SND.arm(); }, {once: true, capture: true});
  });
  bindTop();
  setMotion(motionOn());
  paintSnd();
  paintWorld();
  setInterval(function(){ paintWorld(); paintVitals(); }, 1000);
  window.addEventListener('pagehide', function(){ WORLD.save(); });
  render();
})();
</script>
</body>
