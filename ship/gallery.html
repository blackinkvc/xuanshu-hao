v class="ph"><img loading="lazy" src="renders/ti02.webp" alt="内构剖面 I02"></div><figcaption><b>内构剖面 I02</b><em>内构 · 171 KB</em></figcaption></figure><figure data-g="interior" data-key="i03" data-big="renders/i03.webp"><div class="ph"><img loading="lazy" src="renders/ti03.webp" alt="内构剖面 I03"></div><figcaption><b>内构剖面 I03</b><em>内构 · 23 KB</em></figcaption></figure><figure data-g="interior" data-key="i04" data-big="renders/i04.webp"><div class="ph"><img loading="lazy" src="renders/ti04.webp" alt="内构剖面 I04"></div><figcaption><b>内构剖面 I04</b><em>内构 · 70 KB</em></figcaption></figure><figure data-g="interior" data-key="i05" data-big="renders/i05.webp"><div class="ph"><img loading="lazy" src="renders/ti05.webp" alt="内构剖面 I05"></div><figcaption><b>内构剖面 I05</b><em>内构 · 32 KB</em></figcaption></figure><figure data-g="interior" data-key="i06" data-big="renders/i06.webp"><div class="ph"><img loading="lazy" src="renders/ti06.webp" alt="内构剖面 I06"></div><figcaption><b>内构剖面 I06</b><em>内构 · 24 KB</em></figcaption></figure><figure data-g="interior" data-key="i07" data-big="renders/i07.webp"><div class="ph"><img loading="lazy" src="renders/ti07.webp" alt="内构剖面 I07"></div><figcaption><b>内构剖面 I07</b><em>内构 · 60 KB</em></figcaption></figure><figure data-g="interior" data-key="i08" data-big="renders/i08.webp"><div class="ph"><img loading="lazy" src="renders/ti08.webp" alt="内构剖面 I08"></div><figcaption><b>内构剖面 I08</b><em>内构 · 174 KB</em></figcaption></figure><figure data-g="interior" data-key="i09" data-big="renders/i09.webp"><div class="ph"><img loading="lazy" src="renders/ti09.webp" alt="内构剖面 I09"></div><figcaption><b>内构剖面 I09</b><em>内构 · 70 KB</em></figcaption></figure><figure data-g="interior" data-key="i10" data-big="renders/i10.webp"><div class="ph"><img loading="lazy" src="renders/ti10.webp" alt="内构剖面 I10"></div><figcaption><b>内构剖面 I10</b><em>内构 · 158 KB</em></figcaption></figure><figure data-g="interior" data-key="i11" data-big="renders/i11.webp"><div class="ph"><img loading="lazy" src="renders/ti11.webp" alt="内构剖面 I11"></div><figcaption><b>内构剖面 I11</b><em>内构 · 36 KB</em></figcaption></figure><figure data-g="interior" data-key="i12" data-big="renders/i12.webp"><div class="ph"><img loading="lazy" src="renders/ti12.webp" alt="主环 T2 局部（795 户分摊 26 舱）"></div><figcaption><b>主环 T2 局部（795 户分摊 26 舱）</b><em>内构 · 48 KB</em></figcaption></figure><figure data-g="interior" data-key="i13" data-big="renders/i13.webp"><div class="ph"><img loading="lazy" src="renders/ti13.webp" alt="主环 T1 局部（行政 3 舱 + 教育 C-05）"></div><figcaption><b>主环 T1 局部（行政 3 舱 + 教育 C-05）</b><em>内构 · 38 KB</em></figcaption></figure><figure data-g="interior" data-key="i14" data-big="renders/i14.webp"><div class="ph"><img loading="lazy" src="renders/ti14.webp" alt="主环 T3 局部（礼堂 3 舱 + 看台）"></div><figcaption><b>主环 T3 局部（礼堂 3 舱 + 看台）</b><em>内构 · 56 KB</em></figcaption></figure><figure data-g="interior" data-key="i15" data-big="renders/i15.webp"><div class="ph"><img loading="lazy" src="renders/ti15.webp" alt="主环 T5 局部（仓储 3 舱 + I1-04 叉车）"></div><figcaption><b>主环 T5 局部（仓储 3 舱 + I1-04 叉车）</b><em>内构 · 58 KB</em></figcaption></figure></div><p class="tiny" style="margin-top:16px">原图来自 Blender Cycles 渲染（PNG，2–6 MB 一张），站点版转 webp，长边不超过 2200 px；缩略图 560 px。</p></main><div id="lb" aria-hidden="true"><button class="x" type="button" aria-label="关闭">×</button><button class="pv" type="button" aria-label="上一张">‹</button><img alt=""><button class="nx" type="button" aria-label="下一张">›</button><div class="cap"></div></div>
<script>
(function(){
  var figs=[].slice.call(document.querySelectorAll('#gal figure'));
  var lb=document.getElementById('lb'), img=lb.querySelector('img'), cap=lb.querySelector('.cap');
  var list=[], at=0;
  function paint(){ lb.classList.toggle('on', !!list.length); }
  function open(k){
    var f=figs.find(function(x){return x.dataset.key===k;}); if(!f) return;
    list=figs.filter(function(x){return x.offsetParent!==null;});
    at=Math.max(0,list.indexOf(f)); show();
  }
  function show(){
    var f=list[at]; if(!f) return;
    img.src=f.dataset.big; cap.textContent=f.querySelector('b').textContent+' · '+f.querySelector('em').textContent;
    lb.classList.add('on'); lb.setAttribute('aria-hidden','false');
    lb.querySelector('.pv').disabled=at<=0; lb.querySelector('.nx').disabled=at>=list.length-1;
  }
  function close(){ lb.classList.remove('on'); lb.setAttribute('aria-hidden','true'); img.removeAttribute('src'); }
  document.getElementById('gal').addEventListener('click',function(e){
    var f=e.target.closest('figure'); if(f) open(f.dataset.key);
  });
  lb.addEventListener('click',function(e){
    if(e.target.classList.contains('pv')){ at=Math.max(0,at-1); show(); }
    else if(e.target.classList.contains('nx')){ at=Math.min(list.length-1,at+1); show(); }
    else if(e.target===lb||e.target.classList.contains('x')) close();
  });
  addEventListener('keydown',function(e){
    if(!lb.classList.contains('on')) return;
    if(e.key==='Escape') close();
    if(e.key==='ArrowLeft'){ at=Math.max(0,at-1); show(); }
    if(e.key==='ArrowRight'){ at=Math.min(list.length-1,at+1); show(); }
  });
  document.getElementById('gf').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    [].forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});
    var k=b.dataset.k;
    figs.forEach(function(f){ f.style.display=(!k||f.dataset.g===k)?'':'none'; });
  });
})();
</script>
