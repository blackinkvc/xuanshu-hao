<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>玄枢号 · 三维舰体剖切</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#070b11; --panel:rgba(15,21,29,.82); --line:rgba(120,148,175,.22);
    --tx:#dde6ef; --tx2:#93a2b3; --tx3:#647383;
    --accent:#d9a441; --accent2:#5aa9d6;
    --font:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;max-width:100%;overflow:hidden;overflow-x:hidden}
  body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:13px;
    -webkit-font-smoothing:antialiased}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .hud{position:fixed;z-index:10}
  .mono{font-variant-numeric:tabular-nums}

  header.top{top:0;left:0;right:0;display:flex;align-items:center;gap:14px;
    padding:10px 14px;background:linear-gradient(180deg,rgba(7,11,17,.92),rgba(7,11,17,0));
    pointer-events:none}
  .brand{font-size:15px;letter-spacing:.16em;font-weight:600}
  .brand span{font-size:10px;letter-spacing:.18em;color:var(--tx3);margin-left:8px;font-weight:400}
  .stats{display:flex;gap:16px;margin-left:auto;pointer-events:auto}
  .stats div{text-align:right;line-height:1.15}
  .stats b{font-size:14px;font-weight:600;color:var(--tx);display:block}
  .stats i{font-style:normal;font-size:10px;color:var(--tx3);letter-spacing:.06em}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

  aside.decks{left:10px;top:58px;bottom:86px;width:196px;padding:8px;overflow:auto;
    scrollbar-width:thin}
  aside.decks::-webkit-scrollbar{width:6px}
  aside.decks::-webkit-scrollbar-thumb{background:rgba(120,148,175,.3);border-radius:3px}
  .grp{color:var(--tx3);font-size:10px;letter-spacing:.14em;margin:9px 6px 4px}
  .it{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:6px;
    cursor:pointer;color:var(--tx2);font-size:12px;border:1px solid transparent;line-height:1.3}
  .it:hover{background:rgba(90,169,214,.10);color:var(--tx)}
  .it.on{background:rgba(217,164,65,.14);border-color:rgba(217,164,65,.55);color:var(--tx)}
  .it .dot{width:6px;height:6px;border-radius:1px;flex:0 0 auto;opacity:.85}
  .it .g{margin-left:auto;font-size:10px;color:var(--tx3);font-variant-numeric:tabular-nums}
  .it.all{color:var(--accent2)}

  aside.detail{right:10px;top:58px;width:276px;max-height:calc(100vh - 154px);
    padding:12px;overflow:auto;display:none}
  aside.detail.show{display:block}
  aside.detail .tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:20px;
    border:1px solid var(--line);color:var(--accent2);letter-spacing:.06em}
  aside.detail h2{font-size:15px;margin:8px 0 2px;font-weight:600;letter-spacing:.04em}
  aside.detail .sub{font-size:11px;color:var(--tx3);margin-bottom:10px}
  .kv{display:grid;grid-template-columns:52px 1fr;gap:6px 8px;font-size:12px;line-height:1.55}
  .kv .k{color:var(--tx3);font-size:11px}
  .kv .v{color:var(--tx2)}
  .fn{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
    font-size:12px;line-height:1.65;color:var(--tx2)}
  .closeX{position:absolute;right:9px;top:9px;width:20px;height:20px;line-height:18px;
    text-align:center;border-radius:5px;border:1px solid var(--line);color:var(--tx3);
    cursor:pointer;font-size:13px}
  .closeX:hover{color:var(--tx);border-color:var(--tx3)}

  #stack{margin:0 0 10px;padding:6px 0 7px;border-top:1px solid var(--line);
    border-bottom:1px solid var(--line)}
  #stack .hd{font-size:10px;color:var(--tx3);letter-spacing:.12em;margin:0 6px 5px}
  #stack .st{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;
    cursor:pointer;font-size:11.5px;color:var(--tx2);line-height:1.35}
  #stack .st:hover{background:rgba(90,169,214,.10);color:var(--tx)}
  #stack .st.on{background:rgba(217,164,65,.16);box-shadow:inset 0 0 0 1px rgba(217,164,65,.5);color:var(--tx)}
  #stack .st b{font-weight:600;font-size:10.5px;color:var(--tx);flex:0 0 auto}
  #stack .st .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #stack .st .pp{flex:0 0 auto;font-size:10px;color:var(--tx3)}
  #stack .st .g{flex:0 0 auto;font-size:10.5px;color:var(--tx3);font-variant-numeric:tabular-nums}

  .toolbar{left:10px;right:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;
    align-items:center;padding:8px;border-radius:10px;background:var(--panel);
    border:1px solid var(--line);backdrop-filter:blur(14px)}
  .toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
  button{background:rgba(30,40,52,.9);color:var(--tx2);border:1px solid var(--line);
    border-radius:6px;padding:5px 9px;font-size:11.5px;cursor:pointer;font-family:inherit;
    white-space:nowrap;transition:.14s}
  button:hover{color:var(--tx);border-color:rgba(90,169,214,.6)}
  button.on{background:rgba(217,164,65,.9);border-color:var(--accent);color:#191308;font-weight:600}
  button.ghost{background:transparent}
  .lbl{font-size:10.5px;color:var(--tx3);letter-spacing:.08em;margin-right:1px}
  /* 内构按需分块状态：加载中给明确进度，失败只报单块 */
  .istat{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--tx3);
    letter-spacing:.02em;font-variant-numeric:tabular-nums;max-width:100%;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .istat[hidden]{display:none}
  .istat::before{content:"";width:6px;height:6px;border-radius:50%;background:rgba(120,148,175,.5);
    flex:0 0 auto}
  .istat.loading{color:#e2cfa4}
  .istat.loading::before{background:var(--accent);animation:intpulse 1s ease-in-out infinite}
  .istat.ok{color:#9ec9a8}
  .istat.ok::before{background:#6ec8a0}
  .istat.err{color:#eda87c}
  .istat.err::before{background:#d67c4e}
  .istat .iretry{cursor:pointer;color:var(--accent);border-bottom:1px dotted currentColor;
    margin-left:4px;flex:0 0 auto}
  @keyframes intpulse{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}

  .legend{left:10px;bottom:64px;display:flex;gap:9px;flex-wrap:wrap;max-width:calc(100% - 20px);
    padding:6px 9px;border-radius:8px;background:rgba(10,15,21,.6);border:1px solid var(--line);
    font-size:10.5px;color:var(--tx2)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:1.5px;margin-right:4px;
    vertical-align:-1px}

  .hint{right:12px;bottom:66px;font-size:10.5px;color:var(--tx3);text-align:right;line-height:1.6}

  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#070b11;color:var(--tx3);z-index:50;font-size:12px;letter-spacing:.14em;
    transition:opacity .5s}
  .loading.hide{opacity:0;pointer-events:none}
  #deckBtn{display:none}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:72px;z-index:30;
    max-width:min(600px,calc(100% - 24px));padding:9px 26px 9px 12px;border-radius:8px;
    background:rgba(18,24,32,.95);border:1px solid var(--line);color:var(--tx2);
    font-size:12px;line-height:1.6;box-shadow:0 10px 28px rgba(0,0,0,.55);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .toast[hidden]{display:none}
  .toast b{color:var(--tx);font-weight:600}
  .toast.err{border-color:rgba(214,124,78,.7);background:rgba(34,20,15,.96)}
  .toast.err b{color:#eda87c}
  .toast .x{position:absolute;right:8px;top:6px;width:16px;height:16px;line-height:15px;
    text-align:center;border-radius:4px;color:var(--tx3);cursor:pointer;font-size:13px}
  .toast .x:hover{color:var(--tx);background:rgba(255,255,255,.08)}

  /* ---------------------------------------------------------------- 单元库 */
  .units{position:fixed;inset:0;z-index:26;display:none;flex-direction:column;
    background:radial-gradient(1200px 600px at 70% -10%,#0d1725 0%,#070b11 60%)}
  .units.open{display:flex}
  .uhead{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);
    background:rgba(8,13,20,.9)}
  .uhead .ut{font-size:15px;font-weight:600;letter-spacing:.1em}
  .uhead .ut span{font-size:10px;letter-spacing:.16em;color:var(--tx3);margin-left:8px;font-weight:400}
  .uhead .ustat{display:flex;gap:10px;margin-left:auto;font-size:10.5px;color:var(--tx3);
    font-variant-numeric:tabular-nums;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .uhead .ustat .s{white-space:nowrap}
  .uhead .ustat .s.text{color:#93a2b3}
  .uhead .ustat .s.final{color:#6ec8a0}
  .uhead .ustat .s.draft{color:#c9a86a}
  .uhead .ustat .s.modeled{color:var(--accent)}
  .uhead .ustat .s.revoked{color:#c07a86}
  .uhead .ustat .bt{opacity:.65}

  .ubar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 14px 9px;
    border-bottom:1px solid var(--line);background:rgba(10,16,24,.72)}
  .ubar label{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--tx3);letter-spacing:.08em}
  .ubar select{background:rgba(30,40,52,.92);color:var(--tx);border:1px solid var(--line);
    border-radius:6px;padding:4px 7px;font-size:11.5px;font-family:inherit;max-width:230px}
  .ubar select:focus{outline:none;border-color:rgba(90,169,214,.65)}
  .chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .chipsep{width:1px;height:14px;background:rgba(120,148,175,.35);margin:0 2px}
  .chip{display:inline-flex;align-items:center;gap:5px;background:rgba(30,40,52,.72);
    color:var(--tx2);border:1px solid var(--line);border-radius:20px;padding:3px 9px;
    font-size:11px;cursor:pointer;font-family:inherit;transition:.14s}
  .chip:hover{color:var(--tx);border-color:rgba(90,169,214,.5)}
  .chip.on{background:rgba(217,164,65,.9);border-color:var(--accent);color:#191308;font-weight:600}
  .chip i{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
  .chip b{font-weight:500;font-size:10px;opacity:.6;font-variant-numeric:tabular-nums}
  .chip.on b{opacity:.75}

  .ugrid{flex:1;min-height:0;overflow:auto;padding:12px 14px 26px;display:grid;
    gap:10px;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));
    align-content:start;scrollbar-width:thin}
  .ugrid::-webkit-scrollbar{width:8px}
  .ugrid::-webkit-scrollbar-thumb{background:rgba(120,148,175,.3);border-radius:4px}
  .uempty{grid-column:1/-1;color:var(--tx3);font-size:12px;padding:40px 0;text-align:center}

  .ucard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;
    cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:0;min-width:0}
  .ucard:hover{border-color:rgba(217,164,65,.55);background:rgba(20,28,38,.92);
    transform:translateY(-1px)}
  .ucard.pending{border-style:dashed;opacity:.86}
  .ucard.pending .go{color:var(--tx3)}
  .ucard .uh{display:flex;align-items:center;gap:8px}
  .ucard .uid{font-size:10.5px;letter-spacing:.05em;color:var(--accent2);flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:9.5px;padding:2px 7px;border-radius:20px;border:1px solid;letter-spacing:.06em;
    white-space:nowrap;flex:0 0 auto}
  .badge.st-text{color:#93a2b3;border-color:rgba(120,148,175,.4);background:rgba(120,148,175,.1)}
  .badge.st-final{color:#6ec8a0;border-color:rgba(110,200,160,.6);background:rgba(110,200,160,.13)}
  .badge.st-draft{color:#c9a86a;border-color:rgba(201,168,106,.55);background:rgba(201,168,106,.12)}
  .badge.st-modeled{color:#e8bd6a;border-color:rgba(217,164,65,.65);background:rgba(217,164,65,.16)}
  .badge.st-revoked{color:#c07a86;border-color:rgba(192,122,134,.55);background:rgba(192,122,134,.13)}
  .badge.ty-shared{color:#8fb3c9;border-color:rgba(143,179,201,.42);background:rgba(143,179,201,.1)}
  .uhint{display:none;margin:9px 14px 0;padding:8px 10px;border-radius:8px;font-size:11px;
    line-height:1.65;color:#e2cfa4;border:1px solid rgba(201,168,106,.45);
    background:rgba(201,168,106,.1)}
  .uhint.show{display:block}
  .uhint b{color:#f0dcae;font-weight:600}
  .uhint .x{color:rgba(226,207,164,.55);cursor:pointer;margin-left:6px}
  .uhint .x:hover{color:#f0dcae}
  .ucard.revoked{opacity:.62;cursor:default}
  .ucard.revoked:hover{border-color:var(--line);background:var(--panel);box-shadow:none}
  .ucard.revoked h3{text-decoration:line-through;text-decoration-color:rgba(192,122,134,.65)}
  .ucard h3{font-size:13.5px;margin:6px 0 2px;font-weight:600;letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ucard .loc{font-size:10px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ucard .fn{font-size:11.5px;line-height:1.55;color:var(--tx2);margin:6px 0 0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
  .ucard .umeta{display:flex;gap:10px;margin:7px 0 0;font-size:10.5px;color:var(--tx3);
    font-variant-numeric:tabular-nums;flex-wrap:wrap}
  .ucard .umeta b{color:var(--tx);font-weight:600}
  .ucard .ueq{font-size:10.5px;line-height:1.5;color:var(--tx3);margin-top:6px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ucard .ueq b{color:var(--tx2);font-weight:500}
  .ucard .dim{opacity:.55}
  .ucard .ushot{margin-top:8px;height:96px;border-radius:7px;border:1px dashed rgba(120,148,175,.3);
    background:repeating-linear-gradient(135deg,rgba(120,148,175,.05) 0 6px,transparent 6px 12px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .ucard .ushot.has{border-style:solid;padding:0;overflow:hidden;background:none;position:relative}
  .ucard .ushot img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
  .ucard .ushot .shotag{position:absolute;left:5px;top:5px;z-index:1;font-size:9px;letter-spacing:.08em;
    padding:1px 5px;border-radius:3px;color:#e6d3a8;background:rgba(10,16,22,.72);
    border:1px solid rgba(201,168,106,.5);pointer-events:none}
  .ucard .ushot .ph{font-size:12px;color:var(--tx3);letter-spacing:.14em}
  .ucard .ushot em{font-size:9.5px;color:rgba(120,148,175,.55);font-style:normal}
  .ucard .ufoot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;
    padding-top:7px;border-top:1px solid var(--line);font-size:10.5px}
  .ucard .ufoot .mm{color:var(--tx3);letter-spacing:.06em}
  .ucard .ufoot .mm.ok{color:var(--accent)}
  .ucard .ufoot .go{color:var(--accent2)}

  .lightbox{position:fixed;inset:0;z-index:40;background:rgba(4,7,11,.94);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:zoom-out;
    backdrop-filter:blur(6px)}
  .lightbox[hidden]{display:none}
  .lightbox img{max-width:90vw;max-height:80vh;border-radius:8px;border:1px solid var(--line);
    box-shadow:0 20px 60px rgba(0,0,0,.7)}
  .lightbox .lbc{font-size:11.5px;color:var(--tx3);letter-spacing:.06em}

  @media (max-width:760px){
    header.top{padding:8px 10px;gap:8px}
    .brand{font-size:13px;letter-spacing:.1em}
    .brand span{display:none}
    .stats{display:none}
    aside.decks{left:8px;right:8px;width:auto;top:auto;bottom:88px;height:auto;max-height:56vh;
      display:none;z-index:14}
    aside.decks.open{display:block}
    aside.detail{left:8px;right:8px;width:auto;top:auto;bottom:88px;max-height:44vh;z-index:13}
    .legend,.hint{display:none}
    .toolbar{gap:5px;padding:7px;bottom:6px;left:6px;right:6px}
    button{padding:5px 7px;font-size:11px}
    .toolbar .sep{display:none}
    #deckBtn{display:inline-block}
    .lbl{display:none}
    /* 状态条独占一行，别把六个按钮挤出视口 */
    .istat{flex:1 0 100%;order:9;font-size:10px;white-space:normal;line-height:1.35}
    .toast{bottom:96px;font-size:11.5px;padding:8px 24px 8px 10px}
    .uhead{padding:9px 10px;gap:8px}
    .uhead .ut{font-size:13px;letter-spacing:.06em;white-space:nowrap}
    .uhead .ut span{display:none}
    .uhead .ustat{gap:7px;font-size:10px}
    /* 窄屏只留「命中/总数」，各状态计数在下面的 chips 里已经有了 */
    .uhead .ustat .s{display:none}
    .uhead .ustat .bt{display:none}
    #unitsClose{padding:4px 7px;font-size:11px}
    .ubar{padding:7px 10px;gap:6px 8px;flex-wrap:wrap}
    .ubar label{flex:0 0 auto}
    .ubar select{max-width:118px;font-size:11px}
    .ubar .chips{flex-wrap:wrap;flex:1 0 100%}
    .chip{padding:3px 8px;font-size:10.5px}
    .uhint{margin:8px 10px 0}
    .ugrid{grid-template-columns:1fr;padding:10px 10px 20px;gap:9px}
    .ucard .ushot{height:86px}
    .lightbox img{max-width:94vw;max-height:74vh}
  }
</style>

<body>
<canvas id="c"></canvas>
<div class="loading" id="loading">载入舰体几何 …</div>

<header class="top hud">
  <div class="brand">玄枢号 <span>XUANSHU · HULL SECTION</span></div>
  <div class="stats">
    <div><b class="mono">760</b><i>总长 m</i></div>
    <div><b class="mono">416</b><i>总宽 / 高 m</i></div>
    <div><b class="mono" id="rpmv">2.18</b><i>主环 rpm</i></div>
    <div><b class="mono" id="gv">1.00</b><i>中径 188 m 处 g</i></div>
  </div>
</header>

<aside class="decks panel hud" id="decks"></aside>

<aside class="detail panel hud" id="detail">
  <div class="closeX" id="detailClose">×</div>
  <div id="stack" hidden></div>
  <div id="detailBody"></div>
</aside>

<div class="legend hud" id="legend"></div>
<div class="hint hud">拖拽旋转 · 滚轮推拉 · 右键平移</div>

<div class="toast" id="toast" hidden></div>

<section class="units" id="units" hidden>
  <div class="uhead">
    <div class="ut">单元库 <span>UNIT LIBRARY · 文字占位 → 概念图 → 工程建模</span></div>
    <div class="ustat" id="uCounts"></div>
    <button id="unitsClose" class="ghost">返回三维 ×</button>
  </div>
  <div class="ubar">
    <label>甲板 <select id="fDeck"></select></label>
    <label>分区 <select id="fZone"></select></label>
    <label>类别 <select id="fCat"></select></label>
    <div class="chips" id="fStat"></div>
  </div>
  <div class="uhint" id="uHint"></div>
  <div class="ugrid" id="uGrid"></div>
</section>

<div class="lightbox" id="lightbox" hidden>
  <img id="lbImg" alt="">
  <div class="lbc" id="lbCap"></div>
</div>

<div class="toolbar hud">
  <button id="unitsBtn">单元库</button>
  <span class="sep"></span>
  <button id="modelBtn">模型 程序化</button>
  <button id="interiorBtn">内构</button>
  <span class="istat" id="intStatus" hidden></span>
  <span class="sep"></span>
  <button id="cutBtn">剖切</button>
  <button id="spinBtn" class="on">环自转</button>
  <button id="speedBtn">转速 1×</button>
  <span class="sep"></span>
  <button id="jupiterBtn" class="on">木星</button>
  <span class="sep"></span>
  <span class="lbl">视角</span>
  <button data-view="full" class="on">全景</button>
  <button data-view="side">侧视</button>
  <button data-view="ring">环正面</button>
  <button data-view="core">核心段</button>
  <span class="sep"></span>
  <button id="deckBtn" class="ghost">甲板层</button>
  <button id="resetBtn" class="ghost">复位</button>
</div>

</body>
</html>
