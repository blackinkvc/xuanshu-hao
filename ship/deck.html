/* =====================================================================
   工具
   ===================================================================== */
const $=s=>document.querySelector(s);
const state={deck:'OV',theme:'dark',mode:'none',sel:null,k:1,tx:0,ty:0};
const NS='http://www.w3.org/2000/svg';
const fmt=n=>n.toLocaleString('zh-CN');

function deckById(id){return DECKS.find(d=>d.id===id);}
function ringArea(r,wid){return 2*Math.PI*r*wid;}

function deckStats(d){
  if(d.kind==='ring'){
    const total=ringArea(d.r,d.wid);
    const res=d.zones.filter(z=>z.cat==='res');
    const resArea=res.reduce((s,z)=>s+z.area,0);
    const resPop=res.reduce((s,z)=>s+z.res,0);
    const pub=d.zones.filter(z=>z.cat==='pub'||z.cat==='cmd').reduce((s,z)=>s+z.area,0);
    return {total,usable:total,resArea,resPop,pub,perCap:resPop?resArea/resPop:0,staff:d.zones.reduce((s,z)=>s+z.staff,0)};
  }
  const total=d.len*d.wid;
  const usable=d.zones.reduce((s,z)=>s+z.area,0);
  const res=d.zones.filter(z=>z.cat==='res');
  const resArea=res.reduce((s,z)=>s+z.area,0);
  const resPop=res.reduce((s,z)=>s+z.res,0);
  const pub=d.zones.filter(z=>z.cat==='pub'||z.cat==='cmd').reduce((s,z)=>s+z.area,0);
  return {total,usable,resArea,resPop,pub,perCap:resPop?resArea/resPop:0,staff:d.zones.reduce((s,z)=>s+z.staff,0)};
}

/* =====================================================================
   侧栏
   ===================================================================== */
function buildSide(){
  const el=$('#deckList'); let h='';
  h+=`<div class="grp">总览</div><div class="it ${state.deck==='OV'?'on':''}" data-d="OV"><span>总布置剖面与索引</span><span class="n">22 层</span></div>`;
  for(const k of ['core','spine','ringT','ringE','tail']){
    h+=`<div class="grp">${SEG[k].name}</div>`;
    DECKS.filter(d=>d.seg===k).forEach(d=>{
      const s=deckStats(d);
      h+=`<div class="it ${state.deck===d.id?'on':''}" data-d="${d.id}"><span>${d.id}</span><span class="n">${s.resPop?fmt(s.resPop)+'人':fmt(s.staff)+'岗'}</span></div>`;
    });
  }
  el.innerHTML=h;
  el.querySelectorAll('.it').forEach(n=>n.onclick=()=>{state.deck=n.dataset.d;state.sel=null;resetView();buildSide();renderAll();});
}

/* =====================================================================
   SVG 渲染
   ===================================================================== */
const svg=$('#plan');

function resetView(){state.k=1;state.tx=0;state.ty=0;}

// ---- 竖向动线（相邻层连通与疏散方向）----
const VERT={
  A:'前升降井 ×2 → S1 ｜ 后升降井 ×2 → B ｜ 疏散：经后井下到 B',
  B:'中段升降井 ×2 直连 A/C ｜ 医疗旁专梯 → C ｜ 疏散：下 C 或经 S1 上 A',
  C:'前升降井 ×1 → B ｜ 机库后壁货运开口 → D ｜ 疏散：机库开口下 D',
  D:'升降井 ×2 → C ｜ 尾部加压通道 → I1 ｜ 疏散：向尾部 I1 或经 C 上行',
  S1:'贯通电梯厅 ×1（跨「转/不转」唯一通道，双门互锁）',
  S2:'贯通电梯厅 ×1，双层轿厢 → 主环 T1–T6 / 农环 E1–E6',
  S3:'贯通电梯厅 ×1 → 农环 E6 与工业段 I1',
  I1:'尾部加压通道 ← S3 ｜ 纵向主通道贯通 I2/I3 ｜ 疏散：向 S3 上行，或沿主通道退至 I2 前气闸',
  I2:'纵向主通道 ×1 ｜ 休眠库旁气闸 ×2 ｜ 疏散：沿主通道向 I1 前气闸撤出',
  I3:'纵向主通道 ×1 ｜ 推进舱横舱壁气闸 ×2 ｜ 疏散：向前经 I2 撤出（喷口侧禁止通行）'
};
function vertOf(d){
  if(VERT[d.id]) return VERT[d.id];
  if(d.id[0]==='T') return '0° / 180° 贯通电梯厅 ×2（径向串 T1–T6）｜ 4 条径向疏散通道 ｜ 疏散：向心走到 T1，经 S1 进核心段';
  if(d.id[0]==='E') return 'S2（0°）/ S3（180°）电梯厅 ×2 ｜ 2 条径向通道 ｜ 疏散：向心走到 E1，经 S2 / S3 进连接脊';
  return '';
}

function renderPlan(d){
  $('#statwrap').style.display='none';
  $('#canvas').style.display='block';
  const isRing=d.kind==='ring';
  const W=isRing?560:d.len+16, H=isRing?560:d.wid+16;
  const vb=isRing?'-280 -280 560 560':`-8 -8 ${W} ${H}`;
  svg.setAttribute('viewBox',vb);
  let g='';

  if(isRing){
    // 全部 6 层环带（背景）+ 当前层高亮
    for(let i=0;i<6;i++){
      const r0=d.r-2+4*i, r1=r0+4;
      const op=(Math.round(d.r)===Math.round(r0+2))?1:0.28;
      g+=`<circle cx="0" cy="0" r="${r1}" fill="none" stroke="var(--line)" stroke-width="${4}" opacity="${op*0.9}"/>`;
    }
    // 环带分区（当前层，径向厚度按 5× 放大以便阅读）
    d.zones.forEach(z=>{
      const path=arcPath(d.r-10,d.r+10,z.a0,z.a1);
      g+=`<path d="${path}" class="zrect z-${z.cat} ${state.sel===z.id?'zsel':''}" data-id="${z.id}" fill-rule="evenodd"/>`;
      const path2=arcPath(d.r-11,d.r+11,z.a0,z.a1);
      g+=`<path d="${path2}" fill="transparent" data-id="${z.id}" style="cursor:pointer"/>`;
    });
    // 扇区分界
    d.zones.forEach(z=>{
      [z.a0].forEach(a=>{
        const rad=a*Math.PI/180;
        g+=`<line x1="${Math.cos(rad)*(d.r-10)}" y1="${Math.sin(rad)*(d.r-10)}" x2="${Math.cos(rad)*(d.r+10)}" y2="${Math.sin(rad)*(d.r+10)}" stroke="var(--bg)" stroke-width=".8"/>`;
      });
    });
    // 标签
    d.zones.forEach(z=>{
      const mid=(z.a0+z.a1)/2, rad=mid*Math.PI/180;
      const x1=Math.cos(rad)*(d.r+12), y1=Math.sin(rad)*(d.r+12);
      const x2=Math.cos(rad)*(d.r+30), y2=Math.sin(rad)*(d.r+30);
      const tx=Math.cos(rad)*(d.r+34), ty=Math.sin(rad)*(d.r+34);
      const anchor=Math.cos(rad)>0.15?'start':(Math.cos(rad)<-0.15?'end':'middle');
      g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--tx3)" stroke-width="1"/>`;
      g+=`<text x="${tx}" y="${ty}" text-anchor="${anchor}" class="zlabel" font-size="7">${z.name}</text>`;
      g+=`<text x="${tx}" y="${ty+8}" text-anchor="${anchor}" class="zsub" font-size="5.6">${fmt(z.area)} m² · ${z.staff} 岗${z.res?' · '+z.res+' 人':''}</text>`;
    });
    // 中心
    g+=`<circle cx="0" cy="0" r="${d.r-6}" fill="none" stroke="var(--line)" stroke-dasharray="2 4"/>`;
    g+=`<text x="0" y="-8" text-anchor="middle" class="zlabel" font-size="8">${d.id} · ${d.g}</text>`;
    g+=`<text x="0" y="6" text-anchor="middle" class="zsub" font-size="6">周 ${fmt(Math.round(2*Math.PI*d.r))} m × 宽 ${d.wid} m · ${d.id[0]==='T'?'2.18':'2.16'} rpm（反向）</text>`;
    g+=`<text x="0" y="18" text-anchor="middle" class="zsub" font-size="5.4">层高 3.3 m · 环带径向间距图上放大 5× 以便阅读</text>`;
    g+=`<text x="0" y="-252" text-anchor="middle" fill="var(--tx2)" font-size="6.2">竖向：${vertOf(d)}</text>`;
    // 应急
    if(state.mode!=='none') g+=ringEmergency(d);
  }else{
    // 外壳
    g+=`<defs><pattern id="hatch" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="3.2" class="hatch"/></pattern></defs>`;
    g+=`<rect x="0" y="0" width="${d.len}" height="${d.wid}" class="hull"/>`;
    g+=`<rect x="0" y="0" width="${d.len}" height="${d.wid}" fill="var(--c-circ)" opacity=".55"/>`;
    // 未分区面积（走廊 / 竖井 / 结构）斜线底纹
    g+=`<rect x="0" y="0" width="${d.len}" height="${d.wid}" fill="url(#hatch)" opacity=".55" style="pointer-events:none"/>`;
    const vt=vertOf(d);
    g+=`<text x="1.2" y="-3" fill="var(--tx2)" font-size="${Math.min(1.55, d.len*0.96/Math.max(vt.length,1)).toFixed(2)}">竖向：${vt}</text>`;
    // 网格（10 m）
    for(let x=10;x<d.len;x+=10) g+=`<line x1="${x}" y1="0" x2="${x}" y2="${d.wid}" class="grid"/>`;
    for(let y=10;y<d.wid;y+=10) g+=`<line x1="0" y1="${y}" x2="${d.len}" y2="${y}" class="grid"/>`;
    // 主通道
    g+=`<line x1="0" y1="${d.wid*0.5}" x2="${d.len}" y2="${d.wid*0.5}" class="corr"/>`;
    d.zones.forEach(z=>{
      g+=`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="0.4"
        class="zrect z-${z.cat} ${state.sel===z.id?'zsel':''}" data-id="${z.id}"/>`;
      const fs=Math.min(2.0, z.w/(z.name.length*1.35), z.h*0.38);
      const twoLines=z.w>14;
      const cy=z.y+z.h/2;
      g+=`<text x="${z.x+z.w/2}" y="${twoLines?cy-fs*0.25:cy+fs*0.35}" text-anchor="middle" class="zlabel" font-size="${fs}">${z.name}</text>`;
      if(twoLines) g+=`<text x="${z.x+z.w/2}" y="${cy+fs*1.15}" text-anchor="middle" class="zsub" font-size="${fs*0.78}">${z.staff} 岗${z.res?' · '+z.res+' 人':''}</text>`;
    });
    const rem=d.len*d.wid-d.zones.reduce((s,z)=>s+z.area,0);
    g+=`<text x="${d.len-1.5}" y="${d.wid-1.2}" text-anchor="end" class="zsub" font-size="1.15">${d.gap||'走廊 / 竖井 / 结构'} ${fmt(rem)} m²</text>`;
    if(state.mode==='flow'){
      d.zones.filter(z=>z.cat==='work'||z.cat==='ind').forEach((z,i)=>{
        const y=z.y+z.h/2;
        g+=`<line x1="${z.x}" y1="${y}" x2="${z.x+z.w}" y2="${y}" class="corr dirty" opacity=".55"/>`;
      });
    }
    if(state.mode!=='none' && state.mode!=='flow') g+=rectEmergency(d);
    // 出口
    if(state.mode!=='none') d.exits.forEach(e=>{
      g+=`<circle cx="${e[0]}" cy="${e[1]}" r="2.4" class="exit"/>`;
      g+=`<text x="${e[0]}" y="${e[1]+.8}" text-anchor="middle" font-size="1.6" fill="#cfe" style="pointer-events:none">通</text>`;
    });
  }
  svg.innerHTML=`<g id="vp" transform="translate(0,0) scale(1)">${g}</g>`;
  applyTransform();
  bindZones();
}

function arcPath(r0,r1,a0,a1){
  const p=(r,a)=>[Math.cos(a*Math.PI/180)*r,Math.sin(a*Math.PI/180)*r];
  const A=p(r1,a0),B=p(r1,a1),C=p(r0,a1),Dd=p(r0,a0);
  const large=(a1-a0)>180?1:0;
  return `M${A[0]},${A[1]} A${r1},${r1} 0 ${large} 1 ${B[0]},${B[1]} L${C[0]},${C[1]} A${r0},${r0} 0 ${large} 0 ${Dd[0]},${Dd[1]} Z`;
}

function emColor(m){
  return {depress:'var(--em-d)',fire:'var(--em-f)',rad:'var(--em-r)',lock:'var(--em-l)'}[m];
}
const EMKEY={depress:'d',fire:'f',rad:'r',lock:'l'};

function rectEmergency(d){
  const k=EMKEY[state.mode]; let g='';
  d.zones.forEach(z=>{
    if(z.em[k]>0){
      g+=`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" fill="${emColor(state.mode)}"
        opacity="${0.14+0.16*z.em[k]}" style="pointer-events:none"/>`;
      const c=[z.x+z.w/2,z.y+z.h/2];
      const e=d.exits.reduce((a,b)=>dist(a,c)<dist(b,c)?a:b,d.exits[0]);
      g+=`<line x1="${c[0]}" y1="${c[1]}" x2="${e[0]}" y2="${e[1]}" class="route" stroke="${emColor(state.mode)}" style="pointer-events:none"/>`;
    }
  });
  return g;
}
function ringEmergency(d){
  const k=EMKEY[state.mode]; let g='';
  d.zones.forEach(z=>{
    if(z.em[k]>0){
      const mid=(z.a0+z.a1)/2;
      const path=arcPath(d.r-9,d.r+9,z.a0,z.a1);
      g+=`<path d="${path}" fill="${emColor(state.mode)}" opacity=".22" style="pointer-events:none"/>`;
      // 最近安全节点：0° 或 180°
      const target=(mid<90||mid>270)?0:180;
      const r=d.r;
      const a1=mid*Math.PI/180, a2=target*Math.PI/180;
      const x1=Math.cos(a1)*r,y1=Math.sin(a1)*r,x2=Math.cos(a2)*r,y2=Math.sin(a2)*r;
      g+=`<path d="M${x1},${y1} A${r},${r} 0 0 ${target===0?0:1} ${x2},${y2}" class="route" stroke="${emColor(state.mode)}" style="pointer-events:none"/>`;
    }
  });
  // 安全节点
  [0,180].forEach(a=>{
    const rad=a*Math.PI/180;
    const x=Math.cos(rad)*d.r,y=Math.sin(rad)*d.r;
    g+=`<circle cx="${x}" cy="${y}" r="4" class="exit"/><text x="${x}" y="${y+1.2}" text-anchor="middle" font-size="2.6" fill="#cfe" style="pointer-events:none">通</text>`;
  });
  return g;
}
function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1]);}

function bindZones(){
  svg.querySelectorAll('[data-id]').forEach(el=>{
    el.addEventListener('mouseenter',ev=>showTip(ev,el.dataset.id));
    el.addEventListener('mousemove',ev=>moveTip(ev));
    el.addEventListener('mouseleave',hideTip);
    el.addEventListener('click',ev=>{ev.stopPropagation();state.sel=el.dataset.id;renderAll();});
  });
}

/* 缩放平移 */
function applyTransform(){
  const vp=svg.querySelector('#vp'); if(!vp)return;
  vp.setAttribute('transform',`translate(${state.tx},${state.ty}) scale(${state.k})`);
}
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const vb=svg.viewBox.baseVal;
  const ux=vb.x+mx/r.width*vb.width, uy=vb.y+my/r.height*vb.height;
  const f=e.deltaY<0?1.12:1/1.12;
  const nk=Math.min(14,Math.max(0.5,state.k*f));
  const real=nk/state.k;
  state.tx=ux-(ux-state.tx)*real; state.ty=uy-(uy-state.ty)*real; state.k=nk;
  applyTransform();
},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,tx:state.tx,ty:state.ty};svg.classList.add('drag');});
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
  const sx=vb.width/r.width, sy=vb.height/r.height;
  state.tx=drag.tx+(e.clientX-drag.x)*sx; state.ty=drag.ty+(e.clientY-drag.y)*sy;
  applyTransform();
});
window.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');});

/* 悬停提示 */
function zoneById(id){for(const d of DECKS){const z=d.zones&&d.zones.find(x=>x.id===id);if(z)return {d,z};}return null;}
function showTip(ev,id){
  const f=zoneById(id); if(!f)return;
  const {d,z}=f;
  const tip=$('#tip');
  tip.innerHTML=`<b>${z.name}</b> <span style="color:var(--tx3)">${z.id}</span><br>
    ${fmt(z.area)} m² · 常驻 ${z.staff} 岗${z.res?' · 居住 '+fmt(z.res)+' 人':''}<br>
    <span style="color:var(--tx2)">${z.fn}</span>`;
  tip.style.display='block'; moveTip(ev);
}
function moveTip(ev){const t=$('#tip');t.style.left=(ev.clientX+14)+'px';t.style.top=(ev.clientY+14)+'px';}
function hideTip(){$('#tip').style.display='none';}

function renderLegend(){
  const l=$('#legend');

  // 尺寸线
  g+=`<line x1="0" y1="212" x2="760" y2="212" stroke="var(--tx3)" stroke-width=".5"/>`;
  g+=`<line x1="0" y1="208" x2="0" y2="216" stroke="var(--tx3)"/><line x1="760" y1="208" x2="760" y2="216" stroke="var(--tx3)"/>`;
  g+=`<text x="380" y="222" text-anchor="middle" font-size="7" fill="var(--tx2)">总长 760 m</text>`;
  g+=`<line x1="-24" y1="-200" x2="-24" y2="200" stroke="var(--tx3)" stroke-width=".5"/>`;
  g+=`<text x="-30" y="0" text-anchor="middle" font-size="7" fill="var(--tx2)" transform="rotate(-90,-30,0)">总高 416 m</text>`;
  // 比例尺
  g+=`<g transform="translate(20,232)"><line x1="0" y1="0" x2="100" y2="0" stroke="var(--tx2)" stroke-width="1.4"/>`;
  g+=`<line x1="0" y1="-3" x2="0" y2="3" stroke="var(--tx2)"/><line x1="100" y1="-3" x2="100" y2="3" stroke="var(--tx2)"/>`;
  g+=`<text x="50" y="10" text-anchor="middle" font-size="6" fill="var(--tx2)">100 m</text></g>`;

  // 统计表
  let rows='';
  const groups=[['core','核心段 A–D'],['spine','连接脊 S1–S3'],['ringT','居住环 T1–T6'],['ringE','农环 E1–E6'],['tail','工业尾段 I1–I3']];
  groups.forEach(([k,label])=>{
    rows+=`<tr class="sep"><td colspan="7">${label}</td></tr>`;
    DECKS.filter(d=>d.seg===k).forEach(d=>{
      const s=deckStats(d);
      const pubPct=s.usable?((s.pub/s.usable)*100):0;
      rows+=`<tr><td>${d.id} · ${d.name.split('·')[1]?d.name.split('·')[1].trim():d.name}</td>
        <td>${fmt(Math.round(s.total))}</td><td>${fmt(Math.round(s.usable))}</td>
        <td>${s.resArea?fmt(Math.round(s.resArea)):'—'}</td>
        <td>${s.resPop?fmt(s.resPop):'—'}</td>
        <td>${s.resPop?s.perCap.toFixed(1):'—'}</td>
        <td>${pubPct.toFixed(1)}%</td></tr>`;
    });
  });
  const totalRes=DECKS.reduce((s,d)=>s+d.zones.filter(z=>z.cat==='res').reduce((a,z)=>a+z.res,0),0);
  const totalResArea=DECKS.reduce((s,d)=>s+d.zones.filter(z=>z.cat==='res').reduce((a,z)=>a+z.area,0),0);
  const totalUsable=DECKS.reduce((s,d)=>s+d.zones.reduce((a,z)=>a+z.area,0),0);
  $('#statwrap').innerHTML=`
    <svg class="overview-svg" viewBox="-50 -240 880 500" xmlns="http://www.w3.org/2000/svg">${g}</svg>
    <table>
      <thead><tr><th>甲板</th><th>舱段面积 m²</th><th>分区合计 m²</th><th>居住面积 m²</th><th>居住人数</th><th>人均 m²</th><th>公共空间占比</th></tr></thead>
      <tbody>${rows}
        <tr class="sep"><td>全舰合计</td><td>—</td><td>${fmt(Math.round(totalUsable))}</td><td>${fmt(Math.round(totalResArea))}</td><td>${fmt(totalRes)}</td><td>${(totalResArea/totalRes).toFixed(1)}</td><td>—</td></tr>
      </tbody>
    </table>
    <div class="mini">
      口径：①「舱段面积」= 甲板外包络（核心段 132×32、S 段长×24、环层 = 2πr×环宽、工业段 长×44）；
      ②「分区合计」= 图上所有分区面积之和，差额为走廊、竖井、结构与屏蔽；
      ③「居住面积」只含 cat=居住 的分区，人均 = 居住面积 / 居住人数；
      ④「公共空间占比」= (公共 + 指挥) / 分区合计，不含走廊与交通核，因此偏保守；
      ⑤ 环层为环形展开，面积按 2πr × 环宽 计算，与平面上看到的扇形一一对应。
    </div>`;
}

function rectShape(x,y,w,h,cat,label){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--c-${cat})" stroke="var(--bg)" stroke-width=".6"/>
    <text x="${x+w/2}" y="${y+h/2+2.4}" text-anchor="middle" font-size="6" fill="#fff">${label}</text>`;
}

/* =====================================================================
   工具栏
   ===================================================================== */
function buildToolbar(){
  const tb=$('#toolbar');
  const btns=[['none','常规'],['flow','动线'],['depress','失压'],['fire','火灾'],['rad','辐射'],['lock','封锁']];
  tb.innerHTML=btns.map(([k,t])=>`<button data-m="${k}" class="${state.mode===k?'on':''}">${t}</button>`).join('')
    +`<button id="resetBtn">复位视图</button>`;
  tb.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.m;buildToolbar();renderAll();});
  const rb=$('#resetBtn'); if(rb)rb.onclick=()=>{resetView();applyTransform();};
}

/* =====================================================================
   主渲染
   ===================================================================== */
function renderAll(){
  if(state.deck==='OV'){renderOverview();}
  else{renderPlan(deckById(state.deck));}
  renderDetail();renderLegend();
  const proto=EMTEXT[state.mode]&&EMTEXT[state.mode].p;
  $('.hint').textContent=proto||'滚轮缩放 · 拖拽平移 · 点击分区看详情';
}

$('#themeBtn').onclick=()=>{
  state.theme=state.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=state.theme;
  renderAll();
};

buildSide();buildToolbar();renderAll();

/* 支持 #A / #T3 直接定位 */
if(location.hash){
  const parts=location.hash.slice(1).split(':');
  const id=parts[0], mode=parts[1];
  if(mode&&EMTEXT[mode])state.mode=mode;
  if(id==='OV'||deckById(id)){state.deck=id;state.sel=null;resetView();buildSide();buildToolbar();renderAll();}
}
</script>
</body>
</html>
